<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Mafia Life Simulator</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mafia Life">
<meta name="theme-color" content="#0c0908">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cinzel:wght@600;700;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Noir: kömür zemin, pirinç-altın vurgu, kan kırmızısı tehlike. Tek sütun, telefon odaklı oyun ekranı. */
  --bg:#141113; --panel:#1d191b; --panel2:#272224; --line:#383032; --ink:#f1e8da; --muted:#a69c90;
  --gold:#d2a94f; --gold2:#a9832f; --blood:#b8302f; --good:#62ab76; --warn:#dc9440;
  --display:"Playfair Display",Georgia,serif; --body:"Barlow",system-ui,-apple-system,sans-serif; --cond:"Barlow Condensed","Barlow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{position:fixed;inset:0;width:100%;height:var(--vh,100%);overflow:hidden;touch-action:pan-y}
#log,.sh-b,.full,.card{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#hdr,#ftr{touch-action:none}
#ftr button,#hdr .top{touch-action:manipulation}
#app{height:100%;background:var(--bg)}
#hdr,#ftr,#log{position:fixed;left:0;right:0;max-width:520px;margin:0 auto}
#hdr{top:0;z-index:6;padding-top:env(safe-area-inset-top);background:var(--bg);padding-bottom:6px}
#ftr{bottom:var(--bot,0px);z-index:6;padding-bottom:env(safe-area-inset-bottom);background:var(--panel);box-shadow:0 -8px 20px #0007}
#log{top:var(--th,96px);bottom:var(--bh,210px);z-index:1;overscroll-behavior:contain}

/* Üst bilgi */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg))}
.av{border-radius:50%;background:radial-gradient(circle at 50% 35%,#3b3134,#1a1517 70%);border:2px solid var(--gold2);overflow:hidden;flex:none;display:grid;place-items:center}
.av svg{width:100%;height:100%;display:block}
.who{flex:1;min-width:0}
.who h1{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who p{font-family:var(--cond);font-size:14px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.who p b{color:var(--gold);font-weight:600}
.cash{text-align:right}
#hSet{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold2);background:#0006;font-size:17px;line-height:1;margin-right:8px;align-self:center;padding:0;cursor:pointer}
.cash small{display:block;font-family:var(--cond);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.cash strong{font-family:var(--cond);font-size:20px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}

.banner{display:none;margin:10px 16px 0;padding:8px 12px;border-radius:8px;background:repeating-linear-gradient(90deg,#2b2426 0 10px,#231d1f 10px 20px);border:1px solid var(--line);font-family:var(--cond);font-size:15px;letter-spacing:.03em}
.banner.on{display:block}

/* Günlük */
#log{overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
.yr{padding:10px 0;border-bottom:1px dashed var(--line)}
.yr h3{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.yr p{font-size:15px;line-height:1.45;color:var(--ink);margin:3px 0}
.yr p.good{color:#8fd1a1}.yr p.bad{color:#ec8a80}.yr p.gold{color:var(--gold);font-weight:600}
.yr p.dim{color:var(--muted)}

/* İstatistikler */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
.st label{display:flex;justify-content:space-between;font-family:var(--cond);font-size:13px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.st label b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:#0f0d0e;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s}
.chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;min-width:0;max-width:calc(50% + 32px)}.chips::-webkit-scrollbar{display:none}.chip{flex:none;white-space:nowrap;font-size:12.5px;padding:2px 9px}.chip:last-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip{font-family:var(--cond);font-size:13px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink)}

/* Alt menü */
.nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px 10px;background:var(--panel);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-family:var(--cond);font-size:13px;letter-spacing:.04em;color:var(--muted)}
.nav button svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.7}
.nav .age{margin-top:-26px}
.nav .age span.c{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 40% 30%,var(--gold),var(--gold2));display:grid;place-items:center;color:#1b1406;font-family:var(--display);font-weight:900;font-size:22px;line-height:1;box-shadow:0 6px 18px #0009,inset 0 -3px 0 #0003;border:3px solid var(--bg)}
.nav .age span.c small{display:block;font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.1em}
.nav .age:active span.c{transform:scale(.95)}

/* Alt sayfa (sheet) */
.ov{position:fixed;inset:0;background:#000a;display:none;z-index:20}
.ov.on{display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88%;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h2{font-family:var(--display);font-size:22px}
.x{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-size:20px;line-height:1}
.sh-b{overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
.sec{font-family:var(--cond);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:14px 0 8px}
.sec:first-child{margin-top:2px}
.note{font-size:14px;color:var(--muted);line-height:1.4;margin-bottom:8px}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.row:not(:disabled):active{background:#312a2c}
.row .ic{width:38px;height:38px;border-radius:10px;background:#151213;display:grid;place-items:center;font-size:20px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:16px}
.row .tx span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.row .rt{font-family:var(--cond);font-size:14px;color:var(--gold);text-align:right;white-space:nowrap}
.risk{display:inline-block;font-family:var(--cond);font-size:12px;padding:1px 7px;border-radius:999px;margin-top:4px;letter-spacing:.04em}
.r1{background:#1f3326;color:#8fd1a1}.r2{background:#3a2c17;color:#f0b866}.r3{background:#3d1b1b;color:#f09a90}

/* Gardırop */
.wprev{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0 10px}
.tab{flex:none;padding:7px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-family:var(--cond);font-size:15px;color:var(--muted)}
.tab.on{background:var(--gold);color:#1b1406;border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 10px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);text-align:center}
.it.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.it .av{width:72px;height:72px;border-width:1px}
.it b{font-size:13.5px;font-weight:600;line-height:1.15}
.it em{font-style:normal;font-family:var(--cond);font-size:13px;color:var(--muted)}
.it em.g{color:var(--gold)} .it em.k{color:var(--good)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid var(--panel2);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--gold)}

/* Olay penceresi */
.modal{position:fixed;inset:0;background:#000c;display:none;z-index:30;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--gold2);border-radius:16px;padding:20px;animation:pop .2s ease-out;max-height:90%;overflow-y:auto}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.card h2{font-family:var(--display);font-size:24px;line-height:1.15;margin-bottom:8px;text-wrap:balance}
.card p{font-size:16px;line-height:1.5;color:#e2d8ca;margin-bottom:16px}
.card .ch{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-top:8px}
.card .ch b{display:block;font-weight:600}
.card .ch span{font-family:var(--cond);font-size:14px;color:var(--gold)}
.card .ch.pr{background:linear-gradient(135deg,#4a3712,#2a2010);border-color:var(--gold);box-shadow:0 0 0 1px #d2a94f55 inset}
.card .ch.pr b{color:#f3d488}
.card .ch:not(:disabled):active{background:#332b2d}

/* Karakter oluşturma ve ölüm ekranı */
.full{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.full.on{display:block}
.full .in{max-width:480px;margin:0 auto}
.logo{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;text-align:center;letter-spacing:.01em}
.logo span{color:var(--gold)}
.tag{text-align:center;color:var(--muted);font-family:var(--cond);letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin:8px 0 16px}
.bigav{width:180px;height:180px;margin:0 auto 14px;border-width:3px}
.names{display:flex;gap:8px;margin-bottom:8px}
.names input{flex:1;min-width:0;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.dice{padding:0 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:20px}
.btn{display:block;width:100%;padding:15px;border-radius:12px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1b1406;font-weight:700;font-size:17px;letter-spacing:.02em;margin-top:18px}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.dead .bigav{filter:grayscale(1) contrast(1.1)}
.dead h2{font-family:var(--display);font-size:30px;text-align:center}
.dead .rip{text-align:center;color:var(--muted);margin:6px 0 18px;font-style:italic}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum div:last-child{border:0}
.sum span{color:var(--muted)}
.sum b{text-align:right;font-variant-numeric:tabular-nums}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);text-align:left;min-height:118px}
.tile:not(:disabled):active{background:#312a2c}
.tile .ti{font-size:28px;line-height:1;margin-bottom:6px}
.tile b{font-size:16px;font-weight:600}
.tile span:last-child{font-family:var(--cond);font-size:13.5px;color:var(--muted);line-height:1.25}
.tree{display:flex;flex-direction:column;align-items:center}
.gen{display:flex;flex-direction:column;align-items:center;width:100%}
.gl{font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:6px 0}
.row2{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tn{display:flex;flex-direction:column;align-items:center;gap:3px;width:100px;padding:10px 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:center}
.tn b{font-size:13.5px;line-height:1.15}.tn span{font-family:var(--cond);font-size:12px;color:var(--muted);line-height:1.2}
.tn.me{border-color:var(--gold)}.tn.dead .av{filter:grayscale(1)}
.tl{width:2px;height:18px;background:var(--gold2);margin:2px 0}
.yr p.news{font-family:var(--display);font-style:italic;border-left:3px solid var(--gold);padding-left:8px;color:#f3e3c0}
.clip{background:#e9e1cf;color:#1d1a16;border-radius:4px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 0 #0005}
.clip small{display:block;font-family:var(--cond);letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:#6b6152}
.clip b{font-family:var(--display);font-size:17px;line-height:1.2}
.clip.me{border-left:5px solid #a3262a}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-family:var(--cond);font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ov,.modal,.full{bottom:var(--bot,0px)!important}
#mg .card{max-width:380px}
.mgp{font-size:14.5px!important;margin-bottom:10px!important}
.mgh{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}.mgh div{display:flex;justify-content:space-between;background:var(--panel2);border-radius:8px;padding:6px 10px;font-family:var(--cond);font-size:18px}.mgh span{color:var(--gold);letter-spacing:.15em}
.mgcur{display:flex;gap:10px;justify-content:center;margin:8px 0}.mgcur span{width:52px;height:60px;border-radius:10px;background:#0f0d0e;border:1px solid var(--gold2);display:grid;place-items:center;font-family:var(--display);font-size:30px;color:var(--gold)}
.mgpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mgpad button{height:52px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:22px;font-weight:700}.mggive{font-size:14px!important;color:var(--blood)}
.mgbar{position:relative;height:30px;border-radius:15px;background:#0f0d0e;border:1px solid var(--line);margin:10px 0;overflow:hidden}.mgbar i{position:absolute;top:0;bottom:0;background:#2f6b43}.mgbar b{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:var(--gold);border-radius:3px;box-shadow:0 0 8px var(--gold)}
.mgsc{text-align:center;font-family:var(--cond);font-size:16px!important;margin:4px 0!important}
.mgpad2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.mgpad2 button{height:56px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:26px}
.slot{display:flex;gap:8px;align-items:center}.slot .row{flex:1}.slot .tab{margin-bottom:8px}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.th{padding:12px;border-radius:12px;border:2px solid;text-align:left;font-weight:600;display:flex;gap:8px;align-items:center;font-size:14px}.th i{width:14px;height:14px;border-radius:50%;flex:none}.th.on{box-shadow:0 0 0 2px var(--ink)}
#nUndo{position:absolute;left:calc(50% + 40px);bottom:80px;width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1.5px solid var(--gold2);color:var(--gold);font-size:20px;font-weight:700;line-height:1;z-index:7;box-shadow:0 3px 10px #0008}
#nUndo:disabled{opacity:.3}
.bk{border:1px solid;border-left-width:4px;border-radius:12px;background:var(--panel2);padding:10px 12px;margin-bottom:10px}
.bkh{display:flex;gap:10px;align-items:center}.bkh b{display:block;font-size:15.5px}.bkh span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.bkr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.bkr button{background:#0f0d0e;border:1px solid var(--line);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center}.bkr small{font-family:var(--cond);font-size:12px;color:var(--muted)}.bkr b{font-family:var(--cond);font-size:17px;color:var(--good)}

/* ===== Baba · Sinema teması ===== */
body.t-baba{--blood:#a51f24;--display:"Cinzel","Playfair Display",Georgia,serif}
body.t-baba #app,body.t-baba .full{background:
  radial-gradient(ellipse at 50% 0%,#2a1712 0%,transparent 55%),
  radial-gradient(ellipse at 50% 120%,#200d0b 0%,transparent 60%),
  repeating-linear-gradient(0deg,#ffffff03 0 1px,transparent 1px 3px),
  #0a0808}
body.t-baba #hdr{background:linear-gradient(180deg,#1a1110,#0c0909);border-bottom:1px solid #000;box-shadow:0 1px 0 #c9a24a55,0 3px 0 #000,0 4px 0 #c9a24a33}
body.t-baba .top{background:none;border-bottom:none}
body.t-baba .who h1{font-family:"Cinzel",serif;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:18px;color:#f3e6cc;text-shadow:0 1px 0 #000}
body.t-baba .who p b{color:#d9b25c}
body.t-baba .av{border-color:#c9a24a;box-shadow:0 0 0 2px #000,0 0 0 3px #7d5f22,0 6px 14px #000c}
body.t-baba .cash strong{color:#d9b25c;text-shadow:0 0 12px #c9a24a33}
body.t-baba .yr{border-bottom:1px solid #2a1f19}
body.t-baba .yr h3{font-family:"Cinzel",serif;letter-spacing:.18em;color:#c9a24a;display:flex;align-items:center;gap:8px}
body.t-baba .yr h3::before{content:"";width:7px;height:7px;background:#a51f24;transform:rotate(45deg);box-shadow:0 0 6px #a51f24aa}
body.t-baba #ftr{background:linear-gradient(0deg,#0b0807,#171110);border-top:1px solid #000;box-shadow:0 -1px 0 #c9a24a44,0 -10px 24px #000}
body.t-baba .stats{background:none;border-top:none}
body.t-baba .bar{background:#050404;box-shadow:inset 0 1px 2px #000}
body.t-baba .nav{background:none;border-top:1px solid #2a1f19}
body.t-baba .nav button{font-family:"Cinzel",serif;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
body.t-baba .nav button svg{stroke:#c9a24a}
body.t-baba .nav .age span.c{background:radial-gradient(circle at 50% 35%,#b5282d,#5e0f12 70%);color:#f3d488;border:3px solid #c9a24a;box-shadow:0 0 0 3px #000,0 8px 22px #000,inset 0 -4px 8px #0008,0 0 18px #a51f2466;font-family:"Cinzel",serif}
body.t-baba .nav .age span.c>span{font-size:13.5px!important;letter-spacing:.02em}
body.t-baba .nav .age span.c small{font-family:var(--cond);font-size:11px}
body.t-baba #nUndo{background:#0e0a09;border-color:#c9a24a;color:#c9a24a}
body.t-baba .sheet{background:linear-gradient(180deg,#171110,#0d0a09);border-top:1px solid #c9a24a66}
body.t-baba .sh-h{border-bottom:1px solid #2a1f19}

    {t:fam?'Aile avukatını çağır':'Avukat tut',sub:(fam?'Ücretsiz':fmt(lawyer))+` · %${Math.round(bp*100)} beraat`,dis:S.money<lawyer,fn:()=>{S.money-=lawyer;if(ch(bp)){log('Avukatın seni beraat ettirdi.','good');add('heat',-10)}else{const y=Math.max(1,Math.ceil(yrs/2));jailFor(y,`Avukatın cezayı ${y} yıla indirdi.`)}}},
    {t:'Hakime rüşvet teklif et',sub:fmt(bribe)+' · %60 şans',dis:S.money<bribe,fn:()=>{S.money-=bribe;if(ch(.6)){log('Dosya bir şekilde kayboldu. Serbestsin.','good');add('heat',-5)}else jailFor(yrs+2,`Rüşvet teklifin ortaya çıktı. Ceza ağırlaştı: ${yrs+2} yıl.`)}},
    {t:'Duruşmaya çık',sub:'Tanıklar, savunma, karar',fn:()=>trial(yrs)},
    {t:'Ağzını açma',sub:'Saygı +6 · Tam ceza',fn:()=>{gainResp(6);jailFor(yrs,`Kimseyi ele vermedin. ${yrs} yıl hapis.`)}},
    {t:'İtirafçı ol',sub:'Ceza azalır · Saygı çöker',fn:()=>{add('respect',-30);S.snitch=true;const y=Math.max(1,Math.floor(yrs/3));if(S.family){log(`${S.family} seni dışladı. Artık bir ispiyoncusun.`,'bad');S.family=null;S.boss=false}jailFor(y,`İtirafçı oldun. ${y} yıl hapis.`)}}]});
  {const ex=[];
    if(hasL('jet'))ex.push({t:'Özel jetle yurt dışına kaç',sub:'Hapis yok · Paranın %10\'u gider',fn:()=>{S.money=Math.round(S.money*.9);S.heat=45;log('Gece yarısı özel jetinle Dubai\'ye uçtun. Avukatların dosyayı zaman aşımına uğrattı.','gold');news(`${S.first} ${S.last} yurt dışına kaçtı!`,3)}});
    if(S.pol&&S.pol.office==='mv')ex.push({t:'Milletvekili dokunulmazlığı',sub:'%90 şans',fn:()=>{if(ch(.9)){log('Dokunulmazlığın var. Savcı dosyayı rafa kaldırdı.','gold');news(`Milletvekili ${S.last} hakkındaki fezleke bekletiliyor`,2)}else jailFor(yrs,`Dokunulmazlığın kaldırıldı! ${yrs} yıl hapis.`)}});
    if(S.pol&&S.pol.inf>=40)ex.push({t:'Siyasetçi dostunu ara',sub:`%${Math.min(85,S.pol.inf)} şans`,fn:()=>{if(ch(Math.min(.85,S.pol.inf/100))){S.pol.inf=clamp(S.pol.inf-10);log('Ankara\'dan gelen bir telefonla serbest kaldın.','gold')}else jailFor(yrs,`Siyasetçi dostun telefonu açmadı. ${yrs} yıl hapis.`)}});
    if(S.job&&S.job.id==='polis')ex.push({t:'Meslektaşlarını ara',sub:'%60 şans',fn:()=>{if(ch(.6)){log('Komiser arkadaşların tutanağı "kaybetti".','gold')}else{S.job=null;jailFor(yrs,`Meslekten ihraç edildin ve ${yrs} yıl hapis aldın.`)}}});
    if(ex.length){Q[Q.length-1].choices.splice(S.premium?1:0,0,...ex);showEv()}}
  if(S.state&&S.state.rec&&S.state.trust>=40){const tr=S.state.trust;Q[Q.length-1].choices.unshift({t:'Yukarıyı ara',sub:`Devlet koruması · %${Math.min(90,tr)} şans`,fn:()=>{if(ch(Math.min(.9,tr/100))){S.state.trust=clamp(tr-10);add('heat',-10);log('Ankara\'dan bir telefon geldi, dosya kapandı. Devlet seni koruyor.','gold')}else jailFor(yrs,`Telefonu kimse açmadı. ${yrs} yıl hapis.`)}});showEv()}
}

function useAct(){return true}
function failP(c){return clamp((c.id==='kacak'&&S.origin==='karadeniz'?-.05:0)+c.risk-(S.school?.04:0)-karizma()*.003-rank()*.02+S.heat*.003-(has('tetikci')?.06:0)-Math.min(.06,friends('sokak')*.02),.05,.85)}
function doCrime(id,forced){
  const c=CRIMES.find(x=>x.id===id);
  if(S.abroad){toast('Yurt dışındayken burada iş çeviremezsin.');return}
  if(forced===undefined&&!S.mgOff&&['kuyumcu','zirhli','altin','silah'].includes(c.id)){closeSheet();const sil=c.id==='silah';return queue({title:c.n,text:sil?'Tırlar sınırda. Jandarma devriyesi yaklaşıyor. Direksiyona sen mi geçeceksin, yoksa şansına mı bırakacaksın?':'Kasanın önündesin. Şifreyi kendin mi kıracaksın, yoksa şansına mı bırakacaksın?',choices:[{t:sil?'Direksiyona geç':'Kasayı kendin aç',sub:'Mini oyun · Başarırsan kesin kazanç',fn:()=>setTimeout(()=>miniGame(sil?'kovala':'kasa',ok=>doCrime(id,ok)),60)},{t:'Şansına bırak',sub:`Başarı %${Math.round((1-failP(c))*100)}`,fn:()=>doCrime(id,null)}]})}
  const pf=failP(c);
  if(forced===true?false:forced===false?true:ch(pf)){
    if(ch(.65)){log(`${c.n} girişimin polise takıldı.`,'bad');closeSheet();arrest(c.n,c.sev)}
    else{log(`${c.n} işi ters gitti, eli boş döndün.`,'bad');if(c.hurt&&ch(.5))hurt(R(8,22),c.n+' sırasında aldığı yaralar');add('respect',-1)}
  }else{
    const m=R(c.m[0],c.m[1]);S.money+=m;gainResp(R(c.r[0],c.r[1]));add('heat',c.h);
    log(`${c.n}: ${fmt(m)} kazandın.`,'good');S.stats.crimes++;if(c.id==='silah')news(`Sınırda dev sevkiyat: ${fmt(m)}'lik kaçakçılık ağı konuşuluyor`,4);else if(c.id==='altin')news(`Asrın soygunu: havalimanından ${fmt(m)}'lik altın buhar oldu!`,4);else if(['kuyumcu','zirhli','ihale'].includes(c.id))news(c.id==='zirhli'?`Zırhlı araç soygunu! ${fmt(m)} buhar oldu`:c.id==='kuyumcu'?`Kapalıçarşı'da kuyumcu soygunu`:`İhalede şaibe: ${fmt(m)}'lik iş kimde?`,c.id==='ihale'?2:3);
    if(c.hurt&&ch(c.hurt*.4)){hurt(R(5,15),c.n+' sırasında aldığı yaralar');log('Çatışmada hafif yaralandın.','bad')}
  }
  done();
}

function cardAvail(){const c=S.bank.card;return c?Math.max(0,c.limit-c.debt):0}
function canPay(x){return S.money+cardAvail()>=x}
function fund(x){if(S.money<x&&S.bank&&S.bank.dep>0){const t=Math.min(S.bank.dep,Math.ceil(x-S.money));S.bank.dep-=t;S.money+=t;log(`Kasada nakit yetmedi, bankadan ${fmt(t)} çekildi.`,'dim')}}
function pay(x){fund(x);
  if(S.money>=x){S.money-=x;return true}
  if(canPay(x)){const d=x-Math.max(0,S.money);S.money=0;S.bank.card.debt+=d;toast(`${fmt(d)} kredi kartından çekildi`);return true}
  toast('Paran yetmiyor: '+fmt(x));return false}
const hval=o=>Math.round(HT(o.t).p*S.hidx*o.q);

  S.jewels.forEach(j=>n+=j.val);S.cars.forEach(c=>n+=c.val||0);
  S.houses.forEach(o=>n+=hval(o));S.props.forEach(p=>n+=PROPS.find(x=>x.id===p).p*.7);
  n+=fxVal();if(S.offs&&S.offs.offAmt)n+=S.offs.offAmt;
  if(S.club)n+=LEAGUES[S.club.lv].price*.8+S.club.cash;if(S.co)S.co.projects.forEach(p=>n+=p.paid*1.1);if(S.label)n+=S.label.cash+lblRev()*8;if(S.gal)n+=S.gal.stock.reduce((t,c)=>t+galVal(c),0);
  if(S.bank.loan)n-=S.bank.loan.pay*S.bank.loan.left;if(S.bank.card)n-=S.bank.card.debt;
  return Math.round(n)}
function loanLimit(){const b=S.bank;if(b.score<800||S.age<18)return 0;return Math.round(Math.max(100000,netWorth()*.5)*(b.score-700)/1200/1000)*1000}
function icra(amount){
  let rem=amount;log('İcra memurları kapına dayandı.','bad');
  const d=Math.min(S.bank.dep,rem);S.bank.dep-=d;rem-=d;
  (S.accts||[]).filter(a=>!BK(a.bank).secret).forEach(a=>{if(rem<=0)return;const t=Math.min(a.amt,rem);a.amt-=t;rem-=t;if(t)log(`${BK(a.bank).n} hesabına haciz konuldu: ${fmt(t)}.`,'bad')});S.accts=(S.accts||[]).filter(a=>a.amt>0);
  while(rem>0&&S.jewels.length){const j=S.jewels.pop();rem-=j.val;log(`${JEWELS.find(x=>x.id===j.id).n} haczedildi.`,'bad')}
  while(rem>0&&S.cars.length){const c=S.cars.pop();rem-=c.val;if(S.car===c.uid)S.car=S.cars[0]?S.cars[0].uid:null;log(`${carName(c)} haczedildi.`,'bad')}
  while(rem>0&&S.houses.length){const o=S.houses.pop();rem-=hval(o);if(S.home===o.uid)S.home=null;log(`${HT(o.t).n} haczedildi.`,'bad')}
  if(rem>0)add('happy',-10);
}

/* ============ Yıllık sistemler ============ */
function quarterSystems(f){
  let rent=0;
  S.houses.forEach(o=>{if(o.ten){rent+=Math.round(o.ten.rent*f);if(ch(.1*f)){log(`${HT(o.t).n} evindeki kiracın (${o.ten.name}) taşındı.`,'dim');o.ten=null}}});
  if(rent){S.money+=rent;S.taxInc=(S.taxInc||0)+rent;log(`Kira gelirlerin: ${fmt(rent)}.`,'good')}
  if(S.home){const o=S.houses.find(x=>x.uid===S.home);if(o){if(f===1||S.q===0)add('happy',HT(o.t).h)}else S.home=null}
  const b=S.bank;
  if(b.dep>0){const i=Math.round(b.dep*Math.max(.03,depRate()*.35)*f);b.dep+=i;S.taxInc=(S.taxInc||0)+i;log(`Mevduat faizin: ${fmt(i)}.`,'good')}
  STOCKS.forEach(st=>{const x=S.px[st.id];x.p=Math.max(.5,+(x.p*Math.exp(stockR(st,x.n,f))*(1+(S.infl||0)*f*.8)).toFixed(2));x.h.push(x.p);if(x.h.length>16)x.h.shift();x.n=gauss()});
  if(S.orders)Object.keys(S.orders).forEach(id=>{const o=S.stocks[id];if(!o){delete S.orders[id];return}if(S.px[id].p>=S.orders[id]){log(`Satış emrin gerçekleşti (hedef ₺${S.orders[id].toLocaleString('tr-TR')}).`,'gold');sellStock(id,o.sh);delete S.orders[id]}});
  if(S.state.rec&&S.state.trust>=60)S.heat=clamp(S.heat-Math.round(5*f));
}
function stockR(st,n,f){return st.d*f-st.v*st.v*f/2+st.v*Math.sqrt(f)*n}
function yearSystems(){
  S.hidx=+(S.hidx*(1+(S.infl||.3)+R(-8,6)/100)).toFixed(3);
  S.jewels.forEach(j=>{const d=JEWELS.find(x=>x.id===j.id);j.val=Math.max(Math.round(d.p*.4),Math.round(j.val*(1+R(d.inv?-10:-5,d.inv?18:8)/100)))});
  const b=S.bank;
  if(b.loan){const L=b.loan;
    fund(L.pay);if(S.money>=L.pay){S.money-=L.pay;L.left--;b.score=Math.min(1900,b.score+40);log(`Kredi taksiti ödendi: ${fmt(L.pay)}. ${L.left?L.left+' taksit kaldı.':'Kredin bitti.'}`,L.left?'dim':'good');if(!L.left)b.loan=null}
    else{b.score=Math.max(0,b.score-180);L.late=(L.late||0)+1;log('Kredi taksitini ödeyemedin. Kredi notun düştü.','bad');if(L.late>=2){icra(L.pay*L.left);b.loan=null}}
  }
  if(b.card&&b.card.debt>0){const c=b.card;c.debt=Math.round(c.debt*1.5);const mn=Math.round(c.debt*.3);
    fund(mn);if(S.money>=mn){S.money-=mn;c.debt-=mn;b.score=Math.min(1900,b.score+15);log(`Kart asgari ödemesi: ${fmt(mn)}. Kalan kart borcun ${fmt(c.debt)}.`,'dim')}
    else{b.score=Math.max(0,b.score-120);log('Kart asgarisini ödeyemedin. Kredi notun düştü.','bad');
      if(b.score<700){log('Banka kartını iptal etti, borç icraya gitti.','bad');icra(c.debt);b.card=null}}}
  if(!b.loan&&!(b.card&&b.card.debt))b.score=Math.min(1900,b.score+10);
  if(b.card)b.card.limit=Math.max(10000,Math.round(b.score*100/1000)*1000);
}

let DB=null,UID=null,SLOTS={},cloudTimer=null,lastCloud=0;
function snapshot(){const c=JSON.parse(JSON.stringify(S));c.log=c.log.slice(-40);return c}
function payload(){return{v:1,at:Date.now(),name:`${S.first} ${S.last}`,age:S.age,rank:RANKS[rank()].n,alive:S.alive,json:JSON.stringify(snapshot())}}
function dataOf(r){if(!r)return null;if(typeof r.data==='function'){if(r.exists===false)return null;return r.data()||null}if(r.exists===false)return null;return r}
async function putSlot(k,p){
  if(DB){await DB.collection('data/users/'+UID).doc(k).set(p)}

}
async function getSlot(k){
  if(DB){return dataOf(await DB.collection('data/users/'+UID).doc(k).get())}

}
async function refreshSlots(){for(const k of ['slot1','slot2','slot3']){try{const p=await getSlot(k);SLOTS[k]=p&&p.json?{name:p.name,age:p.age,rank:p.rank,at:p.at,alive:p.alive}:null}catch(e){SLOTS[k]=null}}}
function cloudSave(now){
  if(!S)return;clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async()=>{try{const p=payload();await putSlot('aktif',p);if(S&&S.slot)await putSlot(S.slot,p);lastCloud=p.at}catch(e){}},now?0:1500);
}
async function manualSave(k){
  try{if(k)S.slot=k;const p=payload();await putSlot('aktif',p);lastCloud=p.at;if(k)await putSlot(k,p);toast(k?'Kayıt yuvasına kaydedildi':'İlerleme kaydedildi');}catch(e){toast('Kaydedilemedi. İnternet bağlantını kontrol et.')}

}
async function loadSlot(k){

  }catch(e){toast('Kayıt yüklenemedi.')}
}
function ago(t){if(!t)return'';const m=Math.round((Date.now()-t)/60000);if(m<1)return'az önce';if(m<60)return m+' dk önce';const h=Math.round(m/60);if(h<24)return h+' saat önce';return new Date(t).toLocaleDateString('tr-TR')}

function renameKid(id){const k=S.kids.find(x=>x.id===id);if(!k)return;queue({back:'insan',title:'Adını değiştir',text:`${k.name} için yeni isim yaz.`+NAMEBOX(k.name),choices:[{t:'✍️ Kaydet',fn:()=>{const n=typedName();if(n){log(`${k.name}'in adı artık ${n}.`,'dim');k.name=n}}},{t:'Vazgeç',fn:()=>{}}]})}
function tryBaby(){
  if(!S.partner){toast('Önce bir sevgilin ya da eşin olmalı.');return}
  if(ch(S.married?.65:.5)){
    const g=ch(.5)?'e':'k',pool=g==='e'?BOYS:GIRLS2,names=[];while(names.length<3){const n=pick(pool);if(!names.includes(n))names.push(n)}
    closeSheet();
    queue({back:'insan',title:g==='e'?'Bir oğlun oldu!':'Bir kızın oldu!',text:`${S.partner} ile ${g==='e'?'bir oğlunuz':'bir kızınız'} dünyaya geldi. Adını ne koyacaksın?`+NAMEBOX(g==='e'?'Örn. Oruç':'Örn. Yıldız'),choices:[{t:'✍️ Yazdığım ismi koy',sub:'Kutuya yazıp dokun',fn:()=>born(typedName()||names[0])},...names.map(n=>({t:n,sub:'Hazır isim',fn:()=>born(n)}))]});
    function born(n){S.kids.push({id:'k'+Date.now()+R(0,999),name:n,g,age:0,bornAt:S.age,rel:R(70,90),look:kidLook(g),crew:false});add('happy',15);log(`${n} dünyaya geldi. Soyadın artık bir nesil daha devam edecek.`,'gold')}
  }else{log(`${S.partner} ile çocuk sahibi olmaya çalıştınız, bu sefer olmadı.`,'dim');done()}
}

    ...(k.age>=18&&!k.spouse?[{t:'Görücü ayarla',sub:`${fmt(Math.round(50000*S.cpi))} · %60 şans`,dis:!canPay(Math.round(50000*S.cpi)),fn:()=>{pay(Math.round(50000*S.cpi));if(ch(.6)){marryKid(k);k.rel=clamp(k.rel+10)}else{k.rel=clamp(k.rel-5);log(`${k.name} görücüye gelen adayı beğenmedi.`,'dim')}}}]:[]),
    ...(k.spouse&&k.age<=45?[{t:'Torun iste',sub:k.rel>=50?'%45 şans':'Aranız soğuk, %15 şans',fn:()=>{if(ch(k.rel>=50?.45:.15))addGrandkid(k);else log(`${k.name}: "Şimdi sırası değil."`,'dim')}}]:[]),
    {t:'🧬 Özellikleri',sub:trOf(k).huy+(S.premium?' · Dayı modunda düzenlenir':''),fn:()=>setTimeout(()=>pCard('k',k.id,'insan'),40)},
    {t:'✏️ Adını değiştir',sub:k.name,fn:()=>setTimeout(()=>renameKid(k.id),40)},
    ...(S.heir!==id?[{t:'Varisin yap',sub:'Öldüğünde servet ve itibar ona geçer',fn:()=>{S.heir=id;log(`${k.name} resmen varisin.`,'gold')}}]:[]),
    {t:'Vazgeç',fn:()=>{}}]})}

    owned:{outfit:[...new Set(['tisort','esofman',...P.owned.outfit])],acc:P.owned.acc.filter(a=>a!=='yara')},

    school:true,snitch:false,lastRank:0,hurtCause:null,cause:null,peak:0,
    hidx:P.hidx,px:P.px,stocks:P.stocks,bank:{dep:0,score:1200,loan:null,card:null},state:{rec:false,trust:0},
    org:P.org?{...P.org,members:P.org.members.filter(m=>m.relId!==undefined||true)}:null,rivals:P.rivals,exFamily:P.exFamily,
    econ:P.econ,accts:P.accts||[],cpi:P.cpi,infl:P.infl,fx:P.fx,fxh:P.fxh,fxw:P.fxw,council:P.council,
    slot:P.slot,origin:P.origin,famBg:(P.org||P.family)?'mafya':(P.famBg||'orta'),club:P.club||null,co:P.co||null,label:P.label||null,gal:P.gal||null,
    premium:P.premium,autoMeet:P.autoMeet,q:P.q||0,tips:{},tipStats:P.tipStats,lux:[...(P.lux||[])],ach:P.ach,stats:P.stats,papers:P.papers,fame:Math.round((P.fame||0)/2),
    kids:(k.kids||[]).map(g=>({id:g.id,name:g.name,g:g.g,age:g.age,bornAt:Math.max(0,k.age-g.age),rel:R(65,90),look:g.look,crew:false})),partner:k.spouse||null,married:!!k.spouse,prel:k.spouse?70:null,siblings:P.kids.filter(x=>x!==k).map(x=>({name:x.name,g:x.g,age:x.age,look:x.look})),
    gen:(P.gen||1)+1,birthYear:(P.birthYear||1996)+k.bornAt,
    tree:[...(P.tree||[]),{name:`${P.first} ${P.last}`,g:P.gender||'e',by:P.birthYear||1996,age:P.age,rank:RANKS[rank()].n,cause:P.cause,look:P.look,family:P.family,kids:P.kids.map(x=>x.name),heir:k.name}],
    log:[{age:k.age,q:k.age>=14?(P.q||0):undefined,lines:[]}]};
  S=N;ensure();
  const parentWord=(P.gender==='k'?'Annen':'Baban');
  log(`${parentWord} ${P.first} ${P.last} toprağa verildi. ${S.gen}. kuşak olarak hayat sende devam ediyor.`,'gold');

  if(S.family)log(`${S.family} seni ${parentWord.toLowerCase()} yerine bağrına bastı.`,'gold');

/* ============ Vergi ve giderler ============ */
const BRACKETS=[[110000,.15],[230000,.20],[870000,.27],[3000000,.35],[Infinity,.40]];
function incomeTax(x){let t=0,prev=0;for(const[lim,r]of BRACKETS){if(x<=prev)break;t+=(Math.min(x,lim)-prev)*r;prev=lim}return Math.round(t)}
function propTax(){return Math.round(S.houses.reduce((s,o)=>s+hval(o)*(HT(o.t).id==='yali'?.006:.002),0))}
function carTax(){return Math.round(S.cars.reduce((s,c)=>s+c.val*.015,0))}
function expenses(){ // yıllık tahmini
  const it=[];if(S.jail)return it;
  if(S.age>=18){
    if(S.home){const o=S.houses.find(x=>x.uid===S.home);if(o)it.push(['Ev faturaları','Elektrik, su, doğalgaz, internet',Math.round(15000+hval(o)*.012)])}
    else if(S.age<23)it.push(['Ailenin evi','Hâlâ ailenin yanında kalıyorsun, sadece faturalara katkı',Math.round(8000*S.cpi)]);
    else it.push(['Kira ve faturalar','Kendi evin yok, kirada oturuyorsun',Math.round(36000*S.hidx)]);
    it.push(['Market ve yaşam','Mutfak, telefon, giyim',Math.round((S.partner?36000:24000)*S.cpi)]);
  }
  if(S.cars.length)it.push(['Araba giderleri','Sigorta, kasko, bakım, yakıt',Math.round(S.cars.reduce((s,c)=>s+c.val*.03+6000,0))]);
  const kids=S.kids.filter(k=>k.age<18).length;if(kids)it.push(['Çocuk masrafları',`${kids} çocuk · okul, bakım`,Math.round(kids*25000*S.cpi)]);
  if(S.lux&&S.lux.length)it.push(['Lüks bakım','Yat, uçak, köpek masrafları',S.lux.reduce((s,id)=>s+LUX.find(x=>x.id===id).up,0)]);
  if(S.edu)it.push(['Okul harcı',DEPTS.find(x=>x.id===S.edu.d).n,DEPTS.find(x=>x.id===S.edu.d).fee]);
  if(S.alimony)it.push(['Nafaka',`${S.alimony.left} yıl kaldı`,S.alimony.amt]);
  if(S.abroad)it.push(['Yurt dışı yaşam','Kira, hayat pahalılığı',Math.round(240000*S.cpi)]);
  if(S.taxDebt>0)it.push(['Vergi taksiti','Yapılandırılmış vergi borcu',Math.round(S.taxDebt)]);
  return it}
function payExpenses(f){
  if(S.age<18||S.jail)return;
  const it=expenses();let total=0;it.forEach(x=>{if(x[0]==='Vergi taksiti')return;total+=Math.round(x[2]*f)});
  let taxPart=0;if(S.taxDebt>0){taxPart=Math.min(S.taxDebt,Math.round(S.taxDebtQ||S.taxDebt/4));}
  const all=total+taxPart;if(!all)return;fund(all);
  if(S.money>=all||canPay(all)){pay(all);if(taxPart)S.taxDebt=Math.max(0,S.taxDebt-taxPart);log(`Giderler: ${fmt(total)}${taxPart?` + vergi taksiti ${fmt(taxPart)}`:''}.`,'dim')}
  else{const paid=S.money;S.money=0;S.bank.score=Math.max(0,S.bank.score-40);add('happy',-6);log(`Faturaları ödeyemedin (${fmt(all)} gerekiyordu, ${fmt(paid)} ödendi). Elektrikler kesildi, kredi notun düştü.`,'bad')}
}
function taxTime(){
  if(S.age<18)return;
  const gi=Math.round(incomeTax(S.taxInc||0)*(S.offs&&S.offs.paravan?.7:1)),et=propTax(),mtv=carTax(),T=gi+et+mtv;const base=S.taxInc||0;S.taxInc=0;
  if(T<=0)return;
  const detail=`Beyan edilen gelir ${fmt(base)} · Gelir vergisi ${fmt(gi)}${et?` · Emlak vergisi ${fmt(et)}`:''}${mtv?` · MTV ${fmt(mtv)}`:''}.`;
  const evade=Math.max(.1,.35-(has('muhasebe')?.15:0)+(S.heat>50?.15:0));
  queue({title:'Vergi zamanı',text:`Vergi dairesinden yıllık bildirim geldi. Toplam: ${fmt(T)}. ${detail}`,
    prem:{t:'Dayının vergi müşaviri',sub:`Sadece ${fmt(Math.round(T*.25))} · Tamamen yasal`,fn:()=>{const c=Math.round(T*.25);S.money=Math.max(0,S.money-c);S.taxLast=c;log(`Dayının müşaviri bütün istisnaları buldu. Sadece ${fmt(c)} vergi ödedin.`,'gold')}},
    choices:[
    {t:'Vergini öde',sub:fmt(T),dis:!canPay(T),fn:()=>{pay(T);S.taxLast=T;add('heat',-3);S.bank.score=Math.min(1900,S.bank.score+20);log(`${fmt(T)} vergi ödedin. Devletle aran iyi.`,'good')}},
    ...(has('muhasebe')?[{t:'Muhasebecin optimize etsin',sub:fmt(Math.round(T*.7)),dis:!canPay(Math.round(T*.7)),fn:()=>{const c=Math.round(T*.7);pay(c);S.taxLast=c;log(`Muhasebecin giderleri düzenledi. ${fmt(c)} vergi ödedin.`,'good')}}]:[]),
    {t:'Taksitlendir',sub:`4 çeyrekte ${fmt(Math.round(T*1.1))} (%10 faiz)`,fn:()=>{S.taxDebt=(S.taxDebt||0)+Math.round(T*1.1);S.taxDebtQ=Math.round(S.taxDebt/4);S.taxLast=Math.round(T*1.1);log(`Vergi borcunu yapılandırdın: ${fmt(Math.round(T*1.1))}, 4 taksit.`,'dim')}},
    {t:'Vergi kaçır',sub:`Yakalanma riski %${Math.round(evade*100)}`,fn:()=>{
      if(ch(evade)){const ceza=T*2;add('heat',15);S.taxLast=ceza;log(`Vergi müfettişleri kaçakçılığı yakaladı. Ceza: ${fmt(ceza)}.`,'bad');
        if(S.money>=ceza)S.money-=ceza;else{const rest=ceza-S.money;S.money=0;icra(rest)}
        if(T>=1000000&&ch(.4))arrest('Vergi kaçakçılığı',[1,3]);}
      else{S.taxLast=0;add('happy',3);log('Vergiyi kaçırdın, kimse fark etmedi. Şimdilik.','dim')}}}
  ]})
}
EXTRA.vergi=()=>{
  const it=expenses();const yearly=it.reduce((s,x)=>s+x[2],0);

    <div><span>Tahmini toplam vergi</span><b style="color:var(--gold)">${fmt(gi+et+mtv)}</b></div>
    <div><span>Geçen yıl ödenen</span><b>${S.taxLast==null?'—':fmt(S.taxLast)}</b></div>
    ${S.taxDebt>0?`<div><span>Vergi borcu (taksitte)</span><b style="color:var(--blood)">${fmt(S.taxDebt)}</b></div>`:''}</div>`;
  if(S.taxDebt>0)h+=row('data-x="paytax:"','🧾','Vergi borcunu kapat','Taksitleri beklemeden öde',fmtS(S.taxDebt),!canPay(S.taxDebt));
  h+=`<div class="sec">Yıllık giderler</div>`;
  if(S.age<18)h+='<p class="note">18 yaşına kadar giderlerini ailen karşılıyor.</p>';
  else if(S.jail)h+='<p class="note">Cezaevindeyken giderin yok; devlet besliyor.</p>';
  else{h+='<div class="sum">'+it.map(x=>`<div><span>${x[0]}<br><small style="font-size:12px">${x[1]}</small></span><b>${fmt(x[2])}</b></div>`).join('')+`<div><span><b style="color:var(--ink)">Toplam / yıl</b></span><b style="color:var(--gold)">${fmt(yearly)}</b></div></div><p class="note" style="margin-top:8px">Giderler her çeyrek dörtte bir olarak kasandan, nakit yetmezse kredi kartından çekilir.</p>`}
  h+='<div class="sec">Gelir vergisi dilimleri</div><div class="sum">'+BRACKETS.map(([l,r],i)=>`<div><span>${i?fmt(BRACKETS[i-1][0])+' – ':'0 – '}${l===Infinity?'üzeri':fmt(l)}</span><b>%${Math.round(r*100)}</b></div>`).join('')+'</div>';
  return['Vergi dairesi',h]};
ACT.paytax=()=>{if(!pay(S.taxDebt))return;log(`Vergi borcunu kapattın: ${fmt(S.taxDebt)}.`,'good');S.taxDebt=0;done()};

function ensureOrg(){
  if(!S.rels)S.rels=genRels();
  if(!S.rivals)S.rivals=RIVAL_DEF.map(d=>({id:d.id,n:d.n,pow:d.pow,base:d.pow,war:false,venues:d.v.map((n,i)=>({id:d.id+i,n,inc:Math.round((60000+d.pow*3000)*(1+i*.3)/1000)*1000}))}));
  if(S.org===undefined)S.org=null;
}
function orgPow(){if(!S.org)return 0;let p=0;S.org.members.forEach(m=>{if(!m.jail&&!m.hurt)p+=m.str*(.5+m.loy/200)*3});return Math.round(p+S.respect*.4+karizma()*.5+(has('tetikci')?8:0)+(has('koruma')?4:0)+S.rivals.filter(r=>r.ally&&!r.dead).reduce((x,r)=>x+r.pow*.2,0))}
const avail=()=>S.org?S.org.members.filter(m=>!m.jail&&!m.hurt):[];
const RV=id=>S.rivals.find(r=>r.id===id);
function battleP(their,bonus=0){return clamp(.5+(orgPow()-their)/100+bonus,.08,.92)}
function casualties(n){const av=avail();
  if(!av.length){hurt(R(10,25),'Çete savaşında aldığı yaralar');log('Yanında kimse yoktu, yaralandın.','bad');return}
  for(let i=0;i<n&&av.length;i++){const m=av.splice(R(0,av.length-1),1)[0];const x=Math.random();
    if(x<.12){S.org.members=S.org.members.filter(y=>y!==m);if(m.relId){const r=S.rels.find(z=>z.id===m.relId);if(r)r.dead=true}log(`${m.name} çatışmada hayatını kaybetti.`,'bad');add('happy',-8)}
    else if(x<.6){m.hurt=R(1,3);log(`${m.name} yaralandı, ${m.hurt*3} ay sahadan uzak.`,'bad')}
    else{m.jail=R(2,8);log(`${m.name} tutuklandı (${fmtJ(m.jail/4)}).`,'bad')}}}
function foundOrg(){
  if(S.age<18){toast('18 yaşından önce aile kuramazsın.');return}
  const prem=S.premium;
  if(S.respect<20&&!prem){toast('Kendi aileni kurmak için en az 20 saygı gerekir.');return}
  closeSheet();
  const names=[`${S.last} Ailesi`,`${pick(NICK)} ${S.last}lar`,`${pick(['Gece','Demir','Kara','Kızıl','Altın'])} ${pick(['Kurtlar','Yumruk','Kartallar','Hançer'])}`];
  queue({back:'org',title:'Kendi aileni kur',text:`Kuruluş için ${fmt(100000)} gerekiyor: mekân, silah, ilk maaşlar. ${S.family?`Şu an ${S.family} üyesisin; kendi aileni kurarsan onlardan ayrılırsın ve bu hoş karşılanmaz.`:''} Ailenin adı ne olsun?`,
    choices:[...names.map(n=>({t:n,sub:fmt(100000),dis:!canPay(100000),fn:()=>{pay(100000);if(S.family){S.exFamily=S.family;log(`${S.family} ile yollarını ayırdın. Arkandan bakanlar var.`,'bad');S.family=null;S.boss=false}
      S.org={name:n,members:[],turf:[],founded:S.age};gainResp(5);log(`${n} kuruldu. Artık kendi ailenin başısın.`,'gold')}})),{t:'Vazgeç',fn:()=>{}}]})}
function addMember(o){if(S.org.members.length>=12){toast('Ailen en fazla 12 kişi olabilir.');return false}
  S.org.members.push({id:'m'+Date.now()+R(0,999),name:o.name,kin:o.kin||null,str:o.str,loy:o.loy,wage:o.str*8000,jail:0,hurt:0,busy:-1,relId:o.relId||null});return true}
function memMenu(id){const m=S.org.members.find(x=>x.id===id);if(!m)return;closeSheet();
  const busy=m.busy===QS();const off=m.jail?`Cezaevinde (${fmtJ(m.jail/4)})`:m.hurt?`Yaralı (${m.hurt*3} ay)`:busy?'Bu çeyrek görevde':'Hazır';
  const cs=[];
  if(!m.jail&&!m.hurt&&!busy)OMIS.forEach(o=>{const p=clamp(1-o.risk+(m.str-5)*.03+m.loy*.001,.05,.97);cs.push({t:o.n,sub:`${o.m[1]?`${fmtS(o.m[0])}–${fmtS(o.m[1])} · `:''}${o.d?o.d+' · ':''}Başarı %${Math.round(p*100)}`,fn:()=>runMis(m,o,p)})});
  cs.push({t:'🧬 Özellikleri',sub:trOf(m).huy,fn:()=>setTimeout(()=>pCard('m',m.id,'org'),40)});
  cs.push({t:'Prim ver',sub:`${fmt(m.str*5000)} · Sadakat +15`,dis:!canPay(m.str*5000),fn:()=>{pay(m.str*5000);m.loy=clamp(m.loy+15);log(`${m.name}'e prim verdin. Sadakati arttı.`,'good')}});
  cs.push({t:'Aileden çıkar',sub:'Kırgın ayrılır',fn:()=>{S.org.members=S.org.members.filter(x=>x!==m);if(m.relId){const r=S.rels.find(z=>z.id===m.relId);if(r)r.joined=false}log(`${m.name} aileden çıkarıldı.`,'dim');if(m.loy<40&&ch(.4)){add('heat',12);log(`${m.name} gidince polise bir şeyler anlattı.`,'bad')}}});
  cs.push({t:'Vazgeç',fn:()=>{}});
  queue({back:'org',title:m.name,text:`${m.kin?m.kin+' · ':''}Güç ${m.str}/10 · Sadakat %${m.loy} · Yıllık pay ${fmt(m.wage)} · ${off}.`,choices:cs})}
function runMis(m,o,p){m.busy=QS();
  if(ch(p)){const mo=o.m[1]?R(o.m[0],o.m[1]):0;S.money+=mo;gainResp(o.r);add('heat',o.h);m.loy=clamp(m.loy+3);
    if(o.guard)S.org.guard=QS();if(o.spy)S.org.intel=QS();
    log(`${m.name}: ${o.n} görevi başarılı${mo?`, kasaya ${fmt(mo)} girdi`:''}.`,'good')}
  else{m.loy=clamp(m.loy-5);if(ch(.5)){m.jail=R(2,6);log(`${m.name} ${o.n.toLowerCase()} sırasında yakalandı (${fmtJ(m.jail/4)}).`,'bad');add('heat',4)}else{m.hurt=R(1,2);log(`${m.name} ${o.n.toLowerCase()} sırasında yaralandı.`,'bad')}}}
function allOut(){const av=avail().filter(m=>m.busy!==QS());if(S.jail)log('İçeriden telefonla talimat verdin.','dim');if(!av.length){toast('Bu çeyrek görevlendirilecek boşta adam yok.');return}
  av.forEach(m=>{const o=OMIS[m.str>=7?2:m.str>=5?1:0];const p=clamp(1-o.risk+(m.str-5)*.03+m.loy*.001,.05,.97);runMis(m,o,p)});done()}
function recruitStreet(){if(!canPay(20000)){toast('Paran yetmiyor.');return}closeSheet();pay(20000);
  const c=[0,1,2].map(()=>({name:`${pick(NICK)} ${pick(NAMES)}`,str:R(2,8),loy:R(35,65)}));
  queue({back:'org',title:'Sokaktan adam topla',text:'Kahvehanede adamların üç aday getirdi. Hangisini alıyorsun?',choices:[...c.map(x=>({t:x.name,sub:`Güç ${x.str}/10 · Sadakat %${x.loy} · Yıllık ${fmt(x.str*8000)}`,fn:()=>{if(addMember(x))log(`${x.name} ailene katıldı.`,'good')}})),{t:'Hiçbirini alma',fn:()=>{}}]})}
function rivMenu(id){const r=RV(id);if(r.dead){toast(`${r.n} dağıldı. Yeni lider çıkması zaman alacak.`);return}closeSheet();const intel=S.org&&S.org.intel===QS()?.12:0;
  const cs=[];
  if(S.org){
    if(r.venues.length)cs.push({t:'Mekânlarına çök',sub:`${r.venues.length} mekân · Şans %${Math.round(battleP(r.pow,intel)*100)}`,fn:()=>setTimeout(()=>venuePick(id),30)});
    cs.push({t:'Adamlarından birine saldırı düzenle',sub:`Şans %${Math.round(battleP(r.pow,.12+intel)*100)} · Rakibi zayıflatır`,fn:()=>hitRival(r,battleP(r.pow,.12+intel))});
    if(!r.war)cs.push({t:'Savaş ilan et',sub:S.council.rules.includes('ateskes')?'Ateşkesi bozar, konsey kızar':'Misillemeler başlar',fn:()=>{r.war=true;if(S.council.rules.includes('ateskes')){cMembers().forEach(m=>S.council.rel[m.id]=crel(m.id)-20);log('Ateşkesi bozdun. Konseydeki babalar sana sırt çevirdi.','bad')}gainResp(4);log(`${r.n} ile savaş başladı. Sokaklar gergin.`,'bad')}});
    else cs.push({t:'Barış teklif et',sub:fmt(r.pow*5000),dis:!canPay(r.pow*5000),fn:()=>{pay(r.pow*5000);if(ch(.7)){r.war=false;log(`${r.n} ile barış masasına oturdun. Silahlar sustu.`,'good')}else log(`${r.n} barış teklifini reddetti, parayı da aldı.`,'bad')}});
  }
  if(S.org&&!r.dead)cs.push({t:`Liderine suikast: ${r.boss.name}`,sub:`Şans %${Math.round(battleP(r.pow+30)*100)} · Çete dağılır`,fn:()=>setTimeout(()=>ACT.suikast(id),40)});
  if(!S.mgOff)cs.push({t:'Adamlarından biriyle yumruk yumruğa',sub:'Mini oyun',fn:()=>setTimeout(()=>miniGame('kavga',w=>{if(w){gainResp(5);r.pow=Math.max(10,r.pow-2);log(`${r.n}'in adamını sokak ortasında yere serdin.`,'good')}else{hurt(R(8,18),'Sokak kavgası');log(`${r.n}'in adamı seni hırpaladı.`,'bad')}if(!r.war&&ch(.3)){r.war=true;log(`${r.n} bunu savaş sebebi saydı.`,'bad')}},`${r.n} adamı`),60)});
  cs.push({t:'Adamlarıyla kavga çıkar',sub:`Sen tek başına · Şans %${Math.round(clamp(.4+S.health/400+S.respect/400+karizma()/300,.1,.9)*100)}`,fn:()=>{const p=clamp(.4+S.health/400+S.respect/400+karizma()/300,.1,.9);if(ch(p)){gainResp(4);r.pow=Math.max(10,r.pow-2);log(`${r.n} adamlarıyla meyhanede kavgaya tutuştun. Hepsini yere serdin.`,'good')}else{hurt(R(8,20),'Sokak kavgası');add('respect',-2);log(`${r.n} adamları seni fena hırpaladı.`,'bad')}if(!r.war&&ch(.3)){r.war=true;log(`${r.n} bunu savaş sebebi saydı.`,'bad')}}});
  cs.push({t:'Vazgeç',fn:()=>{}});
  queue({back:'rakip',title:r.n,text:`${r.dead?'Lideri öldü, çete dağınık. ':`Lideri ${r.boss.name} (${TRAITS[r.boss.trait]}) · `}${r.ally?'Müttefikin · ':''}Gücü ${r.pow}${S.org?` · Senin gücün ${orgPow()}`:''} · ${r.venues.length} mekân${r.war?' · <b style="color:var(--blood)">Savaştasınız</b>':''}.${!S.org?' Mekân basmak ve saldırı düzenlemek için önce kendi aileni kurmalısın.':''}`,
    prem:S.org?{t:'Dayının adamları da gelsin',sub:'Bir mekânı kayıpsız al',fn:()=>{if(!r.venues.length){r.pow=Math.max(10,r.pow-15);gainResp(8);log(`${r.n} dayının adamlarını görünce dağıldı.`,'gold');return}const v=r.venues.shift();S.org.turf.push({...v,from:r.id});r.pow=Math.max(10,r.pow-10);r.war=true;gainResp(10);S.money+=Math.round(v.inc*.5);log(`Dayının adamlarıyla ${v.n} mekânına çöktün. Tek kayıp yok, mekân artık senin.`,'gold')}}:null,choices:cs})}
function venuePick(id){const r=RV(id);if(!r.venues.length)return;const intel=S.org.intel===QS()?.12:0;
  queue({back:'rakip',title:'Hangi mekân?',text:`${r.n} mekânları. Alırsan her yıl gelir getirir.`,choices:[...r.venues.map(v=>({t:v.n,sub:`Yıllık ${fmtS(v.inc)} · Şans %${Math.round(battleP(r.pow+v.inc/20000,intel)*100)}`,fn:()=>raidVenue(r,v,battleP(r.pow+v.inc/20000,intel))})),{t:'Vazgeç',fn:()=>{}}]})}
function raidVenue(r,v,p){r.war=true;
  if(ch(p)){r.venues=r.venues.filter(x=>x!==v);S.org.turf.push({...v,from:r.id});r.pow=Math.max(10,r.pow-10);gainResp(8);add('heat',10);S.stats.venues++;news(`${S.org.name}, ${r.n}'in ${v.n} mekânını ele geçirdi`,3);const loot=Math.round(v.inc*.5);S.money+=loot;log(`${v.n} mekânına çöktünüz. Mekân artık ${S.org.name}'in. Kasadan ${fmt(loot)} çıktı.`,'gold');if(ch(.25))casualties(1)}
  else{add('respect',-4);add('heat',8);log(`${v.n} baskını başarısız oldu. ${r.n} hazırlıklıydı.`,'bad');casualties(R(1,2))}}
function hitRival(r,p){r.war=true;const t=`${pick(NICK)} ${pick(NAMES)}`;
  if(ch(p)){r.pow=Math.max(10,r.pow-7);gainResp(6);add('heat',8);log(`${r.n}'in adamı ${t} hastanelik edildi. Rakip zayıfladı.`,'good')}
  else{add('heat',5);log(`${t}'e kurulan pusu boşa çıktı.`,'bad');casualties(1)}}
function orgQuarter(f){
  if(!S.org)return;const o=S.org;
  o.members.forEach(m=>{if(m.jail)m.jail--;if(m.hurt)m.hurt--;m.loy=clamp(m.loy-R(0,2))});
  const inc=Math.round(o.turf.reduce((s,v)=>s+v.inc,0)*f*(S.abroad?.5:1)),wages=Math.round(o.members.reduce((s,m)=>s+m.wage,0)*f);
  if(inc)S.money+=inc;
  if(wages){fund(wages);if(S.money>=wages){S.money-=wages}else{o.members.forEach(m=>m.loy=clamp(m.loy-15));log('Adamlarının paylarını ödeyemedin. Sadakat düşüyor.','bad')}}
  if(inc||wages)log(`${o.name}: bölge geliri ${fmt(inc)}, adamların payı ${fmt(wages)}.`,inc>=wages?'good':'dim');
  o.members.filter(m=>m.loy<20).forEach(m=>{o.members=o.members.filter(x=>x!==m);if(ch(.5)){add('heat',18);log(`${m.name} sana ihanet etti, polise bilgi verip ortadan kayboldu.`,'bad')}else log(`${m.name} sadakatini kaybetti ve aileden ayrıldı.`,'bad')});
  S.rivals.forEach(r=>{r.pow=Math.min(r.base+20,r.pow+R(1,3));if(!r.war&&!r.ally&&!r.dead&&!S.jail&&o.turf.length>=2&&!S.council.rules.includes('ateskes')&&ch(.04)){r.war=true;log(`${r.n}, büyümenden rahatsız olup sana savaş ilan etti!`,'bad')}});
  if(S.jail)return;
  const g=o.guard===QS()-1?.5:1;
  const wr=S.rivals.filter(r=>r.war&&!r.dead);
  for(const r of wr){if(!ch(.3*g))continue;
    const mine=o.turf.filter(v=>v.from===r.id);
    if(mine.length&&ch(.55)){const v=pick(mine);const p=battleP(r.pow,.05);
      queue({back:null,title:'Misilleme!',text:`${r.n}, ${v.n} mekânını geri almak için adamlarıyla geldi.`,prem:{t:'Dayının adamları mekânı korusun',sub:'Kayıpsız zafer',fn:()=>{r.pow=Math.max(10,r.pow-8);gainResp(6);log(`Dayının adamları ${r.n} saldırısını kapıda durdurdu.`,'gold')}},choices:[
        {t:'Mekânı savun',sub:`Şans %${Math.round(p*100)}`,fn:()=>{if(ch(p)){r.pow=Math.max(10,r.pow-6);gainResp(5);log(`${v.n} savunuldu. ${r.n} geri çekildi.`,'good')}else{o.turf=o.turf.filter(x=>x!==v);delete v.from;r.venues.push({id:v.id,n:v.n,inc:v.inc});log(`${v.n} mekânını kaybettin.`,'bad');casualties(1)}}},
        {t:'Mekânı bırak',sub:'Kayıp yok · Saygı −6',fn:()=>{o.turf=o.turf.filter(x=>x!==v);r.venues.push({id:v.id,n:v.n,inc:v.inc});add('respect',-6);log(`${v.n} mekânını savaşmadan bıraktın.`,'bad')}}]});break}
    else if(o.members.length&&ch(.6)){log(`${r.n} adamlarından birine saldırdı!`,'bad');casualties(1);break}
  }
}
EXTRA.org=()=>{
  if(!S.org){let h=`<p class="note">Kendi aileni kur: abilerin, kuzenlerin ve sokaktan topladığın adamlarla bir örgüt oluştur. Onlara görev ver, düşman çetelerin mekânlarına çök, bölgeni büyüt.</p><div class="sec">Akrabaların</div>`;
    S.rels.filter(r=>!r.dead).forEach(r=>h+=row('data-x="nop:"','🧔',r.name,`${r.kin} · Güç ${r.str}/10`,'',true));
    h+=row('data-x="found:"','👑','Kendi aileni kur',S.age<18?'18 yaşından itibaren':(S.respect<20&&!S.premium)?`En az 20 saygı gerekir (şu an ${S.respect})`:`Kuruluş ${fmt(100000)}`,'',S.age<18||(S.respect<20&&!S.premium)||!!S.jail);
    return['Kendi ailen',h]}
  const o=S.org,inc=o.turf.reduce((s,v)=>s+v.inc,0),wg=o.members.reduce((s,m)=>s+m.wage,0),wars=S.rivals.filter(r=>r.war);
  let h=`<div class="sum"><div><span>Aile</span><b>${o.name}</b></div><div><span>Güç</span><b style="color:var(--gold)">${orgPow()}</b></div><div><span>Üye</span><b>${o.members.length} (${avail().length} sahada)</b></div><div><span>Bölge geliri / yıl</span><b style="color:var(--good)">${fmt(inc)}</b></div><div><span>Adamların payı / yıl</span><b>${fmt(wg)}</b></div><div><span>Savaş</span><b style="color:${wars.length?'var(--blood)':'var(--ink)'}">${wars.length?wars.map(r=>r.n).join(', '):'Yok'}</b></div></div>`;
  h+=row('data-x="allout:"','🚀','Tüm ekibi sahaya sür','Boştaki herkes gücüne göre bir göreve çıkar','',!avail().filter(m=>m.busy!==QS()).length);
  h+=row('data-x="bonusall:"','💰','Herkese prim ver',`Bütün üyelerin sadakati +15`,fmtS(o.members.reduce((x,m)=>x+m.str*5000,0)),!o.members.length||!canPay(o.members.reduce((x,m)=>x+m.str*5000,0)));
  h+=row('data-go="rakip"','⚔️','Düşman çeteler','Savaş, mekân baskını, saldırı','›',false);
  h+=`<div class="sec">Üyeler (${o.members.length}/12)</div>`;
  if(!o.members.length)h+='<p class="note">Henüz kimse yok. Aşağıdan akrabalarını ve sokaktan adam ekle.</p>';
  o.members.forEach(m=>{const st=m.jail?'🔒 Cezaevinde':m.hurt?'🩹 Yaralı':m.busy===QS()?'Görevde':'Hazır';h+=`<button class="row" data-x="mem:${m.id}"><span class="ic">${m.kin?'🧔':'🕶'}</span><span class="tx"><b>${m.name}</b><span>${m.kin?m.kin+' · ':''}Güç ${m.str} · ${st}</span><div class="bar" style="margin-top:5px"><i style="width:${m.loy}%;background:${m.loy>=60?'var(--good)':m.loy>=30?'var(--warn)':'var(--blood)'}"></i></div></span><span class="rt">›</span></button>`});
  if(o.turf.length){h+='<div class="sec">Bölgen</div>';o.turf.forEach(v=>h+=row('data-x="nop:"','🏚',v.n,`Yıllık ${fmtS(v.inc)}${v.from?' · '+RV(v.from).n+'\'den alındı':''}`,'',true))}
  h+='<div class="sec">Eleman ekle</div>';
  S.rels.filter(r=>!r.joined&&!r.dead).forEach(r=>h+=row(`data-x="recrel:${r.id}"`,'🧔',r.name,`${r.kin} · Güç ${r.str}/10 · Kan bağı, sadakat yüksek`,'Davet et',o.members.length>=12));
  S.friends.filter(f=>f.job==='sokak'&&!f.inOrg).forEach(f=>h+=row(`data-x="recfr:${f.id}"`,'🧢',f.name,`Sokak dostun · Yakınlık %${f.rel}`,'Teklif et',o.members.length>=12||f.rel<40));
  h+=row('data-x="recst:"','🎲','Sokaktan adam topla','Üç aday arasından seç',fmtS(20000),o.members.length>=12||!canPay(20000));
  return['Kendi ailen',h]};
EXTRA.rakip=()=>{let h=`<p class="note">${S.org?`Senin gücün: <b style="color:var(--gold)">${orgPow()}</b>. Güç; adamlarının sayısına, gücüne, sadakatine, saygına ve karizmana bağlıdır.`:'Kendi aileni kurmadan da onlarla kavga edebilirsin; mekân basmak için önce aileni kurmalısın.'}</p>`;
  S.rivals.forEach(r=>{const cmp=S.org?orgPow()-r.pow:0;h+=`<button class="row" data-x="riv:${r.id}"><span class="ic">${r.war?'⚔️':'🐍'}</span><span class="tx"><b>${r.n}</b><span>${r.dead?'Dağıldı':r.boss.name} · Güç ${r.pow} · ${r.venues.length} mekân${r.ally?' · <b style="color:var(--good)">Müttefik</b>':''}${r.war?' · <b style="color:var(--blood)">Savaşta</b>':''}</span>${S.org?`<span class="risk ${cmp>10?'r1':cmp>-10?'r2':'r3'}">${cmp>10?'Senden zayıf':cmp>-10?'Denk':'Senden güçlü'}</span>`:''}</span><span class="rt">›</span></button>`});
  return['Düşman çeteler',h]};

/* ============ Gazete ============ */
const PAPERS=['Sabah Postası','Akşam Haber','Boğaz Gazetesi','Manşet','İstanbul Ekspres'];
function news(t,w=1){if(!S.newsQ||w>S.newsQ.w)S.newsQ={t,w}}
function publishNews(){
  const y=(S.birthYear||1996)+S.age;
  if(S.newsQ){const p=pick(PAPERS);S.papers.push({y,q:S.q||0,p,t:S.newsQ.t,me:1});log(`📰 ${p}: "${S.newsQ.t}"`,'news');S.fame=clamp((S.fame||0)+S.newsQ.w*3);if(S.newsQ.w>=3)add('heat',3)}
  else if(ch(.18)&&S.rivals){const r=pick(S.rivals);const t=pick([`${r.n} yeni bir mekân açtı`,`Polis ${r.n} üyelerine operasyon düzenledi`,`Boğaz'da lüks yat partisi: yeraltı dünyası bir aradaydı`,`Belediye ihalesinde şaibe iddiası`,`Liman'da konteyner dolusu kaçak mal ele geçirildi`]);S.papers.push({y,q:S.q||0,p:pick(PAPERS),t});}
  if(S.papers.length>60)S.papers=S.papers.slice(-60);
  S.newsQ=null;S.fame=clamp((S.fame||0)-.5);
}
EXTRA.luks=()=>{let h='<p class="note">Lüks oyuncaklar karizma verir ama bakım masrafları yıllık giderlerine eklenir.</p>';
  LUX.forEach(l=>{const own=hasL(l.id);h+=row(own?`data-x="luxs:${l.id}"`:`data-x="luxb:${l.id}"`,l.ic,l.n,`${l.d} · Karizma +${l.k} · Bakım ${fmtS(l.up)}/yıl`,own?`Sat ${fmtS(l.p*.6)}`:fmtS(l.p),!own&&!canPay(l.p))});
  return['Lüks oyuncaklar',h]};
EXTRA.gazete=()=>{let h=`<p class="note">Ünün: <b style="color:var(--gold)">%${Math.round(S.fame||0)}</b>. Manşetlere çıktıkça ünün ve karizman artar, ama polis de okur.</p>`;
  const ps=[...S.papers].reverse();if(!ps.length)h+='<p class="note">Henüz gazetelerde adın geçmedi.</p>';

  return['Gazete',h]};

EXTRA.basarim=()=>{const got=ACH.filter(a=>S.ach[a[0]]).length;let h=`<p class="note">${got}/${ACH.length} başarım. Başarımlar kuşaktan kuşağa geçer.</p><div class="grid">`;
  ACH.forEach(([id,n,d])=>{const ok=S.ach[id]!==undefined;h+=`<div class="it ${ok?'on':''}" style="opacity:${ok?1:.55}"><span style="font-size:30px">${ok?'🏆':'🔒'}</span><b>${n}</b><em>${d}</em></div>`});

EXTRA.egitim=()=>{let h='';
  if(S.age<17)return['Eğitim',h+'<p class="note">Üniversite 17 yaşından itibaren.</p>'];

  const g=S.grads||[];

/* ============ Siyaset ============ */
const OFFICES=[
  {id:'meclis',n:'Belediye meclis üyesi',age:25,cost:300000,sal:150000,base:.5},
  {id:'belediye',n:'Belediye başkanı',age:30,cost:2500000,sal:600000,base:.38,need:'meclis'},
  {id:'mv',n:'Milletvekili',age:30,cost:6000000,sal:900000,base:.35},
  {id:'bakan',n:'Bakan',age:35,sal:1500000,need:'mv',appoint:true}];
const OF=id=>OFFICES.find(o=>o.id===id);
function polQuarter(){const P=S.pol;if(!P.office)return;
  const o=OF(P.office);const sal=Math.round(o.sal*.25);S.money+=sal;S.taxInc=(S.taxInc||0)+sal;P.inf=clamp(P.inf+2);P.term--;
  log(`${o.n} maaşı: ${fmt(sal)}.`,'dim');
  if(S.jail){log(`Hapse girdiğin için ${o.n.toLowerCase()} görevinden düştün.`,'bad');news(`${o.n} ${S.first} ${S.last} tutuklandı!`,3);P.office=null;return}
  if(S.heat>=60&&ch(.15)){queue({title:'Skandal!',text:'Bir gazete yeraltı bağlantılarını ortaya çıkardı. Muhalefet istifanı istiyor.',prem:{t:'Dayının basın bağlantıları',sub:'Haber yalanlanır',fn:()=>{add('heat',-10);log('Haber ertesi gün "asılsız iddia" olarak yalanlandı.','gold')}},choices:[
    {t:'Basını sustur',sub:fmt(1000000),dis:!canPay(1000000),fn:()=>{pay(1000000);add('heat',-8);log('Skandal kapandı. Pahalıya patladı.','dim')}},
    {t:'Görmezden gel',sub:'Şans %50',fn:()=>{if(ch(.5))log('Skandal kendiliğinden söndü.','good');else{log(`Görevden alındın.`,'bad');news(`${S.first} ${S.last} görevden alındı`,3);P.office=null}}},
    {t:'İstifa et',fn:()=>{log('İstifa ettin.','dim');P.office=null}}]})}
  if(P.office&&P.term<=0){log(`${o.n} olarak görev süren doldu.`,'dim');P.prev=P.office;P.office=null}
}
ACT.run=id=>{const o=OF(id);closeSheet();const P=S.pol;
  const ch0=b=>clamp(o.base+S.respect/300+karizma()/200+(S.fame||0)/300+P.inf/200-S.heat/250+b,.05,.95);
  queue({back:'siyaset',title:`${o.n} adaylığı`,text:`Seçim kampanyası parayla döner. Ne kadar harcayacaksın? Saygın, karizman, ünün ve nüfuzun şansını artırır; polis dikkati düşürür.`,
    prem:{t:'Dayının parti bağlantısı',sub:'Kesin zafer',fn:()=>winElect(o)},
    choices:[[1,0,'Mütevazı kampanya'],[2,.12,'Güçlü kampanya'],[3,.22,'Her köşede afiş']].map(([m,b,n])=>({t:n,sub:`${fmt(o.cost*m)} · Şans %${Math.round(ch0(b)*100)}`,dis:!canPay(o.cost*m),fn:()=>{pay(o.cost*m);if(ch(ch0(b)))winElect(o);else{log(`${o.n} seçimini kaybettin.`,'bad');news(`${S.first} ${S.last} seçimde hezimete uğradı`,1)}}})).concat([{t:'Vazgeç',fn:()=>{}}])})};
function winElect(o){S.pol.office=o.id;S.pol.term=20;S.pol.inf=clamp(S.pol.inf+10);S.stats.elections++;gainResp(6);log(`Seçimi kazandın! Artık ${o.n.toLowerCase()}sın.`,'gold');news(`${S.first} ${S.last} ${o.n.toLowerCase()} seçildi!`,3)}
ACT.lobby=()=>{if(!pay(5000000))return;if(ch(.4+S.pol.inf/300)){S.pol.office='bakan';S.pol.term=20;log('Bakanlığa atandın!','gold');news(`Yeni bakan: ${S.first} ${S.last}`,4)}else log('Lobi çalışması sonuç vermedi. Bu sefer.','bad');done()};
ACT.buypol=()=>{if(!pay(1000000))return;S.pol.inf=clamp(S.pol.inf+R(10,18));log('Bir milletvekiliyle "özel" bir yemek yedin. Nüfuzun arttı.','dim');done()};
ACT.ihale=()=>{if(S.pol.ihaleQ===QS())return;S.pol.ihaleQ=QS();const m=R(5,30)*100000;S.money+=m;add('heat',8);S.pol.inf=clamp(S.pol.inf+3);log(`Belediye ihalesini kendi şirketine verdin: ${fmt(m)}.`,'gold');if(ch(.3))news('Belediye ihalesinde akraba şirket iddiası',2);done()};
EXTRA.siyaset=()=>{const P=S.pol;let h=`<div class="sum"><div><span>Görev</span><b>${P.office?OF(P.office).n:'Yok'}</b></div>${P.office?`<div><span>Görev süresi</span><b>${fmtJ(P.term/4)}</b></div>`:''}<div><span>Siyasi nüfuz</span><b style="color:var(--gold)">%${P.inf}</b></div></div>`;
  h+='<p class="note">Nüfuz %40 olunca yakalandığında "Siyasetçi dostunu ara" seçeneği açılır. Milletvekilleri dokunulmazlığa sahiptir.</p>';
  if(P.office==='belediye')h+=row('data-x="ihale:"','🏗','İhaleleri yönet','Her çeyrek bir kez · Para ++ · Dikkat +','',P.ihaleQ===QS());
  if(P.office==='mv')h+=row('data-x="lobby:"','🏛','Bakanlık için lobi yap',`Şans %${Math.round((.4+P.inf/300)*100)}`,fmtS(5000000),!canPay(5000000));
  h+=row('data-x="buypol:"','🤝','Siyasetçi satın al','Nüfuz +10–18',fmtS(1000000),!canPay(1000000));
  if(!P.office){h+='<div class="sec">Seçimler</div>';OFFICES.filter(o=>!o.appoint).forEach(o=>{const lock=S.age<o.age||(o.need&&!(P.prev===o.need||S.stats.elections>0));h+=row(`data-x="run:${o.id}"`,'🗳',`${o.n} adayı ol`,lock?(S.age<o.age?`${o.age} yaşından itibaren`:'Önce meclis üyeliği kazanmalısın'):`Kampanya ${fmtS(o.cost)}'den başlar · Yıllık maaş ${fmtS(o.sal)}`,'',lock||!!S.jail)})}
  return['Siyaset',h]};

/* ============ Kumarhane ============ */
function betModal(title,fn){const opts=[1000,10000,100000,1000000,10000000].filter(a=>a<=S.money);
  if(!opts.length){toast('Masaya oturacak paran yok.');return}closeSheet();
  queue({back:'kumar',title,text:`Ne kadar oynuyorsun? Kasa: ${fmt(S.money)}`,choices:[...opts.map(a=>({t:fmt(a),fn:()=>setTimeout(()=>fn(a),30)})),{t:'Vazgeç',fn:()=>{}}]})}
function gwin(a,mult,t){const w=Math.round(a*mult);S.money+=w-a;S.stats.wins++;if(w-a>=1e6){S.stats.bigwin++;news(`Kumarhanede ${fmt(w-a)}'lik vurgun!`,2)}add('happy',4);log(`${t} ${fmt(w-a)} kazandın.`,'good');toast('+'+fmt(w-a))}
function glose(a,t){S.money-=a;add('happy',-3);log(`${t} ${fmt(a)} kaybettin.`,'bad');toast('−'+fmt(a))}
ACT.rulet=()=>betModal('Rulet',a=>{const n=R(0,36);const red=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n);const col=n===0?'yeşil':red?'kırmızı':'siyah';
  queue({back:'kumar',title:'Rulet',text:`${fmt(a)} ortada. Neye oynuyorsun?`,prem:{t:'Krupiye dayının adamı',sub:'Kazanç ×2',fn:()=>gwin(a,2,'Top senin rengine düştü, ne tesadüf.')},choices:[
    {t:'Kırmızı',sub:'×2',fn:()=>col==='kırmızı'?gwin(a,2,`Top ${n} kırmızıda durdu!`):glose(a,`Top ${n} ${col}da durdu.`)},
    {t:'Siyah',sub:'×2',fn:()=>col==='siyah'?gwin(a,2,`Top ${n} siyahta durdu!`):glose(a,`Top ${n} ${col}da durdu.`)},
    {t:'Sıfır',sub:'×36',fn:()=>n===0?gwin(a,36,'SIFIR! Masa çıldırdı.'):glose(a,`Top ${n} ${col}da durdu.`)}]})});
ACT.zar=()=>betModal('Barbut',a=>{const d1=R(1,6),d2=R(1,6),s=d1+d2;

  const w=H.map(h=>.92/h[1]);const tot=w.reduce((x,y)=>x+y,0);let r=Math.random()*tot,win=0;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0){win=i;break}}

const CARD=()=>R(1,13);const cv=c=>c>=10?10:c===1?11:c;const cn=c=>({1:'A',11:'J',12:'Q',13:'K'}[c]||c);
function bjTotal(h){let t=h.reduce((s,c)=>s+cv(c),0),a=h.filter(c=>c===1).length;while(t>21&&a--)t-=10;return t}
ACT.bj=()=>betModal('Blackjack',a=>{const P=[CARD(),CARD()],D=[CARD(),CARD()];bjStep(a,P,D)});
function bjStep(a,P,D){const pt=bjTotal(P);
  if(pt===21&&P.length===2){gwin(a,2.5,'Blackjack!');return done()}
  if(pt>21){glose(a,`Elin ${P.map(cn).join(' ')} (${pt}), battın.`);return done()}
  queue({back:'kumar',title:'Blackjack',text:`Senin elin: <b>${P.map(cn).join(' ')}</b> (${pt}) · Krupiye: <b>${cn(D[0])} ?</b>`,choices:[
    {t:'Kart çek',fn:()=>{P.push(CARD());setTimeout(()=>bjStep(a,P,D),30)}},
    {t:'Dur',fn:()=>{while(bjTotal(D)<17)D.push(CARD());const dt=bjTotal(D);const txt=`Krupiye: ${D.map(cn).join(' ')} (${dt}).`;
      if(dt>21||pt>dt)gwin(a,2,txt);else if(pt===dt){log(txt+' Berabere, paran iade.','dim')}else glose(a,txt)}}]})}

ACT.gusta=()=>{const g=S.gal;const c=Math.round([1e6,4e6,1.2e7][g.usta]*S.cpi);if(g.usta>=3||!pay(c))return;g.usta++;log(`Galerine ${['','usta kaportacı','boya ve mekanik atölyesi','tam donanımlı servis'][g.usta]} eklendi. Tamirler %${g.usta*15} ucuz.`,'good');done()};
ACT.gaut=()=>{const g=S.gal;closeSheet();const yr=Math.max(GTIER[g.tier].cap*3e6*S.cpi,g.stock.reduce((t,c)=>t+galVal(c),0)*2);const opts=[1e6,5e6,2e7,1e8].filter(a=>a<=S.money);

function galQuarter(){const g=S.gal;if(!g)return;const T=GTIER[g.tier];
  if(S.q===0){const r=Math.round(T.rent*S.cpi);fund(r);S.money=Math.max(0,S.money-r);log(`Galeri kirası ve personel: ${fmt(r)}.`,'dim')}
  g.stock.forEach(c=>{if(c.rep&&c.rep!==QS()){c.rep=null;c.clean=Math.round(c.clean*Math.min(1,PV[c.d]+(c.rec?.16:0)));c.wd=c.d;c.d=0;log(`${CM(c.mid).n} tamirden çıktı, satışa hazır.`,'good')}});
  g.stock.filter(c=>!c.d&&!c.rep).forEach(c=>{const p={0:.7,10:.48,20:.28,35:.13}[c.ask]+T.sell+karizma()/400;if(ch(p)){const v=Math.round(galVal(c)*(1+c.ask/100)*R(96,103)/100);galSold(c,v,'müşteriye')}});

  h+='<div class="sec">İşletme</div>';
  if(g.usta<3)h+=row('data-x="gusta:"','🔧',['Usta kaportacı tut','Boya ve mekanik atölyesi kur','Tam donanımlı servis kur'][g.usta],`Tamirler %${(g.usta+1)*15} ucuzlar`,fmtS([1e6,4e6,1.2e7][g.usta]*S.cpi),!canPay([1e6,4e6,1.2e7][g.usta]*S.cpi));

let MGT=null;
function mgOpen(html){$('mgc').innerHTML=html;$('mg').classList.add('on')}
function mgClose(){$('mg').classList.remove('on');cancelAnimationFrame(MGT);$('mgc').onclick=null}
function miniGame(t,cb,opp){const done2=ok=>{cb(ok);afterChange();scrollLog()};if(t==='kasa')mgSafe(done2);else if(t==='kovala')mgChase(done2);else mgFight(done2,opp)}
function mgSafe(cb){const code=[R(1,6),R(1,6),R(1,6)];let cur=[],hist=[],left=6;
  const draw=()=>mgOpen(`<h2>Kasayı aç</h2><p class="mgp">3 haneli şifre, rakamlar 1–6. <b>●</b> doğru rakam doğru yerde, <b>○</b> doğru rakam yanlış yerde. Kalan deneme: <b>${left}</b></p>
    <div class="mgh">${hist.map(h=>`<div><b>${h.g.join(' ')}</b><span>${'●'.repeat(h.a)}${'○'.repeat(h.b)}${!h.a&&!h.b?'—':''}</span></div>`).join('')}</div>
    <div class="mgcur">${[0,1,2].map(i=>`<span>${cur[i]||'·'}</span>`).join('')}</div>
    <div class="mgpad">${[1,2,3,4,5,6].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="del">⌫</button><button data-n="give" class="mggive">Kaç</button></div>`);
  draw();
  $('mgc').onclick=e=>{const btn=e.target.closest('[data-n]');if(!btn)return;const n=btn.dataset.n;
    if(n==='give'){mgClose();cb(false);return}
    if(n==='del'){cur.pop();draw();return}
    if(cur.length<3)cur.push(+n);
    if(cur.length===3){let a=0,bb=0;const cc=code.slice(),gg=cur.slice();
      for(let i=0;i<3;i++)if(gg[i]===cc[i]){a++;cc[i]=gg[i]=null}
      for(let i=0;i<3;i++)if(gg[i]!=null){const j=cc.indexOf(gg[i]);if(j>=0){bb++;cc[j]=null}}
      hist.push({g:cur,a,b:bb});cur=[];left--;
      if(a===3){mgClose();toast('Kasa açıldı!');cb(true);return}
      if(left<=0){mgClose();toast(`Şifre ${code.join('')} idi. Alarm çaldı!`);cb(false);return}}

ACT.lart=id=>{const l=S.label,a=l.roster.find(x=>x.id===id);if(!a)return;closeSheet();const sc=Math.round(3e5*S.cpi),kc=Math.round(1.2e6*S.cpi),ac=Math.round(3e6*S.cpi);

  const yr=Math.max(lblRev()*4,1e6*S.cpi)+l.roster.length*2e6*S.cpi;const opts=[1e6,1e7,5e7,1e8,5e8].filter(a=>a<=S.money);
  const way={bot:['Sahte dinlenme (bot)','Kara parayla dinlenme satın alınır, platformlar telif olarak geri öder.',.9,1],bilet:['Hayalet bilet satışı','Konserlere hiç satılmamış biletler satılmış gibi gösterilir.',.88,.8],telif:['Yurt dışı telif','Paravan şirketlerden şarkılara telif ödemesi yapılır.',.85,.6]}[k];

ACT.lsell=()=>{const l=S.label;const v=Math.round(lblRev()*4*3+l.cash+l.roster.reduce((t,a)=>t+a.fame*a.fame*2000,0)*S.cpi+2e6*S.cpi);closeSheet();queue({back:'muzik',title:'Şirketi sat',text:`${l.name} için ${fmt(v)} teklif var (kasa ve katalog dahil).`,choices:[{t:'Sat',fn:()=>{S.money+=v;log(`${l.name}'ı ${fmt(v)}'ye sattın.`,'gold');S.label=null}},{t:'Vazgeç',fn:()=>{}}]})};

  if(S.q===0&&l.roster.length){const fee=l.roster.reduce((t,a)=>t+a.fee,0)+Math.round(1e6*S.cpi);l.cash-=fee;log(`${l.name}: yıllık sözleşmeler ve stüdyo gideri ${fmt(fee)}.`,'dim')}

/* ============ Sosyal medya ============ */
const fmtF=n=>n>=1e6?(n/1e6).toLocaleString('tr-TR',{maximumFractionDigits:1})+' Mn':n>=1e3?(n/1e3).toLocaleString('tr-TR',{maximumFractionDigits:1})+' B':String(n);
function smGain(mult){const sm=S.sm;const luxS=(S.lux||[]).length*2+(curCar()?CM(curCar().mid).k:0);const base=(karizma()*60+(S.fame||0)*250+luxS*300+sm.f*.02)*mult*(sm.ver?1.3:1);const dim=Math.pow(.6,sm.pq===QS()?sm.pc:0);const g=Math.round(base*dim*R(60,140)/100);if(sm.pq!==QS()){sm.pq=QS();sm.pc=0}sm.pc++;sm.f+=g;return g}
ACT.post=k=>{const sm=S.sm;let g;
  if(k==='normal'){g=smGain(1);log(`Bir paylaşım yaptın: +${fmtF(g)} takipçi.`,'good')}
  if(k==='luks'){g=smGain(2.2);add('heat',4);log(`Lüks hayatını paylaştın: +${fmtF(g)} takipçi. Mali Şube de beğendi.`,'good')}
  if(k==='canli'){g=smGain(1.4);add('happy',4);log(`Canlı yayın açtın: +${fmtF(g)} takipçi.`,'good')}
  if(sm.f>=1e6&&!sm.m1){sm.m1=1;S.fame=clamp((S.fame||0)+10);news(`${S.first} ${S.last} 1 milyon takipçiye ulaştı`,1)}
  done()};
ACT.tik=()=>{if(!pay(20000))return;S.sm.ver=true;log('Hesabın onaylandı. Mavi tik artık senin.','good');done()};
ACT.reklam=()=>{const sm=S.sm;if(sm.aq===QS())return;sm.aq=QS();const m=Math.round(sm.f*R(50,200)/100);S.money+=m;S.taxInc=(S.taxInc||0)+m;log(`${pick(['Bir saat markası','Bir enerji içeceği','Bir otomobil bayisi','Bir parfüm','Bir bahis sitesi'])} ile reklam anlaşması: ${fmt(m)}.`,'gold');done()};
function smQuarter(){const sm=S.sm;if(sm.f>0){sm.f=Math.round(sm.f*.985);S.fame=clamp(Math.max(S.fame||0,Math.log10(Math.max(1,sm.f))*6-12))}}
EXTRA.sosyal=()=>{const sm=S.sm;let h=`<div class="sum"><div><span>Takipçi</span><b style="color:var(--gold)">${fmtF(sm.f)}${sm.ver?' ✔️':''}</b></div><div><span>Ün</span><b>%${Math.round(S.fame||0)}</b></div></div>`;
  h+='<p class="note">Karizman, ünün, araban ve lüks oyuncakların takipçi kazandırır. Aynı çeyrekte peş peşe paylaşım yaptıkça etkisi azalır.</p>';
  h+=row('data-x="post:normal"','📷','Paylaşım yap','Takipçi +','',false)+row('data-x="post:canli"','🔴','Canlı yayın aç','Takipçi + · Mutluluk +','',false)+row('data-x="post:luks"','💸','Lüks hayatını paylaş','Takipçi ++ · Dikkat +','',false);
  h+=row('data-x="tik:"','✔️','Mavi tik al','Takipçi kazancı %30 artar',sm.ver?'✓':fmtS(20000),sm.ver||sm.f<100000||!canPay(20000));
  h+=row('data-x="reklam:"','🤝','Reklam anlaşması',sm.f<50000?'50 B takipçiden itibaren':sm.aq===QS()?'Bu çeyrek anlaşma yaptın':'Takipçine göre ödeme','',sm.f<50000||sm.aq===QS());
  return['Sosyal medya',h]};
