/* ============ Haftalık görevler ve başarım ödülleri ============ */
const wkKey=()=>Math.floor((Date.now()/864e5+3)/7);
function wkM(){return{q:S.age*4+(S.q||0),nw:netWorth(),resp:S.respect,fr:S.friends.length,turf:S.org?S.org.turf.length:0,cr:S.stats.crimes||0,gal:S.gal?S.gal.sold:0,rt:S.rtTrips||0}}
const WKT=[
  ['q',n=>`${n} çeyrek ilerle`,()=>pick([8,12,16]),()=>true],
  ['nw',n=>`Servetine ${fmtS(n)} ekle`,b=>Math.round(Math.max(1e6*S.cpi,b.nw*.15)/1e5)*1e5,()=>true],
  ['fr',n=>`${n} yeni dost edin`,()=>pick([2,3]),()=>S.friends.length<MAXF-3],
  ['cr',n=>`${n} iş çevir (İşler)`,()=>pick([5,8,12]),()=>S.age>=14],
  ['turf',n=>`${n} semt ya da mekân ele geçir`,()=>1,()=>!!S.org],
  ['gal',n=>`Galeride ${n} araç sat`,()=>pick([2,3]),()=>!!S.gal],
  ['rt',n=>`${n} başarılı kaçakçılık seferi`,()=>pick([3,5]),()=>(S.routes||[]).length>0],
  ['resp',n=>`${n} saygı kazan`,()=>pick([8,12]),()=>S.respect<85]];
function wkEnsure(){if(!S)return;if(S.wk)delete S.wk;return;if(S.wk&&S.wk.key===wkKey())return;const b=wkM();const pool=WKT.filter(t=>t[3]());const pickd=[];while(pickd.length<3&&pool.length){pickd.push(pool.splice(R(0,pool.length-1),1)[0])}
  S.wk={key:wkKey(),base:b,chest:false,goals:pickd.map(([k,,tg])=>{const n=tg(b);return{k,n,done:false,got:false}})}}
function wkProg(g){const now=wkM();return Math.max(0,now[g.k]-S.wk.base[g.k])}
function wkRew(){return Math.round([100000,250000,600000,1500000,4000000,10000000][rank()]*S.cpi/1e4)*1e4}
function wkCheck(){return;S.wk.goals.forEach(g=>{if(!g.done&&wkProg(g)>=g.n){g.done=true;log(`🎯 Haftalık görev tamamlandı: ${WKT.find(t=>t[0]===g.k)[1](g.k==='nw'?g.n:g.n)}. Ödülünü al!`,'gold');toast('🎯 Görev tamamlandı')}})}
ACT.wkclaim=i=>{return;const g=S.wk.goals[+i];if(!g||!g.done||g.got)return;g.got=true;const m=wkRew();S.money+=m;tixSet(tix()+2);gainResp(2);log(`🎁 Görev ödülü: ${fmt(m)}, 2 🎟 bilet ve saygı.`,'gold');done()};
ACT.wkchest=()=>{return;if(S.wk.chest||!S.wk.goals.every(g=>g.got))return;S.wk.chest=true;const m=wkRew()*2;S.money+=m;tixSet(tix()+5);S.kb=(S.kb||0)+1;add('happy',8);log(`💎 Haftalık sandık açıldı: ${fmt(m)}, 5 🎟 bilet ve kalıcı +1 karizma!`,'gold');done()};
EXTRA.gorev=()=>EXTRA.basarim();const _oldGorev=()=>{wkEnsure();const w=S.wk;const left=7-Math.floor((Date.now()/864e5+3)%7);let h=`<p class="note">Her pazartesi 3 yeni görev gelir. Hepsini bitirirsen haftalık sandık açılır. Yenilenmeye ${left} gün.</p>`;
  w.goals.forEach((g,i)=>{const t=WKT.find(x=>x[0]===g.k);const p=Math.min(g.n,wkProg(g));const pct=Math.round(p/g.n*100);
    h+=`<div class="card" style="padding:12px;margin-bottom:8px"><b>${g.got?'✅':g.done?'🎁':'🎯'} ${t[1](g.n)}</b><div style="display:flex;align-items:center;gap:8px;margin-top:8px"><span style="flex:1;height:7px;border-radius:4px;background:#ffffff1a;overflow:hidden"><span style="display:block;height:100%;width:${pct}%;background:var(--gold)"></span></span><small>${g.k==='nw'?fmtS(p)+' / '+fmtS(g.n):p+' / '+g.n}</small></div>${g.done&&!g.got?`<button class="btn" style="margin-top:10px" data-x="wkclaim:${i}">Ödülü al · ${fmtS(wkRew())} + 2 🎟</button>`:''}</div>`});
  const all=w.goals.every(g=>g.got);h+=`<div class="sec">Haftalık sandık</div>`+row('data-x="wkchest:"','💎','Haftalık sandık',w.chest?'Bu hafta açıldı':all?'Hazır! Dokun ve aç':'3 görevin ödülünü alınca açılır',w.chest?'✓':fmtS(wkRew()*2)+' + 5 🎟',w.chest||!all);
  const got=ACH.filter(a=>S.ach[a[0]]).length;h+=`<div class="sec">Başarımlar</div><p class="note">${got}/${ACH.length} başarım açık. Başarımlar koleksiyondur, ödül vermez.</p>`+row('data-go="basarim"','🏆','Başarımlar','Hepsini gör','›',false);
  return['Haftalık görevler',h]};

function evFx(str,tt){if(!str)return;str.split(' ').forEach(tok=>{const m=tok.match(/^([a-zA-Z]+)([+-]?)(\d+)$/);if(!m)return;const k=m[1],v=(m[2]==='-'?-1:1)*+m[3];
  if(k==='h'){if(v<0)hurt(-v,tt);else add('health',v)}else if(k==='p')add('happy',v);else if(k==='r'){if(v>0)gainResp(v);else add('respect',v)}else if(k==='x')add('heat',v);else if(k==='f')S.fame=clamp((S.fame||0)+v);
  else if(k==='m'){const c=M(Math.abs(v));(fund(c),S.money=Math.max(0,S.money-c))}else if(k==='d')dirty(M(v));else if(k==='w')S.money+=M(v)})}
const evCost=str=>{let c=0;(str||'').split(' ').forEach(t=>{const m=t.match(/^m-(\d+)$/);if(m)c+=M(+m[1])});return c};

function assetsHTML(){let h='';const cpi=Math.max(1,S.cpi||1);const sec=(ic,n,v)=>`<div class="sec">${ic} ${n}${v!==undefined?` · ${fmtS(v)}`:''}</div>`;

  h+=row('data-go="kara"','@kara','Kara para kasası',S.black?'Aklanmayı bekliyor':'Boş',fmtS(S.black||0),false);

  if(S.goldKg)h+=row('data-vt="mucevher"','🥇','Külçe altın',`${S.goldKg.toLocaleString('tr-TR')} kg`,fmtS(gk),false);
  // Garaj
  const cv=S.cars.reduce((x,c)=>x+(c.val||0),0);h+=sec('🚗','Garajım',cv);
  if(S.cars.length){S.cars.slice(0,4).forEach(o=>{const m=CM(o.mid);h+=`<button class="row" data-x="mycar:${o.uid}">${carPic(m,o.hex)}<span class="tx"><b>${m.n}${S.car===o.uid?' · 🔑':''}</b><span>${o.y} · ${o.col}${(S.loans||[]).some(l=>l.uid===o.uid)?' · Kredili':''}</span></span><span class="rt">${fmtS(o.val)}</span></button>`});if(S.cars.length>4)h+=row('data-vt="araba"','🅿️',`Bütün garaj (${S.cars.length} araç)`,'','›',false)}
  else h+=row('data-go="galeri"','@garajbos','Garajın boş','Araba galerisine git','›',S.age<18);
  // Evler
  const hv=S.houses.reduce((x,o)=>x+hval(o),0);h+=sec('🏠','Evlerim',hv);
  if(S.houses.length)S.houses.forEach(o=>{const t=HT(o.t);h+=row(`data-x="house:${o.uid}"`,hIco(t),t.n,S.home===o.uid?'Burada oturuyorsun':o.ten?'Kirada · '+fmtS(o.ten.rent)+'/yıl':'Boş',fmtS(hval(o)),false)});
  else h+=row('data-go="emlak"','@evyok','Henüz evin yok','Emlakçıya git','›',S.age<18);
  // Mücevher & saat
  const jv=S.jewels.reduce((x,j)=>x+j.val,0)+(S.watches||[]).reduce((x,o)=>x+Math.round(o.usd*(S.fx?S.fx.usd:42.5)),0);
  if(jv)h+=sec('💎','Mücevher ve saatlerim',jv)+row('data-vt="mucevher"','⌚',`${(S.watches||[]).length} saat · ${S.jewels.length} mücevher`,'Kuyumcuda gör','›',false);
  // İşletmeler & şirketler
  const biz=[];S.props.forEach(id=>{const pp=PROPS.find(x=>x.id===id);if(pp)biz.push([`data-pm="${id}"`,pp.ic,pp.n,`Yıllık ${fmtS(pp.inc)}`,Math.round(pp.p*.7)])});

  // Lüks
  if((S.lux||[]).length){const lv=S.lux.reduce((x,id)=>x+Math.round(LUX.find(l=>l.id===id).p*.6),0);h+=sec('🛥','Lüks oyuncaklarım',lv);S.lux.forEach(id=>{const l=LUX.find(x=>x.id===id);h+=row('data-go="luks"',lIco(l),l.n,l.d,fmtS(l.p*.6),false)})}

  return h}

const bzRef=(b,pr)=>{const rev=b[3]*.8*(pr[5]/.35);const price=pr[3]*pr[4];return{price,base:rev/price,mkt:rev*.035}};
const bzStaff=b=>Math.max(3,Math.round(b[3]*.08/7e4));
const bzCapEq=f=>f.lvl*1.3;const bzUse=(f,b)=>f.prods.reduce((a,p)=>a+p.q/bzRef(b,b[9].find(x=>x[0]===p.id)).base,0);

function bzMig(f){if(f.v===2)return f;const b=BZ(BOLD[f.sec]||f.sec)||BIZ[0];f.sec=b[0];f.lvl=Math.max(1,f.lvl||1);f.brand=30;f.v=2;f.emp={n:bzStaff(b)*f.lvl,sal:1,mor:65};

function bzDemand(f,b,p,P){const r=bzRef(b,P);const price=PRC[p.pr];const qual=SUP[p.sup][2];

function firmQuarter(){const yr=S.q===0;(S.firms||[]).forEach(f=>{bzMig(f);const b=BZ(f.sec);const cx=cpiX();
  const need=bzNeed(f,b);const staffF=Math.min(1,f.emp.n/need)*(.7+f.emp.mor/333);const strike=f.emp.mor<20&&ch(.35);

  let rev=0,cogs=0,mk=0;

  const wages=f.emp.n*7e4*f.emp.sal*cx/4;const rent=f.lvl*bzRent(b)*cx/4;const ex=ROLES.reduce((t,[r])=>t+(f[r]?f[r].maas/4:0),0);

  ROLES.forEach(([r])=>{const e=f[r];if(e&&e.sad<30&&ch(.12)){log(`${f.name}: ${e.name} rakip şirkete geçti.`,'bad');f[r]=null}});

  if(f.cash<0){const x=Math.min(cashA(),-f.cash);if(x>0){spend(x);f.cash+=x}if(f.cash<0)log(`${f.name} zarar ediyor, kasası ekside!`,'bad')}
  if(yr){const sats=f.prods.map(p=>{const P=b[9].find(x=>x[0]===p.id);return SUP[p.sup][2]/PRC[p.pr]});const sat=sats.reduce((a,c)=>a+c,0)/Math.max(1,sats.length);
    f.brand=clamp(f.brand+(sat-1)*12+f.prods.reduce((a,p)=>a+MKT[p.mk][1],0)*1.2-1.5);
    f.rep={rev:f.yrs.rev,cost:f.yrs.cost,prof:f.yrs.prof,sat:Math.round(clamp(sat*60)),prods:f.prods.map(p=>({n:p.name,s:p.yr?p.yr.s:0,d:p.yr?p.yr.d:0,m:p.yr?p.yr.m:0,r:p.yr?p.yr.r:0}))};
    f.yrs={rev:0,cost:0,prof:0};f.prods.forEach(p=>p.yr=null);

    log(`📊 ${f.name} yıllık rapor: ciro ${fmt(f.rep.rev)}, net ${f.rep.prof>=0?'kâr':'zarar'} ${fmt(Math.abs(f.rep.prof))}. Müşteri memnuniyeti %${f.rep.sat}.`,f.rep.prof>=0?'good':'bad')}});

function firmVal(f){bzMig(f);const b=BZ(f.sec);const ann=(f.hist||[]).slice(-4).reduce((a,c)=>a+c,0)||(f.lastP||0)*4;return Math.max(0,Math.round(Math.max(b[3]*cpiX()*(.6+.4*f.lvl)*(.8+f.brand/250),ann*7)+f.cash))}

  S.houses.forEach(o=>{if(o.har||o.reno||S.home===o.uid)return;

function checkDeath(ny){
  if(!S.alive)return;
  if(S.health<=0){const cause=S.cause||S.hurtCause||'Sağlık sorunları';
    if(S.premium&&!S.dying){S.dying=true;S.health=1;S.cause=null;queue({title:'Ölümün eşiğindesin',text:`${cause}. Gözlerin kararıyor...`,prem:{t:'Dayının özel hastanesi',sub:'Hayata dön · Sağlık %80',fn:()=>{S.dying=false;S.health=80;log('Dayının özel hastanesinde gözlerini açtın. Ölümden döndün.','gold')}},choices:[{t:'Gözlerini kapat',fn:()=>{S.dying='accept';S.health=0;S.cause=cause}}]});return}
    die(cause);return}
  if(ny&&S.age>=70&&S.age>=(S.extend||0)&&ch((S.age-68)*.035)){
    if(S.premium&&!S.dying){S.dying=true;queue({title:'Son nefes',text:'Yaşlı bedenin artık yorgun. Doktorlar ailene hazırlıklı olmasını söylüyor.',prem:{t:'Dayının İsviçre kliniği',sub:'10 yıl daha · Sağlık %90',fn:()=>{S.dying=false;S.extend=S.age+10;S.health=90;log('İsviçre\'deki klinikten on yaş gençleşmiş döndün.','gold')}},choices:[{t:'Huzurla veda et',fn:()=>{S.dying='accept';S.health=0;S.cause='Yaşlılık. Yatağında, huzur içinde.'}}]});return}
    die('Yaşlılık. Yatağında, huzur içinde.')}
}

});


/* ============ iOS sabit bant koruması ============ */
(function(){
  const SCROLLERS='#log,.sh-b,.full,.card,.tabs';
  function scroller(el){while(el&&el!==document.body){if(el.matches&&el.matches(SCROLLERS))return el;el=el.parentElement}return null}
  document.addEventListener('touchstart',e=>{const sc=scroller(e.target);if(!sc)return;
    if(sc.classList.contains('tabs'))return;
    const max=sc.scrollHeight-sc.clientHeight;if(max<=0)return;
    if(sc.scrollTop<=0)sc.scrollTop=1;else if(sc.scrollTop>=max)sc.scrollTop=max-1},{passive:true});
  function hscroll(el){while(el&&el!==document.body){if(el.scrollWidth>el.clientWidth+1){const o=getComputedStyle(el).overflowX;if(o==='auto'||o==='scroll')return el}el=el.parentElement}return null}
  document.addEventListener('touchmove',e=>{if(hscroll(e.target))return;const sc=scroller(e.target);
    if(!sc){e.preventDefault();return}
    if(sc.classList.contains('tabs'))return;
    if(sc.scrollHeight<=sc.clientHeight+1)e.preventDefault()},{passive:false});
  // ekran yüksekliğini gerçek görünür alana kilitle
  function vh(){const h=(window.visualViewport?window.visualViewport.height:window.innerHeight);document.documentElement.style.setProperty('--vh',h+'px');if(typeof layout==='function')layout()}
  vh();window.addEventListener('resize',vh);if(window.visualViewport)window.visualViewport.addEventListener('resize',vh);
  window.addEventListener('scroll',()=>{if(window.scrollY)window.scrollTo(0,0)});
})();

  h+='<div class="sec" style="margin-top:22px">Kayıt yuvaları</div><p class="note">Her yuvada ayrı bir oyun. Oynadığın yuva otomatik kaydedilir.</p>';
  ['slot1','slot2','slot3'].forEach((k,i)=>{const sl=SLOTS[k];h+=`<div class="slot"><button class="row" data-ts="${k}"><span class="ic">${sl?'💾':'➕'}</span><span class="tx"><b>${sl?sl.name:'Boş yuva '+(i+1)}</b><span>${sl?`${sl.age} yaş · ${sl.rank} · ${ago(sl.at)}${sl.alive?'':' · vefat etti'}`:'Yeni oyun başlat'}</span></span><span class="rt">${sl?'Yükle':'Yeni oyun'}</span></button>${sl?`<button class="tab" data-td="${k}">Sil</button>`:''}</div>`});
  h+=`<div class="sec">Tema</div><div class="themes">${Object.entries(THEMES).map(([k,t])=>`<button class="th ${curTheme===k?'on':''}" data-tt="${k}" style="background:${t.panel};border-color:${t.gold};color:${t.ink}"><i style="background:${t.gold}"></i>${t.n}</button>`).join('')}</div>`;
  $('titleIn').innerHTML=h}
$('titleIn').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(b.id==='tCont'){UNDO.length=0;S=PENDING;ensure();hideTitle();render();scrollLog();if(!S.alive)showDead();else setTimeout(()=>{try{welcomeBack()}catch(e){console.error(e)}},300);return}
  if(d.tt){setTheme(d.tt);drawTitle();if(S)render();return}
  if(d.td){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Emin misin?';return}await delSlot(d.td);drawTitle();return}
  if(d.ts){if(SLOTS[d.ts]){await loadSlot(d.ts);hideTitle()}else{hideTitle();showCreate(d.ts)}}});
async function delSlot(k){try{if(DB){const ref=DB.collection('data/users/'+UID).doc(k);if(ref.delete)await ref.delete();else await ref.set({deleted:1})}else localStorage.removeItem('mafya-'+k)}catch(e){}SLOTS[k]=null;if(S&&S.slot===k)S.slot=null;if(PENDING&&PENDING.slot===k)PENDING.slot=null;toast('Kayıt silindi')}
ACT.menu=()=>{closeSheet();save();cloudSave(true);PENDING=JSON.parse(JSON.stringify(S));refreshSlots().then(()=>{if($('title').classList.contains('on'))drawTitle()});showTitle()};


function undo(){if(!(dayiOK()&&S&&S.premium)){queue({title:'⏪ Zamanı geri al',text:dayiOK()?'Zamanı geri almak için Dayı modunu aç.':'Zamanı geri alma <b>Dayı Paketi</b>\'ne özeldir.',choices:[...(dayiOK()?[]:[{t:'👑 Dayı Paketi',fn:()=>setTimeout(dayiShop,60)}]),{t:'Vazgeç',fn:()=>{}}]});return}if(!UNDO.length){toast('Geri alınacak bir şey yok');return}
  S=JSON.parse(UNDO.pop());Q.length=0;$('modal').classList.remove('on');$('dead').classList.remove('on');try{mgClose()}catch(e){}closeSheet();
  save();cloudSave();render();scrollLog();toast('Geri alındı')}
$('nUndo').onclick=undo;
/* ============ Başlat ============ */
(function(){try{iapInit()}catch(e){}PENDING=load();showTitle();initCloud().then(()=>{if($('title').classList.contains('on'))drawTitle()})})();
</script>
