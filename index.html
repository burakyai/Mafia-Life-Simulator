<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Derin Dünya</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Derin Dünya">
<meta name="theme-color" content="#0c0908">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cinzel:wght@600;700;900&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Noir: kömür zemin, pirinç-altın vurgu, kan kırmızısı tehlike. Tek sütun, telefon odaklı oyun ekranı. */
  --bg:#141113; --panel:#1d191b; --panel2:#272224; --line:#383032; --ink:#f1e8da; --muted:#a69c90;
  --gold:#d2a94f; --gold2:#a9832f; --blood:#b8302f; --good:#62ab76; --warn:#dc9440;
  --display:"Playfair Display",Georgia,serif; --body:"Barlow",system-ui,-apple-system,sans-serif; --cond:"Barlow Condensed","Barlow",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input{font:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}img{-webkit-user-drag:none}
body{position:fixed;inset:0;width:100%;height:var(--vh,100%);overflow:hidden;touch-action:pan-y}
#log,.sh-b,.full,.card{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#hdr,#ftr{touch-action:none}
#ftr button,#hdr .top{touch-action:manipulation}
#app{height:100%;background:var(--bg)}
#hdr,#ftr,#log{position:fixed;left:0;right:0;max-width:520px;margin:0 auto}
#hdr{top:0;z-index:6;padding-top:env(safe-area-inset-top);background:var(--bg);padding-bottom:6px}
#ftr{bottom:var(--bot,0px);z-index:6;padding-bottom:env(safe-area-inset-bottom);background:var(--panel);box-shadow:0 -8px 20px #0007}
#log{top:var(--th,96px);bottom:var(--bh,210px);z-index:1;overscroll-behavior:contain}

/* Üst bilgi */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--bg))}
.av{border-radius:50%;background:radial-gradient(circle at 50% 35%,#3b3134,#1a1517 70%);border:2px solid var(--gold2);overflow:hidden;flex:none;display:grid;place-items:center}
.av svg{width:100%;height:100%;display:block}
.emoav{display:grid;place-items:center;width:100%;height:100%;font-size:calc(1em + 0px);line-height:1}
.av .emoav{font-size:22px}.tn .av .emoav{font-size:32px}
#yasalBox{position:fixed;inset:0;z-index:80;background:#000e;display:none;align-items:center;justify-content:center;padding:18px}#yasalBox.on{display:flex}.yIn{max-width:460px;width:100%;max-height:92%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--gold2);border-radius:16px;padding:18px}.yTx{overflow:auto;font-size:13.5px;line-height:1.55;color:var(--ink)}
#picBox{position:fixed;inset:0;z-index:60;background:#000d;display:none;align-items:center;justify-content:center;padding:20px}#picBox.on{display:flex;animation:up .2s ease-out}.pbIn{display:flex;flex-direction:column;align-items:center;gap:10px;max-height:100%}.pbIn img{max-width:min(320px,80vw);max-height:72vh;border:3px solid var(--gold);border-radius:16px;box-shadow:0 14px 40px #000}.pbIn b{font-family:var(--display);font-size:22px;color:var(--ink)}.pbIn span{font-size:13px;color:var(--muted)}#picEd{padding:9px 16px;border-radius:10px;border:1px solid var(--gold);color:var(--gold);background:#0008}
.row .tx span [data-cd],.row .tx span span{display:inline;margin:0}
.pimg{width:100%;height:100%;object-fit:cover;display:block}
.avs{position:relative;display:block;width:100%;height:100%}.avs img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.avs img.glo{object-fit:fill!important;border:0!important;border-radius:0!important;box-shadow:none!important;max-width:none!important;max-height:none!important;background:none!important;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))!important;z-index:2}.av:has(>.avs),body.t-baba .av:has(>.avs){border:0;border-radius:0;background:none;box-shadow:none;overflow:visible}.av .avs{transform:none}.av .avs>img{filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.avbig{width:min(230px,60vw);aspect-ratio:1;border-radius:18px;border:2px solid var(--gold);background:radial-gradient(circle at 50% 35%,#3b3134,#1a1517 70%);overflow:hidden;box-shadow:0 10px 30px #000c}.avbig .avs{transform:scale(1.05) translateY(4%)}
.avrow{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}.avt{flex:none;width:68px;height:68px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);padding:0;overflow:hidden}.avt.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold2)}.avt .avs{transform:scale(1.25) translateY(8%)}
.avcol{display:flex;gap:14px;flex-wrap:wrap;padding-bottom:18px}.aws{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);position:relative}.aws.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold2)}.aws i{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-size:10px;font-style:normal;color:var(--muted);white-space:nowrap}
.kcard{width:min(200px,52vw);margin:0 auto 14px;border:2px solid var(--gold);border-radius:14px;overflow:hidden;position:relative;box-shadow:0 10px 30px #000c}.kcard img{width:100%;display:block;aspect-ratio:240/400;object-fit:cover;object-position:top}.kcard b{position:absolute;left:0;right:0;bottom:0;padding:8px;background:linear-gradient(transparent,#000d);font-family:var(--cond);color:var(--gold);text-align:center;letter-spacing:.05em}
.who{flex:1;min-width:0}
.who h1{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who p{font-family:var(--cond);font-size:14px;color:var(--muted);letter-spacing:.02em;margin-top:2px}
.who p b{color:var(--gold);font-weight:600}
.cash{text-align:right}
#hSet{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold2);background:#0006;font-size:14px;line-height:1;margin-right:6px;align-self:center;padding:0;cursor:pointer}
.cash small{display:block;font-family:var(--cond);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.cash strong{font-family:var(--cond);font-size:20px;font-weight:700;color:var(--good);font-variant-numeric:tabular-nums}

.banner{display:none;margin:10px 16px 0;padding:8px 12px;border-radius:8px;background:repeating-linear-gradient(90deg,#2b2426 0 10px,#231d1f 10px 20px);border:1px solid var(--line);font-family:var(--cond);font-size:15px;letter-spacing:.03em}
.banner.on{display:block}

/* Günlük */
#log{overflow-y:auto;padding:8px 16px 16px;-webkit-overflow-scrolling:touch}
.yr{padding:10px 0;border-bottom:1px dashed var(--line)}
.yr h3{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.yr p{font-size:15px;line-height:1.45;color:var(--ink);margin:3px 0}
.yr p.good{color:#8fd1a1}.yr p.bad{color:#ec8a80}.yr p.gold{color:var(--gold);font-weight:600}
.yr p.dim{color:var(--muted)}

/* İstatistikler */
#qbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 16px 0;min-height:30px}#qLeft{font-size:12px;color:var(--muted)}#qLeft b{color:var(--gold)}#qBack{margin-left:auto;display:flex;align-items:center;gap:6px;max-width:62%;padding:6px 12px;border-radius:16px;border:1px solid var(--gold2,#8a6a2a);background:var(--panel2);color:var(--gold);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.famimg{width:100%;height:100%;object-fit:cover;display:block}.famav{display:inline-block;width:64px;height:64px;border-radius:50%;overflow:hidden;border:1.5px solid var(--gold2,#8a6a2a);background:var(--panel2);flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
.st label{display:flex;justify-content:space-between;font-family:var(--cond);font-size:13px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.st label b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:#0f0d0e;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .35s}
.chips{grid-column:1/-1;display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden;min-width:0;max-width:calc(50% + 32px)}.chips::-webkit-scrollbar{display:none}.chip{flex:none;white-space:nowrap;font-size:12.5px;padding:2px 9px}.chip:last-child{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.chip{font-family:var(--cond);font-size:13px;padding:3px 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.chip b{color:var(--ink)}

/* Alt menü */
.nav{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 6px 10px;background:var(--panel);border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-family:var(--cond);font-size:13px;letter-spacing:.04em;color:var(--muted)}
.nav button svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.7}
.nav .age{margin-top:-26px}
.nav .age span.c{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 40% 30%,var(--gold),var(--gold2));display:grid;place-items:center;color:#1b1406;font-family:var(--display);font-weight:900;font-size:22px;line-height:1;box-shadow:0 6px 18px #0009,inset 0 -3px 0 #0003;border:3px solid var(--bg)}
.nav .age span.c small{display:block;font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.1em}
.nav .age:active span.c{transform:scale(.95)}

/* Alt sayfa (sheet) */
.ov{position:fixed;inset:0;background:#000a;display:none;z-index:20}
.ov.on{display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88%;background:var(--panel);border-radius:18px 18px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-h h2{font-family:var(--display);font-size:22px}
.x{width:36px;height:36px;border-radius:50%;background:var(--panel2);font-size:20px;line-height:1}
.sh-b{overflow-y:auto;padding:12px 16px 20px;-webkit-overflow-scrolling:touch}
.sec{font-family:var(--cond);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:14px 0 8px}
.sec:first-child{margin-top:2px}
.note{font-size:14px;color:var(--muted);line-height:1.4;margin-bottom:8px}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.row:not(:disabled):active{background:#312a2c}
.row .ic{width:38px;height:38px;border-radius:10px;background:#151213;display:grid;place-items:center;font-size:20px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:16px}
.row .tx span{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.row .rt{font-family:var(--cond);font-size:14px;color:var(--gold);text-align:right;white-space:nowrap}
.risk{display:inline-block;font-family:var(--cond);font-size:12px;padding:1px 7px;border-radius:999px;margin-top:4px;letter-spacing:.04em}
.r1{background:#1f3326;color:#8fd1a1}.r2{background:#3a2c17;color:#f0b866}.r3{background:#3d1b1b;color:#f09a90}

/* Gardırop */
.wprev{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0 10px}
.tab{flex:none;padding:7px 13px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-family:var(--cond);font-size:15px;color:var(--muted)}
.tab.on{background:var(--gold);color:#1b1406;border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 10px;border-radius:12px;background:var(--panel2);border:1.5px solid var(--line);text-align:center}
.it.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.it .av{width:72px;height:72px;border-width:1px}
.it b{font-size:13.5px;font-weight:600;line-height:1.15}
.it em{font-style:normal;font-family:var(--cond);font-size:13px;color:var(--muted)}
.it em.g{color:var(--gold)} .it em.k{color:var(--good)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid var(--panel2);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--gold)}

/* Olay penceresi */
.modal{position:fixed;inset:0;background:#000c;display:none;z-index:30;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--gold2);border-radius:16px;padding:20px;animation:pop .2s ease-out;max-height:90%;overflow-y:auto}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.card h2{font-family:var(--display);font-size:24px;line-height:1.15;margin-bottom:8px;text-wrap:balance}
.card p{font-size:16px;line-height:1.5;color:#e2d8ca;margin-bottom:16px}
.card .ch{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-top:8px}
.card .ch b{display:block;font-weight:600}
.card .ch span{font-family:var(--cond);font-size:14px;color:var(--gold)}
.card .ch.pr{background:linear-gradient(135deg,#4a3712,#2a2010);border-color:var(--gold);box-shadow:0 0 0 1px #d2a94f55 inset}
.card .ch.pr b{color:#f3d488}
.card .ch:not(:disabled):active{background:#332b2d}

/* Karakter oluşturma ve ölüm ekranı */
.full{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.full.on{display:block}
.full .in{max-width:480px;margin:0 auto}
.logo{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;text-align:center;letter-spacing:.01em}
.logo span{color:var(--gold)}
.tag{text-align:center;color:var(--muted);font-family:var(--cond);letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin:8px 0 16px}
.bigav{width:180px;height:180px;margin:0 auto 14px;border-width:3px}
.names{display:flex;gap:8px;margin-bottom:8px}
.names input{flex:1;min-width:0;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
.dice{padding:0 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:20px}
.btn{display:block;width:100%;padding:15px;border-radius:12px;background:linear-gradient(180deg,var(--gold),var(--gold2));color:#1b1406;font-weight:700;font-size:17px;letter-spacing:.02em;margin-top:18px}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.dead .bigav{filter:grayscale(1) contrast(1.1)}
.dead h2{font-family:var(--display);font-size:30px;text-align:center}
.dead .rip{text-align:center;color:var(--muted);margin:6px 0 18px;font-style:italic}
.sum{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum div:last-child{border:0}
.sum span{color:var(--muted)}
.sum b{text-align:right;font-variant-numeric:tabular-nums}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:14px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);text-align:left;min-height:118px}
.tile:not(:disabled):active{background:#312a2c}
.carpic{position:relative;display:inline-block;width:88px;height:39px;flex:none}.carpic img{width:100%;height:100%;object-fit:contain}.carpic i{position:absolute;right:2px;bottom:1px;width:9px;height:9px;border-radius:50%;border:1px solid #000a}
.shico{width:30px;height:30px;object-fit:contain;vertical-align:-7px;margin-right:8px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.tile .ti{font-size:28px;line-height:1;margin-bottom:6px}.tile .tiimg{width:48px;height:48px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}.row .ic .icimg{width:34px;height:34px;object-fit:contain}
.tile b{font-size:16px;font-weight:600}
.tile span:last-child{font-family:var(--cond);font-size:13.5px;color:var(--muted);line-height:1.25}
.tree{display:flex;flex-direction:column;align-items:center}
.gen{display:flex;flex-direction:column;align-items:center;width:100%}
.gl{font-family:var(--cond);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:6px 0}
.row2{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tn{display:flex;flex-direction:column;align-items:center;gap:3px;width:100px;padding:10px 6px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);text-align:center}
.tn b{font-size:13.5px;line-height:1.15}.tn span{font-family:var(--cond);font-size:12px;color:var(--muted);line-height:1.2}
.tn.me{border-color:var(--gold)}.tn.dead .av{filter:grayscale(1)}
.tl{width:2px;height:18px;background:var(--gold2);margin:2px 0}
.yr p.news{font-family:var(--display);font-style:italic;border-left:3px solid var(--gold);padding-left:8px;color:#f3e3c0}
.clip{background:#e9e1cf;color:#1d1a16;border-radius:4px;padding:10px 12px;margin-bottom:8px;box-shadow:0 2px 0 #0005}
.clip small{display:block;font-family:var(--cond);letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:#6b6152}
.clip b{font-family:var(--display);font-size:17px;line-height:1.2}
.clip.me{border-left:5px solid #a3262a}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-family:var(--cond);font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.ov,.modal,.full{bottom:var(--bot,0px)!important}
#mg .card{max-width:380px}
#ctBox{position:fixed;inset:0;z-index:70;background:#000000f0;display:none;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}#ctBox.on{display:flex}
.ctHud{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;box-sizing:border-box;font-size:15px;color:#eee}.ctHud b{font-family:var(--display);color:var(--gold);letter-spacing:.06em;font-size:15px}
.ctSt{position:relative;overflow:hidden;border:2px solid var(--gold2);border-radius:10px;box-shadow:0 10px 40px #000;touch-action:none;box-sizing:content-box}

function actLeft(k){if(!S.aq||S.aq.q!==QS()||!S.aq.m)S.aq={q:QS(),m:{}};return (ALIM[k]||3)-(S.aq.m[k]||0)}
function useAct(k,n){if(!k||S.premium)return true;if(actLeft(k)<=0){const m=AMSG[k];toast(typeof m==='function'?m():m||(ALIM[k]===1?`${n}: bu çeyrek uygun fırsat yok. Ortalığın sakinleşmesini bekle.`:`${n}: bu çeyreklik yeterince yaptın. Sonraki çeyreği bekle.`));return false}S.aq.m[k]=(S.aq.m[k]||0)+1;return true}
const actDone=k=>!S.premium&&actLeft(k)<=0;
function failP(c){return clamp((c.id==='kacak'&&S.origin==='karadeniz'?-.05:0)+c.risk-(S.school?.04:0)-karizma()*.003-rank()*.02+S.heat*.003-(has('tetikci')?.06:0)-Math.min(.06,friends('sokak')*.02)-(hasY('stiletto')?c.risk*.1:0),.05,.85)}
function doCrime(id,forced){
  const c=CRIMES.find(x=>x.id===id);
  if(S.abroad){toast('Yurt dışındayken burada iş çeviremezsin.');return}
  if(forced===undefined&&!useAct(c.id,c.n))return;
  if(forced===undefined&&!S.mgOff&&['kuyumcu','zirhli','altin','silah'].includes(c.id)){closeSheet();const sil=c.id==='silah';return queue({title:c.n,text:sil?'Tırlar sınırda. Jandarma devriyesi yaklaşıyor. Direksiyona sen mi geçeceksin, yoksa şansına mı bırakacaksın?':'Kasanın önündesin. Şifreyi kendin mi kıracaksın, yoksa şansına mı bırakacaksın?',choices:[{t:sil?'Direksiyona geç':'Kasayı kendin aç',sub:'Mini oyun · Başarırsan kesin kazanç',fn:()=>setTimeout(()=>miniGame(sil?'kovala':'kasa',ok=>doCrime(id,ok)),60)},{t:'Şansına bırak',sub:`Başarı %${Math.round((1-failP(c))*100)}`,fn:()=>doCrime(id,null)}]})}
  const pf=failP(c);
  if(forced===true?false:forced===false?true:ch(pf)){
    if(ch(clamp(.2+S.heat/200+(c.sev[1]>=5?.2:0),.2,.85))){log(`${c.n} girişimin polise takıldı.`,'bad');closeSheet();arrest(c.n,c.sev)}
    else{log(`${c.n} işi ters gitti, eli boş döndün.`,'bad');if(c.hurt&&ch(.5))hurt(R(8,22),c.n+' sırasında aldığı yaralar');add('respect',-1)}
  }else{
    const m=R(c.m[0],c.m[1]);dirty(m);gainResp(R(c.r[0],c.r[1]));add('heat',wk('gece')?Math.ceil(c.h/2):c.h);
    log(`${c.n}: ${fmt(m)} kazandın.`,'good');S.stats.crimes++;if(c.id==='silah')news(`Sınırda dev sevkiyat: ${fmt(m)}'lik kaçakçılık ağı konuşuluyor`,4);else if(c.id==='altin')news(`Asrın soygunu: havalimanından ${fmt(m)}'lik altın buhar oldu!`,4);else if(['kuyumcu','zirhli','ihale'].includes(c.id))news(c.id==='zirhli'?`Zırhlı araç soygunu! ${fmt(m)} buhar oldu`:c.id==='kuyumcu'?`Kapalıçarşı'da kuyumcu soygunu`:`İhalede şaibe: ${fmt(m)}'lik iş kimde?`,c.id==='ihale'?2:3);
    if(c.hurt&&ch(c.hurt*.4)){hurt(R(5,15),c.n+' sırasında aldığı yaralar');log('Çatışmada hafif yaralandın.','bad')}
  }
  done();
}

  if(S.age>=14)S.hidx=+(S.hidx*(1+(S.infl||.04)+R(-8,6)/100)).toFixed(3);
  watchYear();S.jewels.forEach(j=>{const d=JEWELS.find(x=>x.id===j.id);if(!d)return;j.val=Math.max(Math.round(d.p*.4),Math.round(j.val*(1+R(d.inv?-10:-5,d.inv?18:8)/100)))});
  const b=S.bank;
  if(b.loan){const L=b.loan;
    fund(L.pay);if(cashA()>=L.pay){spend(L.pay);L.left--;b.score=Math.min(1900,b.score+40);log(`Kredi taksiti ödendi: ${fmt(L.pay)}. ${L.left?L.left+' taksit kaldı.':'Kredin bitti.'}`,L.left?'dim':'good');if(!L.left)b.loan=null}
    else{b.score=Math.max(0,b.score-180);L.late=(L.late||0)+1;log('Kredi taksitini ödeyemedin. Kredi notun düştü.','bad');if(L.late>=2){icra(L.pay*L.left);b.loan=null}}
  }
  kkAll().forEach(([kid,c])=>{kkFix(c);if(!(c.debt>0))return;const kn=BK(kid).n;c.debt=Math.round(c.debt*1.5);const mn=Math.round(c.debt*.3);
    fund(mn);if(cashA()>=mn){spend(mn);c.debt-=mn;b.score=Math.min(1900,b.score+15);log(`${kn} kart asgari ödemesi: ${fmt(mn)}. Kalan kart borcun ${fmt(c.debt)}.`,'dim')}
    else{b.score=Math.max(0,b.score-120);log(`${kn} kartının asgarisini ödeyemedin. Kredi notun düştü.`,'bad');
      if(b.score<700){log(`${kn} kartını iptal etti, borç icraya gitti.`,'bad');icra(c.debt);kkSet(kid,null)}}});
  if(!b.loan&&!kkDebt())b.score=Math.min(1900,b.score+10);
}

function dataOf(r){if(!r)return null;if(typeof r.data==='function'){if(r.exists===false)return null;return r.data()||null}if(r.exists===false)return null;return r}
async function putSlot(k,p){
  if(DB){await DB.collection('data/users/'+UID).doc(k).set(p)}
  else localStorage.setItem('mafya-'+k,JSON.stringify(p));
  SLOTS[k]={name:p.name,age:p.age,rank:p.rank,at:p.at,alive:p.alive};
}
async function getSlot(k){

}
async function refreshSlots(){for(const k of ['slot1','slot2','slot3']){try{const p=await getSlot(k);SLOTS[k]=p&&p.json?{name:p.name,age:p.age,rank:p.rank,at:p.at,alive:p.alive}:null}catch(e){SLOTS[k]=null}}}
function cloudSave(now){
  if(!S)return;clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async()=>{try{const p=payload();await putSlot('aktif',p);if(S&&S.slot)await putSlot(S.slot,p);lastCloud=p.at}catch(e){}},now?0:1500);

async function loadSlot(k){

async function initCloud(){
  try{
    if(!(window.claude&&window.claude.use))return refreshSlots();

function sellStock(id,sh){const x=S.px[id],o=S.stocks[id];if(!o||sh<1)return;const v=Math.round(sh*x.p),cst=o.cost*sh/o.sh;S.money+=v;o.cost-=cst;o.sh-=sh;if(o.sh<=0)delete S.stocks[id];const pl=v-cst;log(`${STOCKS.find(s=>s.id===id).n}: ${sh.toLocaleString('tr-TR')} lot sattın, ${pl>=0?'kâr':'zarar'} ${fmt(Math.abs(pl))}.`,pl>=0?'good':'bad')}

const BRACKETS=[[54000,.15],[114000,.20],[430000,.27],[1510000,.35],[Infinity,.40]];
function incomeTax(x){let t=0,prev=0;for(const[lim,r]of BRACKETS){if(x<=prev)break;t+=(Math.min(x,lim)-prev)*r;prev=lim}return Math.round(t)}
function propTax(){return Math.round(S.houses.reduce((s,o)=>s+hval(o)*(HT(o.t).id==='yali'?.006:.002),0))}
function carTax(){return Math.round(S.cars.reduce((s,c)=>s+c.val*.015,0))}
function expenses(){ // yıllık tahmini
  const it=[];if(S.jail)return it;
  if(S.age>=18){
    if(S.home){const o=S.houses.find(x=>x.uid===S.home);if(o)it.push(['Ev faturaları','Elektrik, su, doğalgaz, internet',Math.round(15000+hval(o)*.012)])}
    else if(S.age<23)it.push(['Ailenin evi','Hâlâ ailenin yanında kalıyorsun, sadece faturalara katkı',Math.round(8000*S.cpi)]);
    else it.push(['Kira ve faturalar','Kendi evin yok, kirada oturuyorsun',Math.round(360000*S.hidx)]);
    it.push(['Market ve yaşam','Mutfak, telefon, giyim',Math.round((S.partner?36000:24000)*S.cpi)]);
  }
  if(S.cars.length)it.push(['Araba giderleri','Sigorta, kasko, bakım, yakıt',Math.round(S.cars.reduce((s,c)=>s+c.val*.03+6000,0))]);
  const kids=S.kids.filter(k=>k.age<18).length;if(kids)it.push(['Çocuk masrafları',`${kids} çocuk · okul, bakım`,Math.round(kids*25000*S.cpi)]);
  if(S.lux&&S.lux.length)it.push(['Lüks bakım','Yat, uçak, köpek masrafları',S.lux.reduce((s,id)=>s+LUX.find(x=>x.id===id).up,0)]);
  if(S.edu)it.push(['Okul harcı',DEPTS.find(x=>x.id===S.edu.d).n,DEPTS.find(x=>x.id===S.edu.d).fee]);
  if(S.alimony)it.push(['Nafaka',`${S.alimony.left} yıl kaldı`,S.alimony.amt]);
  if(S.abroad)it.push(['Yurt dışı yaşam','Kira, hayat pahalılığı',Math.round(240000*S.cpi)]);
  if(S.taxDebt>0)it.push(['Vergi taksiti','Yapılandırılmış vergi borcu',Math.round(S.taxDebt)]);
  return it}
function payExpenses(f){
  if(S.age<18||S.jail)return;
  const it=expenses();let total=0;it.forEach(x=>{if(x[0]==='Vergi taksiti')return;total+=Math.round(x[2]*f)});
  let taxPart=0;if(S.taxDebt>0){taxPart=Math.min(S.taxDebt,Math.round(S.taxDebtQ||S.taxDebt/4));}
  const all=total+taxPart;if(!all)return;fund(all);
  if(cashA()>=all||canPay(all)){pay(all);if(taxPart)S.taxDebt=Math.max(0,S.taxDebt-taxPart);log(`Giderler: ${fmt(total)}${taxPart?` + vergi taksiti ${fmt(taxPart)}`:''}.`,'dim')}
  else{const paid=S.money;S.money=0;S.bank.score=Math.max(0,S.bank.score-40);add('happy',-6);log(`Faturaları ödeyemedin (${fmt(all)} gerekiyordu, ${fmt(paid)} ödendi). Elektrikler kesildi, kredi notun düştü.`,'bad')}
}
function taxTime(){
  if(S.age<18)return;
  const tc=1;const gi=Math.round(incomeTax(S.taxInc||0)*(S.offs&&S.offs.paravan?.7:1)*tc),et=Math.round(propTax()*tc),mtv=carTax(),T=gi+et+mtv;const base=S.taxInc||0;S.incLast=base;S.taxInc=0;
  if(T<=0)return;
  const detail=`Beyan edilen gelir ${fmt(base)} · Gelir vergisi ${fmt(gi)}${et?` · Emlak vergisi ${fmt(et)}`:''}${mtv?` · MTV ${fmt(mtv)}`:''}.`;
  const evade=Math.max(.1,.35-(has('muhasebe')?.15:0)+(S.heat>50?.15:0));
  queue({title:'Vergi zamanı',text:`Vergi dairesinden yıllık bildirim geldi. Toplam: ${fmt(T)}. ${detail}`,
    prem:{t:'Dayının vergi müşaviri',sub:`Sadece ${fmt(Math.round(T*.25))} · Tamamen yasal`,fn:()=>{const c=Math.round(T*.25);(fund(c),S.money=Math.max(0,S.money-c));S.taxLast=c;log(`Dayının müşaviri bütün istisnaları buldu. Sadece ${fmt(c)} vergi ödedin.`,'gold')}},
    choices:[
    {t:'Vergini öde',sub:fmt(T),dis:!canPay(T),fn:()=>{pay(T);S.taxLast=T;add('heat',-3);S.bank.score=Math.min(1900,S.bank.score+20);log(`${fmt(T)} vergi ödedin. Devletle aran iyi.`,'good')}},
    ...(has('muhasebe')?[{t:'Muhasebecin optimize etsin',sub:fmt(Math.round(T*.7)),dis:!canPay(Math.round(T*.7)),fn:()=>{const c=Math.round(T*.7);pay(c);S.taxLast=c;log(`Muhasebecin giderleri düzenledi. ${fmt(c)} vergi ödedin.`,'good')}}]:[]),
    {t:'Taksitlendir',sub:`4 çeyrekte ${fmt(Math.round(T*1.1))} (%10 faiz)`,fn:()=>{S.taxDebt=(S.taxDebt||0)+Math.round(T*1.1);S.taxDebtQ=Math.round(S.taxDebt/4);S.taxLast=Math.round(T*1.1);log(`Vergi borcunu yapılandırdın: ${fmt(Math.round(T*1.1))}, 4 taksit.`,'dim')}},
    {t:'Vergi kaçır',sub:`Yakalanma riski %${Math.round(evade*100)}`,fn:()=>{
      if(ch(evade)){const ceza=T*2;add('heat',15);S.taxLast=ceza;log(`Vergi müfettişleri kaçakçılığı yakaladı. Ceza: ${fmt(ceza)}.`,'bad');
        if(cashA()>=ceza)spend(ceza);else{const rest=ceza-S.money;S.money=0;icra(rest)}
        if(T>=1000000&&ch(.4))arrest('Vergi kaçakçılığı',[1,3]);}
      else{S.taxLast=0;add('happy',3);log('Vergiyi kaçırdın, kimse fark etmedi. Şimdilik.','dim')}}}
  ]})
}

  h+='<div class="sec">Gelir vergisi dilimleri</div><div class="sum">'+BRACKETS.map(([l,r],i)=>`<div><span>${i?fmt(BRACKETS[i-1][0])+' – ':'0 – '}${l===Infinity?'üzeri':fmt(l)}</span><b>%${Math.round(r*100)}</b></div>`).join('')+'</div>';
  return['Vergi dairesi',h]};

function orgPow(){if(!S.org)return 0;let p=0;S.org.members.forEach(m=>{if(!m.jail&&!m.hurt)p+=m.str*(.5+m.loy/200)*3});return Math.round(p+S.respect*.4+karizma()*.5+(has('tetikci')?8:0)+(has('koruma')?4:0)+S.rivals.filter(r=>r.ally&&!r.dead).reduce((x,r)=>x+r.pow*.2,0)+(S.st?sqPow()*.3:0)+(S.props&&S.props.includes('spor')?6:0))}

function battleP(their,bonus=0){return clamp(.5+(orgPow()-their)/100+bonus,.08,.92)}

  if(F.debt)h+=`<div class="sec">⚠️ Aileye borcun var</div>`+row('data-x="fjpay:"','🗡',`${fmt(F.debt)} cebe attın`,`Ödemezsen suikastçı gelir · ${Math.max(0,F.due-now)} çeyrek kaldı`,fmtS(Math.round(F.debt*1.2)),!canPayB(Math.round(F.debt*1.2)));
  if(S.boss)h+='<div class="sec">Aile senin</div><p class="note">Bu ailenin Babası sensin. Kimse sana emir veremez; işlerden gelen paranın yarısı senin, yarısı ailenin kasasına, ailenin kasası ve adamları emrinde.</p>';
  else h+='<div class="sec">Babanın isteği</div>';
  if(S.boss){}else if(F.req){const q=F.req;h+=q.k==='para'?row('data-x="fjreq:"','🌹',fjReqText(q),`Süre: ${Math.max(0,q.due-now)} çeyrek`,fmtS(q.n),!canPay(q.n)):row('data-x="nop:"','🌹',fjReqText(q),`Süre: ${Math.max(0,q.due-now)} çeyrek · Aşağıdaki işlerden yap`,'',true)}
  else h+='<p class="note">Şu an Baba\'nın senden özel bir isteği yok. Aile işlerine devam et.</p>';
  h+=`<div class="sec">Aile işleri</div><p class="note">Ailenin adına iş çevir. Para önce Baba'ya gider, payını o verir. Parayı teslim etmezsen peşine suikastçı takılır.${!S.premium&&fjLeft()<=0?' <b>Bu çeyrek aile için yeterince iş çevirdin.</b>':''}</p>`;
  FJOBS.forEach(j=>{const lock=j[3]>rk;h+=row(`data-x="fjob:${j[0]}"`,j[1],j[2],lock?`${RANKS[j[3]].n} rütbesinde açılır`:`Aileye ~${fmtS(fjEst(j))} · Payın ~${fmtS(fjEst(j)*fjCut())} · Risk %${Math.round(fjRisk(j)*100)}`,'',lock||!!S.jail||(!S.premium&&fjLeft()<=0))});
  h+=`<div class="sec">Ailenin verdiği sokak ekipleri</div>`+row('data-go="sokak"','🔫',F.sqs&&F.sqs.length?`${F.sqs.length} ekip · ${famSq()} adam`:'Henüz ekip verilmedi',F.sqs&&F.sqs.length?`Maaşları ailede · Kendi ekibin ${(S.st&&S.st.my&&S.st.my.sq)||0}/${MYSQ} adam`:'Tetikçi rütbesinde aile sana ilk sokak ekibini verir','›',false);
  h+='<div class="sec">Emrindeki adamlar</div>';
  if(!F.crew.length)h+=`<p class="note">Kaptan rütbesine çıkınca ailenin alt rütbeli adamları emrine verilir. Onlara iş dağıtıp aileye para getirtirsin, komisyonun sana kalır.</p>`;
  else{h+=row('data-x="fjall:"','📣','Hepsine iş dağıt',`Boştaki herkes gücüne göre bir işe çıkar · Komisyonun %${Math.round(fjCom()*100)}`,'',!F.crew.some(m=>!m.task&&m.jail<=now&&m.hurt<=now));
    F.crew.forEach(m=>{const st=m.jail>now?`🔒 Cezaevinde (${m.jail-now} çeyrek)`:m.hurt>now?'🩹 Yaralı':m.task?`Görevde: ${FJ(m.task)[2]}`:'Emrini bekliyor';h+=row(`data-x="fjm:${m.id}"`,'🕶',m.name,`${rk>=4?'Tetikçi':'Ayakçı'} · Güç ${m.str}/10 · ${st}`,m.task||m.jail>now||m.hurt>now?'':'Emir ver',!!(m.task||m.jail>now||m.hurt>now))})}
  h+='<div class="sec">Kendi yolun</div>'+(S.boss?'':row('data-x="fjleave:"','🚪','Aileden ayrıl','Babadan helallik al ya da sessizce çek git · Peşine adam takılabilir','',!!S.jail))+row('data-x="found:"','👑','Kendi aileni kur',S.age<18?'18 yaşından itibaren':`Aileden ayrılırsın · Kuruluş ${fmt(M(100000))}`,'',S.age<18||!!S.jail);
  return[S.family,h]}

  if(!S.org){let h=`<p class="note">Kendi aileni kur: abilerin, kuzenlerin ve sokaktan topladığın adamlarla bir örgüt oluştur. Onlara görev ver, düşman çetelerin mekânlarına çök, bölgeni büyüt.</p><div class="sec">Akrabaların</div>`;
    S.rels.filter(r=>!r.dead).forEach(r=>h+=row('data-x="nop:"','🧔',r.name,`${r.kin} · Güç ${r.str}/10`,'',true));
    h+=row('data-f="1"','🌹','Bir aileye katıl',S.snitch?'İspiyoncu geçmişin kapıları kapatabilir':'Ailenin adına iş çevir, rütbe atla · En az 10 saygı',S.age<16||!!S.jail);
    h+=row('data-x="found:"','👑','Kendi aileni kur',S.age<18?'18 yaşından itibaren':(S.respect<20&&!S.premium)?`En az 20 saygı gerekir (şu an ${S.respect})`:`Kuruluş ${fmt(M(100000))}`,'',S.age<18||(S.respect<20&&!S.premium)||!!S.jail);

  h+=row('data-x="allout:"','🚀','Tüm ekibi sahaya sür','Boştaki herkes gücüne göre bir göreve çıkar','',!avail().filter(m=>m.busy!==QS()).length);
  h+=row('data-x="bonusall:"','💰','Herkese prim ver',`Bütün üyelerin sadakati +15`,fmtS(o.members.reduce((x,m)=>x+m.str*5000,0)),!o.members.length||!canPay(o.members.reduce((x,m)=>x+m.str*5000,0)));
  {const st=stEnsure(),c=fullCost();
   if(S.premium)h+=row('data-x="sqfull:dayi|org"','👑','Dayı modu: aileyi fulle','Üyelerin gücü 10/10, sokak ekipleri tam kadro, silahlar %100, sadakat %100 · Ücretsiz','',false);
   h+=row('data-x="sqfull:|org"','⚡','Bütün ekipleri doldur ve silahlandır',c?'Tek tuşla tam kadro + silah %100':'Kadron zaten tam',c?fmtS(c):'',!c||!canPayB(c));
   h+=row('data-go="sokak"','🔫','Sokak kadrosu ve haraç',`${totSq()} adam · ${st.shops.filter(x=>x.st==='odeyor'&&shopT(x).il).length} işletme haraç veriyor${st.gw?' · ⚔️ '+st.gw.name:''}`,'›',false)}
  h+=row('data-go="rakip"','⚔️','Düşman çeteler','Savaş, mekân baskını, saldırı','›',false);
  h+=`<div class="sec">Üyeler (${o.members.length}/10)</div>`;
  if(!o.members.length)h+='<p class="note">Henüz kimse yok. Aşağıdan akrabalarını ve sokaktan adam ekle.</p>';
  o.members.forEach(m=>{const st=m.jail?'🔒 Cezaevinde':m.hurt?'🩹 Yaralı':m.busy===QS()?'Görevde':'Hazır';h+=`<button class="row" data-x="mem:${m.id}"><span class="ic"${mPic(m)?' style="padding:0;overflow:hidden"':''}>${npcImg(mPic(m))||(m.kin?'🧔':'🕶')}</span><span class="tx"><b>${m.name}</b><span>${m.kin?m.kin+' · ':''}Güç ${m.str} · ${m.sq||0} adam · Silah %${m.ar||0} · ${st}</span><div class="bar" style="margin-top:5px"><i style="width:${m.loy}%;background:${m.loy>=60?'var(--good)':m.loy>=30?'var(--warn)':'var(--blood)'}"></i></div></span><span class="rt">›</span></button>`});
  if(o.turf.length){h+='<div class="sec">Bölgen</div>';o.turf.forEach(v=>h+=row('data-x="nop:"','🏚',v.n,`Yıllık ${fmtS(v.inc)}${v.from?' · '+RV(v.from).n+'\'den alındı':''}`,'',true))}
  h+='<div class="sec">Eleman ekle</div>';
  S.rels.filter(r=>!r.joined&&!r.dead).forEach(r=>h+=row(`data-x="recrel:${r.id}"`,'🧔',r.name,`${r.kin} · Güç ${r.str}/10 · Kan bağı, sadakat yüksek`,'Davet et',o.members.length>=10));
  S.friends.filter(f=>f.job==='sokak'&&!f.inOrg).forEach(f=>h+=row(`data-x="recfr:${f.id}"`,'🧢',f.name,`Sokak dostun · Yakınlık %${f.rel}`,'Teklif et',o.members.length>=10||f.rel<40));
  h+=row('data-x="recst:"','🎲','Sokaktan adam topla','Üç aday arasından seç',fmtS(M(20000)),o.members.length>=10||!canPay(M(20000)));
  return['Kendi ailen',h]};
EXTRA.rakip=()=>{let h=`<p class="note">${S.org?`Senin gücün: <b style="color:var(--gold)">${orgPow()}</b>. Güç; adamlarının sayısına, gücüne, sadakatine, saygına ve karizmana bağlıdır.`:'Kendi aileni kurmadan da onlarla kavga edebilirsin; mekân basmak için önce aileni kurmalısın.'}</p>`;
  S.rivals.forEach(r=>{const cmp=S.org?orgPow()-r.pow:0;h+=`<button class="row" data-x="riv:${r.id}"><span class="ic">${r.war?'⚔️':'🐍'}</span><span class="tx"><b>${r.n}</b><span>${r.dead?'Dağıldı':r.boss.name} · Güç ${r.pow} · ${r.venues.length} mekân${r.ally?' · <b style="color:var(--good)">Müttefik</b>':''}${r.war?' · <b style="color:var(--blood)">Savaşta</b>':''}</span>${S.org?`<span class="risk ${cmp>10?'r1':cmp>-10?'r2':'r3'}">${cmp>10?'Senden zayıf':cmp>-10?'Denk':'Senden güçlü'}</span>`:''}</span><span class="rt">›</span></button>`});
  return['Düşman çeteler',h]};

/* ============ Gazete ============ */
const PAPERS=['Sabah Postası','Akşam Haber','Boğaz Gazetesi','Manşet','İstanbul Ekspres'];
function news(t,w=1){if(!S.newsQ||w>S.newsQ.w)S.newsQ={t,w}}
function publishNews(){
  const y=(S.birthYear||1996)+S.age;
  if(S.newsQ){const p=pick(PAPERS);S.papers.push({y,q:S.q||0,p,t:S.newsQ.t,me:1});log(`📰 ${p}: "${S.newsQ.t}"`,'news');S.fame=clamp((S.fame||0)+S.newsQ.w*3);if(S.newsQ.w>=3)add('heat',3)}
  else if(ch(.18)&&S.rivals){const r=pick(S.rivals);const t=pick([`${r.n} yeni bir mekân açtı`,`Polis ${r.n} üyelerine operasyon düzenledi`,`Boğaz'da lüks yat partisi: yeraltı dünyası bir aradaydı`,`Belediye ihalesinde şaibe iddiası`,`Liman'da konteyner dolusu kaçak mal ele geçirildi`]);S.papers.push({y,q:S.q||0,p:pick(PAPERS),t});}
  if(S.papers.length>60)S.papers=S.papers.slice(-60);
  S.newsQ=null;S.fame=clamp((S.fame||0)-.5);
}
EXTRA.luks=()=>{let h='<p class="note">Lüks oyuncaklar karizma verir ama bakım masrafları yıllık giderlerine eklenir.</p>';
  LUX.forEach(l=>{const own=hasL(l.id);h+=row(own?`data-x="luxs:${l.id}"`:`data-x="luxb:${l.id}"`,lIco(l),l.n,`${l.d} · Karizma +${l.k} · Bakım ${fmtS(l.up)}/yıl`,own?`Sat ${fmtS(l.p*.6)}`:fmtS(l.p),!own&&!canPay(l.p))});
  return['Lüks oyuncaklar',h]};
EXTRA.gazete=()=>{let h=`<p class="note">Ünün: <b style="color:var(--gold)">%${Math.round(S.fame||0)}</b>. Manşetlere çıktıkça ünün ve karizman artar, ama polis de okur.</p>`;
  const ps=[...S.papers].reverse();if(!ps.length)h+='<p class="note">Henüz gazetelerde adın geçmedi.</p>';
  ps.forEach(n=>h+=`<div class="clip ${n.me?'me':''}"><small>${n.p} · ${n.y} ${SEASONS[n.q]}</small><b>${n.t}</b></div>`);
  return['Gazete',h]};

const DEPTS=[
  {id:'hukuk',n:'Hukuk fakültesi',q:16,fee:60000,job:'avukat',jn:'Avukat',sal:380000,d:'Mezun olursan mahkemede beraat şansın +%20'},

function eduQuarter(){
  if(S.edu&&!S.jail){const d=DEPTS.find(x=>x.id===S.edu.d);S.edu.left--;
    if(S.edu.left<=0){S.grads=[...(S.grads||[]),d.id];log(`${d.n} bitti! Artık diplomalı bir ${d.jn.toLowerCase()}sın... en azından kâğıt üstünde.`,'gold');news(`Yeraltının adamı ${d.n} mezunu oldu`,1);S.edu=null}}
  if(S.lise&&!S.jail){S.lise--;if(S.lise<=0){S.lise=0;S.school=true;log('Açık liseyi bitirdin. Diploman elinde.','good')}}
  if(S.job){if(S.jail){log(`Hapse girdiğin için ${S.job.n} işinden atıldın.`,'bad');S.job=null}
    else{try{svcQuarter()}catch(e){console.error(e)}if(!S.job)return;const sal=Math.round(S.job.sal*.25*(1+Math.min(.5,(S.job.q||0)*.01)));S.job.q=(S.job.q||0)+1;S.money+=sal;S.taxInc=(S.taxInc||0)+sal;log(`${S.job.n} maaşı: ${fmt(sal)}.`,'good');if(S.job.id==='doktor')add('health',1)}}
}

function betModal(title,fn){const opts=[1000,10000,100000,1000000,10000000].filter(a=>a<=S.money);
  if(!opts.length){toast('Masaya oturacak paran yok.');return}closeSheet();
  queue({back:'kumar',title,text:`Ne kadar oynuyorsun? Kasa: ${fmt(S.money)}`,choices:[...opts.map(a=>({t:fmt(a),fn:()=>setTimeout(()=>fn(a),30)})),{t:'Vazgeç',fn:()=>{}}]})}
function gwin(a,mult,t){const w=Math.round(a*mult);S.money+=w-a;S.stats.wins++;if(w-a>=1e6){S.stats.bigwin++;news(`Kumarhanede ${fmt(w-a)}'lik vurgun!`,2)}add('happy',4);log(`${t} ${fmt(w-a)} kazandın.`,'good');toast('+'+fmt(w-a))}
function glose(a,t){spend(a);add('happy',-3);log(`${t} ${fmt(a)} kaybettin.`,'bad');toast('−'+fmt(a))}
ACT.rulet=()=>betModal('Rulet',a=>{const n=R(0,36);const red=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(n);const col=n===0?'yeşil':red?'kırmızı':'siyah';
  queue({back:'kumar',title:'Rulet',text:`${fmt(a)} ortada. Neye oynuyorsun?`,prem:{t:'Krupiye dayının adamı',sub:'Kazanç ×2',fn:()=>gwin(a,2,'Top senin rengine düştü, ne tesadüf.')},choices:[

    {t:'Siyah',sub:'×2',fn:()=>col==='siyah'?gwin(a,2,`Top ${n} siyahta durdu!`):glose(a,`Top ${n} ${col}da durdu.`)},
    {t:'Sıfır',sub:'×36',fn:()=>n===0?gwin(a,36,'SIFIR! Masa çıldırdı.'):glose(a,`Top ${n} ${col}da durdu.`)}]})});
ACT.zar=()=>betModal('Barbut',a=>{const d1=R(1,6),d2=R(1,6),s=d1+d2;
  queue({back:'kumar',title:'Barbut',text:`Zarlar avucunda. 7 kasanındır.`,choices:[
    {t:'Yüksek (8–12)',sub:'×2',fn:()=>s>7?gwin(a,2,`Zarlar ${d1}-${d2} geldi.`):glose(a,`Zarlar ${d1}-${d2} geldi.`)},
    {t:'Düşük (2–6)',sub:'×2',fn:()=>s<7?gwin(a,2,`Zarlar ${d1}-${d2} geldi.`):glose(a,`Zarlar ${d1}-${d2} geldi.`)},
    {t:'Tam 7',sub:'×5',fn:()=>s===7?gwin(a,5,'Yedi! Kasayı patlattın.'):glose(a,`Zarlar ${d1}-${d2} geldi.`)}]})});
ACT.at=()=>betModal('At yarışı',a=>{const H=[['Rüzgâr',2],['Kara Şimşek',3],['Bozkurt',4],['Yıldız',6],['Topal Ali',10],['Son Şans',20]];
  const w=H.map(h=>.92/h[1]);const tot=w.reduce((x,y)=>x+y,0);let r=Math.random()*tot,win=0;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0){win=i;break}}
  queue({back:'kumar',title:'Veliefendi',text:'Atlar startta. Hangisine oynuyorsun?',choices:H.map((h,i)=>({t:h[0],sub:`Oran ${h[1]}x`,fn:()=>i===win?gwin(a,h[1],`${h[0]} birinci geldi!`):glose(a,`Yarışı ${H[win][0]} kazandı.`)}))})});
const CARD=()=>R(1,13);const cv=c=>c>=10?10:c===1?11:c;const cn=c=>({1:'A',11:'J',12:'Q',13:'K'}[c]||c);
function bjTotal(h){let t=h.reduce((s,c)=>s+cv(c),0),a=h.filter(c=>c===1).length;while(t>21&&a--)t-=10;return t}
ACT.bj=()=>betModal('Blackjack',a=>{const P=[CARD(),CARD()],D=[CARD(),CARD()];bjStep(a,P,D)});
function bjStep(a,P,D){const pt=bjTotal(P);
  if(pt===21&&P.length===2){gwin(a,2.5,'Blackjack!');return done()}
  if(pt>21){glose(a,`Elin ${P.map(cn).join(' ')} (${pt}), battın.`);return done()}
  queue({back:'kumar',title:'Blackjack',text:`Senin elin: <b>${P.map(cn).join(' ')}</b> (${pt}) · Krupiye: <b>${cn(D[0])} ?</b>`,choices:[
    {t:'Kart çek',fn:()=>{P.push(CARD());setTimeout(()=>bjStep(a,P,D),30)}},
    {t:'Dur',fn:()=>{while(bjTotal(D)<17)D.push(CARD());const dt=bjTotal(D);const txt=`Krupiye: ${D.map(cn).join(' ')} (${dt}).`;
      if(dt>21||pt>dt)gwin(a,2,txt);else if(pt===dt){log(txt+' Berabere, paran iade.','dim')}else glose(a,txt)}}]})}
EXTRA.kumar=()=>{if(!GAMBLE)return['Kapalı','<p class="note">Bu bölüm şu an kapalı.</p>'];let h=`<p class="note">Kasa: <b style="color:var(--good)">${fmt(S.money)}</b> · Galibiyet: ${S.stats.wins}. Ev her zaman kazanır... çoğu zaman.</p>`;
  h+=row('data-x="rulet:"','🎡','Rulet','Kırmızı, siyah ya da sıfır','',false)+row('data-x="bj:"','🃏','Blackjack','21\'e en yakın olan kazanır','',false)+row('data-x="zar:"','🎲','Barbut','Yüksek mi düşük mü?','',false)+row('data-x="at:"','🐎','At yarışı','Altı at, altı oran','',false);
  return['Kaçak kumarhane',h]};

function otoDone(o,price,quick){const p=price-(o.buy||price)-(o.inv||0);S.oto=S.oto||{xp:0,n:0,prof:0};S.oto.n++;S.oto.prof+=p;const lv0=otoLv();if(p>0&&!quick)S.oto.xp++;if(otoLv()>lv0)log(`🚗 Alım satım seviyen ${otoLv()} oldu. Piyasa tahminlerin daha isabetli.`,'gold');if(S.oto.xp===8&&p>0&&!quick&&!S.gal)log('🏪 Artık galerici olacak kadar tecrübelisin. Mahalle galerisini yarı fiyatına açabilirsin.','gold');return p}

    {t:'Barışı kabul et',sub:`Tazminat ${fmt(c)}`,dis:!canPay(c),fn:()=>{pay(c);r.war=false;log(`${r.n} ile barış imzalandı.`,'good')}},

    {t:'Kafa tut',sub:'Savaş başlar · Saygı +',fn:()=>{r.war=true;gainResp(5);log(`${b.name}'e "gel de al" dedin. Savaş başladı.`,'bad')}}]})}

    {t:'İttifakı kabul et',sub:'Gücüne güç katar, birbirinize saldırmazsınız',fn:()=>{r.ally=true;gainResp(3);log(`${r.n} ile ittifak kurdun.`,'good');news(`${S.org?S.org.name:S.last} ve ${r.n} el sıkıştı`,2)}},

  log(pick([`${b.name} (${r.n}) senin hakkında atıp tutuyormuş.`,`${b.name} bir düğünde sana selam vermedi.`,`${r.n} lideri ${b.name} yeni bir mekân açtı.`]),'dim');

/* ============ Sosyal medya ============ */
const fmtF=n=>n>=1e6?(n/1e6).toLocaleString('tr-TR',{maximumFractionDigits:1})+' Mn':n>=1e3?(n/1e3).toLocaleString('tr-TR',{maximumFractionDigits:1})+' B':String(n);
function smGain(mult){const sm=S.sm;const luxS=(S.lux||[]).length*2+(curCar()?CM(curCar().mid).k:0);const base=(karizma()*60+(S.fame||0)*250+luxS*300+sm.f*.02)*mult*(sm.ver?1.3:1);const dim=Math.pow(.6,sm.pq===QS()?sm.pc:0);const g=Math.round(base*dim*R(60,140)/100);if(sm.pq!==QS()){sm.pq=QS();sm.pc=0}sm.pc++;sm.f+=g;return g}
ACT.post=k=>{const sm=S.sm;let g;
  if(k==='normal'){g=smGain(1);log(`Bir paylaşım yaptın: +${fmtF(g)} takipçi.`,'good')}
  if(k==='luks'){g=smGain(2.2);add('heat',4);log(`Lüks hayatını paylaştın: +${fmtF(g)} takipçi. Mali Şube de beğendi.`,'good')}
  if(k==='canli'){g=smGain(1.4);add('happy',4);log(`Canlı yayın açtın: +${fmtF(g)} takipçi.`,'good')}
  if(sm.f>=1e6&&!sm.m1){sm.m1=1;S.fame=clamp((S.fame||0)+10);news(`${S.first} ${S.last} 1 milyon takipçiye ulaştı`,1)}
  done()};
ACT.tik=()=>{if(!pay(M(20000)))return;S.sm.ver=true;log('Hesabın onaylandı. Mavi tik artık senin.','good');done()};
ACT.reklam=()=>{const sm=S.sm;if(sm.aq===QS())return;sm.aq=QS();const m=Math.round(sm.f*R(50,200)/100);S.money+=m;S.taxInc=(S.taxInc||0)+m;log(`${pick(['Bir saat markası','Bir enerji içeceği','Bir otomobil bayisi','Bir parfüm','Bir bahis sitesi'])} ile reklam anlaşması: ${fmt(m)}.`,'gold');done()};
function smQuarter(){const sm=S.sm;if(sm.f>0){sm.f=Math.round(sm.f*.985);S.fame=clamp(Math.max(S.fame||0,Math.log10(Math.max(1,sm.f))*6-12))}}
EXTRA.sosyal=()=>{const sm=S.sm;let h=`<div class="sum"><div><span>Takipçi</span><b style="color:var(--gold)">${fmtF(sm.f)}${sm.ver?' ✔️':''}</b></div><div><span>Ün</span><b>%${Math.round(S.fame||0)}</b></div></div>`;
  h+='<p class="note">Karizman, ünün, araban ve lüks oyuncakların takipçi kazandırır. Aynı çeyrekte peş peşe paylaşım yaptıkça etkisi azalır.</p>';
  h+=row('data-x="post:normal"','📷','Paylaşım yap','Takipçi +','',false)+row('data-x="post:canli"','🔴','Canlı yayın aç','Takipçi + · Mutluluk +','',false)+row('data-x="post:luks"','💸','Lüks hayatını paylaş','Takipçi ++ · Dikkat +','',false);
  h+=row('data-x="tik:"','✔️','Mavi tik al','Takipçi kazancı %30 artar',sm.ver?'✓':fmtS(M(20000)),sm.ver||sm.f<100000||!canPay(M(20000)));

  return['Sosyal medya',h]};

const oc=k=>S&&S.origin===k;

/* ============ Enflasyon ve döviz ============ */
const CPI_LISTS=()=>[[CAT,['p']],[JEWELS,['p']],[PROPS,['p','inc']],[LUX,['p','up']],[SHOP,['p']],[STAFF,['sal']],[RANKS,['sal']],[CRIMES,['m']],[WARD.outfit,['p']],[WARD.acc,['p']],[LEAGUES,['price','rev','prize']],[PROJ,['cost','up']],[OMIS,['m']],[DEST,['trip']],[DEPTS,['fee','sal']]];
function applyCPI(){const c=(S&&S.cpi)||1;
  CPI_LISTS().forEach(([arr,fs])=>arr.forEach(it=>{if(!it._b){it._b={};fs.forEach(f=>it._b[f]=Array.isArray(it[f])?[...it[f]]:it[f])}
    fs.forEach(f=>{const b=it._b[f];if(b===undefined)return;if(Array.isArray(b))it[f]=b.map(v=>Math.round(v*c));else if(typeof b==='number'&&b>0)it[f]=Math.round(b*c)})}));
  DEST.forEach(d=>{if(d.op._c===undefined)d.op._c=d.op.c;d.op.c=Math.round(d.op._c*c)});
  BRACKETS.forEach((b,i)=>{if(b._l===undefined)b._l=b[0];if(b._l!==Infinity)b[0]=Math.round(b._l*c)})}
const depRate=()=>Math.max(.05,(S.infl||.3)-.03),loanRate=()=>Math.max(.04,(S.infl||.3)+.12-vipLoan());
const VIPT=[[0,'',0,0],[1e7,'Özel Bankacılık',.02,.04],[1e8,'Private Banking',.04,.08]];
function bkPort(id){if(!S||!S.bank)return 0;return (id==='bogaz'?(S.bank.dep||0):((S.bdep||{})[id]||0))+(S.accts||[]).filter(a=>a.bank===id).reduce((t,a)=>t+a.amt,0)+(id==='zurih'?(S.offK||0):0)}
function bkVip(id){const p=bkPort(id);return p>=M(VIPT[2][0])?2:p>=M(VIPT[1][0])?1:0}
const vipDep=id=>VIPT[bkVip(id)][2],vipLoan=()=>VIPT[bkVip('bogaz')][3];
const vzBase=()=>Math.max(.03,depRate()*.35),vzRate=()=>vzBase()+vipDep('bogaz');
function vipCheck(){S.vip=S.vip||{};BANKS.forEach(bk=>{const t=bkVip(bk.id),o=S.vip[bk.id]||0;if(t===o)return;S.vip[bk.id]=t;if(t>o){const md=pick(NAMES)+' '+pick(SURN);queue({title:`🏦 ${bk.n} şube müdürü arıyor`,text:`${md}: "${S.first} ${S.gender==='k'?'Hanım':'Bey'}, bankamızdaki portföyünüz ${fmt(bkPort(bk.id))} oldu. Sizi <b>${VIPT[t][1]}</b> müşterimiz yaptık. Bundan sonra mevduatınıza <b>+${Math.round(VIPT[t][2]*100)} puan</b> özel faiz${bk.id==='bogaz'?`, kredilerinizde <b>−${Math.round(VIPT[t][3]*100)} puan</b> indirim`:''} uygulanacak. Özel temsilciniz her zaman emrinizde."`,choices:[{t:'Teşekkür et',fn:()=>{add('happy',3);log(`🏦 ${bk.n}: ${VIPT[t][1]} müşterisi oldun.`,'gold')}}]})}else log(`🏦 ${bk.n}: portföyün düştü, ${o===2&&t===1?'Özel Bankacılık seviyesine indin':'özel faiz ayrıcalığın sona erdi'}.`,'dim')})}
ACT.offk=k=>{closeSheet();const cut=S.premium?.06:.12;
  if(k==='in')return amountModal('Kayman · kara para yatır','Kara para kasandaki para aklanmadan, olduğu gibi offshore hesaba girer. Maliye görmez, icra dokunamaz, faiz işler. Harcamak için önce aklamaya göndermen gerekir.',S.black||0,a=>{S.black-=a;S.offK=(S.offK||0)+a;add('heat',-Math.min(8,Math.round(a/M(5e6))));log(`🏝 Kayman hesabına ${fmt(a)} kara para yatırdın.`,'dim')},'bk_zurih');
  amountModal('Kayman · aklamaya gönder',`Para paravan şirketler üzerinden aklanır, %${Math.round(cut*100)} masraf kesilir ve bir sonraki çeyrek Boğaz Bankası vadesiz hesabına temiz olarak yatar.${S.premium?' 👑 Dayı indirimi uygulandı.':''}`,S.offK||0,a=>{S.offK-=a;const net=Math.round(a*(1-cut));S.offPend=S.offPend||[];S.offPend.push({q:QS()+1,amt:net});log(`🏝 ${fmt(a)} aklamaya gönderildi. Gelecek çeyrek Boğaz Bankası'na ${fmt(net)} yatacak.`,'dim')},'bk_zurih')};
function offQ(f){if(S.offK>0)S.offK+=Math.round(S.offK*bdRate(BK('zurih'))*f);if(S.offPend&&S.offPend.length){const now=QS();S.offPend=S.offPend.filter(p=>{if(p.q>now)return true;S.bank.dep+=p.amt;log(`🏦 Aklanan ${fmt(p.amt)} Boğaz Bankası vadesiz hesabına yattı.`,'good');return false})}}
const PHASES={yuksek:{n:'Yüksek enflasyon dönemi',t:.11},program:{n:'Dezenflasyon programı',t:.025},normal:{n:'İstikrar dönemi',t:.04}};
function econYear(){const prev=S.infl;const E=S.econ;E.left--;
  if(E.left<=0){
    if(E.ph==='yuksek'){E.ph='program';E.left=R(3,4);log('🏦 Merkez Bankası yeni ekonomi programını açıkladı: sıkı para politikası, faizler zirvede. Enflasyonun düşmesi bekleniyor.','gold');news('Yeni ekonomi programı: hedef tek haneli enflasyon',2)}
    else if(E.ph==='program'){E.ph='normal';E.left=R(4,6);log('📉 Program başarılı oldu, enflasyon tek haneye indi. Ekonomi istikrar dönemine girdi.','good');news('Enflasyon tek haneye indi',2)}
    else{E.ph='yuksek';E.left=R(3,5);log('⚠️ Seçim ekonomisi, gevşek para politikası... Enflasyon yeniden tırmanmaya başladı.','bad');news('Fiyatlar yeniden uçuyor',1)}}
  const tg=PHASES[E.ph].t;
  let inf=E.ph==='program'?Math.max(.025,S.infl*(R(45,65)/100)):clamp(S.infl+(tg-S.infl)*.5+R(-2,2)/100,.015,.18);
  if(E.ph!=='program'&&ch(E.ph==='yuksek'?.03:.005)){inf=clamp(inf+.05,.02,.2);S.fx.usd=+(S.fx.usd*1.15).toFixed(2);S.fx.eur=+(S.fx.eur*1.15).toFixed(2);log('💥 Kur krizi! Dolar bir gecede %15 fırladı.','bad');news('Kur krizi: dolar rekor kırdı',2)}
  S.infl=+inf.toFixed(3);S.cpi=+(S.cpi*(1+S.infl)).toFixed(4);applyCPI();
  S.cars.forEach(o=>o.val=Math.round(o.val*(1+S.infl)));S.jewels.forEach(j=>j.val=Math.round(j.val*(1+S.infl)));
  if(S.org)S.org.turf.forEach(v=>v.inc=Math.round(v.inc*(1+S.infl)));S.rivals.forEach(r=>r.venues.forEach(v=>v.inc=Math.round(v.inc*(1+S.infl))));
  S.staff.forEach(()=>{});S.houses.forEach(o=>{if(o.ten)o.ten.rent=Math.round(o.ten.rent*(1+S.infl*.8))});
  log(`📈 Yıllık enflasyon %${Math.round(S.infl*100)} oldu${prev?` (geçen yıl %${Math.round(prev*100)})`:''}. Fiyatlar, maaşlar ve kiralar güncellendi.`,'dim')}
function fxQuarter(){const d=(S.infl||.3)/4;['usd','eur'].forEach(k=>{S.fx[k]=+(S.fx[k]*(1+d*R(70,120)/100+R(-3,3)/100)).toFixed(2);S.fxh[k].push(S.fx[k]);if(S.fxh[k].length>16)S.fxh[k].shift()})}
const fxVal=()=>Math.round((S.fxw.usd||0)*S.fx.usd+(S.fxw.eur||0)*S.fx.eur);
ACT.fx=k=>{const [op,cur]=k.split('-');closeSheet();const r=S.fx[cur],sym=cur==='usd'?'$':'€';
  if(op==='buy'){const opts=[1e4,1e5,1e6,1e7,1e8].filter(a=>a<=S.money);queue({back:'doviz',title:`${cur.toUpperCase()} al`,text:`Kur ${r.toLocaleString('tr-TR')} ₺. Alışta %1 makas.`,choices:[...opts.map(a=>({t:fmt(a),sub:`${sym}${Math.floor(a/(r*1.01)).toLocaleString('tr-TR')}`,fn:()=>{spend(a);S.fxw[cur]=(S.fxw[cur]||0)+Math.floor(a/(r*1.01));log(`${fmt(a)} ile ${sym}${Math.floor(a/(r*1.01)).toLocaleString('tr-TR')} aldın.`,'dim')}})),...(S.money>0?[{t:'Kasanın tamamı',sub:fmt(S.money),fn:()=>{const a=S.money;S.money=0;S.fxw[cur]=(S.fxw[cur]||0)+Math.floor(a/(r*1.01));log(`Kasadaki ${fmt(a)} ${cur.toUpperCase()}'ye çevrildi.`,'dim')}}]:[]),{t:'Vazgeç',fn:()=>{}}]})}
  else{const h=S.fxw[cur]||0;queue({back:'doviz',title:`${cur.toUpperCase()} sat`,text:`Elinde ${sym}${h.toLocaleString('tr-TR')} var. Satışta %1 makas.`,choices:[{t:'Yarısını sat',sub:fmt(Math.floor(h/2)*r*.99),fn:()=>{const x=Math.floor(h/2);S.fxw[cur]-=x;S.money+=Math.round(x*r*.99);log(`${sym}${x.toLocaleString('tr-TR')} bozdurdun.`,'dim')}},{t:'Hepsini sat',sub:fmt(h*r*.99),fn:()=>{S.fxw[cur]=0;S.money+=Math.round(h*r*.99);log(`Bütün ${cur.toUpperCase()}'ni bozdurdun.`,'dim')}},{t:'Vazgeç',fn:()=>{}}]})}};
EXTRA.doviz=()=>{let h=`<div class="sum"><div><span>Ekonomi</span><b>${PHASES[S.econ.ph].n}</b></div><div><span>Yıllık enflasyon</span><b style="color:${S.infl>.4?'var(--blood)':'var(--warn)'}">%${Math.round(S.infl*100)}</b></div><div><span>Oyun başından beri fiyatlar</span><b>×${S.cpi.toLocaleString('tr-TR',{maximumFractionDigits:2})}</b></div><div><span>Mevduat faizi</span><b>%${Math.round(depRate()*100)}</b></div><div><span>Kredi faizi</span><b>%${Math.round(loanRate()*100)}</b></div></div>`;
  h+='<p class="note">Ekonomi döngüsel: yüksek enflasyon yılları, ardından birkaç yıllık dezenflasyon programı ve istikrar dönemi gelir. Enflasyon her yıl paranın değerini eritir. Parayı dövizde, altında, hissede ya da gayrimenkulde tutmak korur. Kur her çeyrek oynar; ara sıra kriz çıkar.</p>';
  [['usd','Amerikan doları','$'],['eur','Euro','€']].forEach(([k,n,sym])=>{const hh=S.fxh[k],prev=hh.length>1?hh[hh.length-2]:S.fx[k],chg=(S.fx[k]/prev-1)*100;
    h+=`<div class="sec">${n}</div><div class="row" style="cursor:default"><span class="ic" style="font-size:22px">${sym}</span><span class="tx"><b>1 ${k.toUpperCase()} = ${S.fx[k].toLocaleString('tr-TR',{minimumFractionDigits:2})} ₺</b><span>Elinde ${sym}${(S.fxw[k]||0).toLocaleString('tr-TR')} · ${fmtS((S.fxw[k]||0)*S.fx[k])}</span></span>${spark(hh,chg>=0)}<span class="rt" style="color:${chg>=0?'var(--good)':'var(--blood)'}">${chg>=0?'▲':'▼'}%${Math.abs(chg).toFixed(1)}</span></div>`+row(`data-x="fx:buy-${k}"`,'⬇',`${k.toUpperCase()} al`,'Kasadan','',cashA()<1e4)+row(`data-x="fx:sell-${k}"`,'⬆',`${k.toUpperCase()} sat`,'Kasaya','',!(S.fxw[k]>0))});
  return['Döviz ve ekonomi',h]};

/* ============ Mafya konseyi ============ */
const councilOK=()=>!!(S.org||S.boss||rank()>=4);
function cMembers(){const out=[];
  FAMILIES.forEach((f,i)=>{if(S.family===f.n&&!S.boss)return;out.push({id:'f'+i,n:f.n,boss:'Baba '+f.b,pow:[95,88,80][i],ally:S.family===f.n,war:false})});
  S.rivals.filter(r=>!r.dead).forEach(r=>out.push({id:'r'+r.id,n:r.n,boss:r.boss.name,pow:r.pow,ally:!!r.ally,war:!!r.war}));
  return out}
const crel=id=>{S.council.rel[id]=S.council.rel[id]??R(-10,20);return S.council.rel[id]};
function myVote(){return S.org?orgPow():S.boss?90:60}
function vote(bonus=0){let yes=myVote(),no=0;const det=[];cMembers().forEach(m=>{const p=clamp(.45+crel(m.id)/200+(m.ally?.25:0)-(m.war?.35:0)+bonus,.05,.95);const y=ch(p);if(y)yes+=m.pow;else no+=m.pow;det.push(`${m.n}: ${y?'Evet':'Hayır'}`)});return{ok:yes>no,yes,no,det}}
function councilYear(){const C=S.council;if(!councilOK()||S.jail)return;
  if(C.chair){const t=Math.round(cMembers().reduce((s,m)=>s+m.pow,0)*20000*S.cpi);dirty(t);gainResp(3);log(`Konsey başkanı olarak ailelerden yıllık pay: ${fmt(t)}.`,'gold')}
  if(C.rules.includes('pay')&&!C.chair&&S.org){const p=Math.round(S.org.turf.reduce((s,v)=>s+v.inc,0)*.05);if(p){(fund(p),S.money=Math.max(0,S.money-p));log(`Konsey payı olarak ${fmt(p)} ödedin.`,'dim')}}
  const elect=!C.chairEnd||S.age>=C.chairEnd;
  const neutral=['Beşiktaş','Fatih','Üsküdar','Ataşehir','Beykoz'].filter(d=>!(S.org&&S.org.turf.some(v=>v.dist===d)));
  const items=[];if(elect)items.push('baskan');if(neutral.length&&S.org)items.push('bolge');if(!C.rules.includes('ateskes'))items.push('ateskes');if(!C.rules.includes('pay'))items.push('pay');if(!C.rules.includes('sessizlik'))items.push('sessizlik');
  if(!items.length)return;const a=pick(items);
  const lob=Math.round(2e6*S.cpi);
  const ask=(title,text,onYes,onNo)=>queue({back:null,title:`🏛 Mafya konseyi: ${title}`,text,prem:{t:'Dayının sözü geçer',sub:'Oylama senin lehine',fn:()=>{onYes();log('Dayın masaya bir baktı, eller kalktı.','gold')}},choices:[
    {t:'Oyla',sub:'Konsey üyelerinin tutumuna göre',fn:()=>{const v=vote();log(`Oylama: ${v.ok?'KABUL':'RED'} (güç ${v.yes} – ${v.no}).`,v.ok?'good':'bad');v.ok?onYes():onNo&&onNo()}},
    {t:'Önce lobi yap, sonra oyla',sub:`${fmt(lob)} · Şans +%20`,dis:!canPay(lob),fn:()=>{pay(lob);const v=vote(.2);log(`Lobi sonrası oylama: ${v.ok?'KABUL':'RED'} (güç ${v.yes} – ${v.no}).`,v.ok?'good':'bad');v.ok?onYes():onNo&&onNo()}},
    {t:'Masadan kalk',sub:'Saygı −',fn:()=>{add('respect',-4);cMembers().forEach(m=>S.council.rel[m.id]=crel(m.id)-5);log('Konseyi terk ettin. Babalar bunu unutmayacak.','bad')}}]});
  if(a==='baskan')ask('Başkanlık seçimi','Konsey 4 yıllığına yeni başkanını seçiyor. Adaylardan biri sensin. Başkan, ailelerden yıllık pay alır ve konseyi yönetir.',()=>{C.chair=true;C.chairEnd=S.age+4;gainResp(10);S.fame=clamp((S.fame||0)+8);log('Mafya konseyinin yeni başkanı sensin!','gold');news('Yeraltında yeni dönem: konsey başkanı belli oldu',3)},()=>{C.chair=false;C.chairEnd=S.age+4;log('Başkanlığı rakip babalardan biri kazandı.','dim')});
  else if(a==='bolge'){const d=pick(neutral);ask('Bölge paylaşımı',`Tarafsız ${d} bölgesi masada. Kabul edilirse ${S.org.name}'e geçecek.`,()=>{const inc=Math.round((150000+R(0,250000))*S.cpi);S.org.turf.push({id:'n'+d,n:`${d} bölgesi`,inc,dist:d});S.stats.venues++;gainResp(6);log(`${d} artık ${S.org.name}'in bölgesi. Yıllık ${fmt(inc)}.`,'gold')})}
  else if(a==='ateskes')ask('Genel ateşkes','Bütün aileler arasında ateşkes önerisi. Kabul edilirse tüm savaşlar biter; ateşkesi bozan konseyi karşısına alır.',()=>{C.rules.push('ateskes');S.rivals.forEach(r=>r.war=false);log('Genel ateşkes ilan edildi. Sokaklar sustu.','good')});
  else if(a==='pay')ask('Konsey payı','Her aile mekân gelirinin %5\'ini konsey başkanına ödesin önerisi.',()=>{C.rules.push('pay');log('Konsey payı kuralı kabul edildi.','dim')});
  else if(a==='sessizlik')ask('Sessizlik yemini','"Kimse polisle konuşmaz" yemini. Kabul edilirse polis dikkati her çeyrek biraz daha hızlı düşer.',()=>{C.rules.push('sessizlik');log('Sessizlik yemini kabul edildi.','good')});
}
ACT.clob=id=>{const c=Math.round(1e6*S.cpi);if(!pay(c))return;S.council.rel[id]=clamp(crel(id)+R(12,22),-100,100);log('Bir babaya hediye gönderdin; masadaki sözün güçlendi.','dim');done()};

  cMembers().forEach(m=>{const r=crel(m.id);h+=`<button class="row" data-x="clob:${m.id}"><span class="ic">${m.ally?'🤝':m.war?'⚔️':'🎩'}</span><span class="tx"><b>${m.boss}</b><span>${m.n} · Güç ${m.pow} · Tutum ${r>0?'+':''}${r}</span><div class="bar" style="margin-top:5px"><i style="width:${(r+100)/2}%;background:${r>=30?'var(--good)':r>=-10?'var(--warn)':'var(--blood)'}"></i></div></span><span class="rt">Hediye<br><small>${fmtS(1e6*S.cpi)}</small></span></button>`});
  if(C.chair){h+='<div class="sec">Başkan yetkisi</div>';S.rivals.filter(r=>!r.dead).forEach(r=>h+=row(`data-x="csanc:r${r.id}"`,'⚖️',`${r.n}'e yaptırım`,'Konseyin oyuna sun','',false))}
  return['Mafya konseyi',h]};

function dirty(m){m=Math.round(m||0);if(m<=0)return;S.black=(S.black||0)+m;if(!S.blackTip){S.blackTip=1;setTimeout(()=>queue({title:'🖤 Kara para',text:'Yasa dışı kazandığın her kuruş <b>kara para kasasına</b> girer, cüzdanına değil. Kara parayla alışveriş yapamazsın; sadece sokak masraflarını (adam maaşı, silah, rüşvet) ödeyebilirsin.<br><br>Harcamak için önce <b>aklaman</b> gerekir: sarraf, kuyumcu, Kıbrıs kumarhaneleri ya da işletmelerin üzerinden. Her aklamada komisyon ve küçük bir yakalanma riski var.',choices:[{t:'Kara para kasasına git',fn:()=>setTimeout(()=>openSheet('kara'),60)},{t:'Tamam',fn:()=>{}}]}),0)}}
function lqUse(k){S.lq=S.lq&&S.lq.q===QS()?S.lq:{q:QS(),u:{}};return S.lq.u[k]||0}
function bizCap(){return Math.round((propLaund()*1.2e6+S.props.length*4e5)*Math.max(1,S.cpi))}
const LMETH=[
  {id:'sarraf',ic:'💱',n:'Sarraf ve döviz bürosu',d:'Hızlı, komisyon yüksek',fee:.2,risk:.08,cap:()=>2e7},
  {id:'kuyum',ic:'💍',n:'Kuyumcudan altın al-sat',d:'Altına çevir, faturalı sat',fee:.12,risk:.06,cap:()=>1e7},
  {id:'kumar',ic:'🎰',n:'Kıbrıs kumarhanesi',d:'KKTC\'ye geç, fiş al, "kumar kazancı" belgesiyle dön',fee:.15,risk:.1,cap:()=>5e7},
  {id:'emlak',ic:'🏠',n:'Tapuda düşük bedel',d:'Ev al, gerçek fiyattan sat',fee:.1,risk:.07,cap:()=>3e7,need:()=>S.houses&&S.houses.length>0},
  {id:'off',ic:'🌍',n:'Offshore paravan şirket',d:'Yurt dışından "yatırım" olarak döner · 1 çeyrek sürer',fee:.25,risk:.03,cap:()=>5e8,slow:1}];
ACT.lmeth=id=>{const M=LMETH.find(x=>x.id===id);closeSheet();const cap=Math.round(M.cap()*Math.max(1,S.cpi));const left=Math.max(0,cap-lqUse(id));const opts=[1e4,5e4,2e5,1e6,5e6,2e7,1e8,5e8].map(a=>Math.round(a*Math.max(1,S.cpi)/1e3)*1e3).filter(a=>a<=S.black&&a<=left);if(S.black<=left&&S.black>0&&!opts.includes(S.black))opts.push(S.black);
  queue({back:'kara',title:`${M.ic} ${M.n}`,text:`${M.d}. Komisyon %${Math.round(M.fee*100)}, yakalanma riski %${Math.round(M.risk*100)}${S.heat>=60?' (polis dikkatin yüksek, risk 2 kat)':''}. Bu çeyrek kalan limit ${fmt(left)}.`,choices:[...opts.map(a=>({t:fmt(a),sub:`Temiz dönen ${fmt(Math.round(a*(1-M.fee)))}`,fn:()=>{S.black-=a;S.lq.u[id]=lqUse(id)+a;const rk=M.risk*(S.heat>=60?2:1);
      if(ch(rk)){const back=Math.round(a*.4);S.black+=back;add('heat',20);log(`🚨 Maliye ${M.n.toLowerCase()} işlemini yakaladı! ${fmt(a-back)} el konuldu.`,'bad');news('Maliye\'den kara para operasyonu',3)}
      else if(M.slow){later('offshore2',1,{m:Math.round(a*(1-M.fee))});log(`${fmt(a)} paravan şirkete gönderildi. Bir çeyrek sonra temiz dönecek.`,'dim')}
      else{const c=Math.round(a*(1-M.fee));S.money+=c;add('heat',-Math.min(10,Math.round(a/5e6)+1));log(`${fmt(a)} aklandı, cüzdanına ${fmt(c)} temiz para girdi.`,'good')}}})),{t:'Vazgeç',fn:()=>{}}]})};
LATER.offshore2=d=>({title:'Offshore transferi geldi',text:`Paravan şirketten "yabancı yatırım" olarak ${fmt(d.m)} hesabına geçti.`,choices:[{t:'Tamam',fn:()=>{S.money+=d.m;log(`${fmt(d.m)} temiz para olarak döndü.`,'good')}}]});
ACT.lpremium=()=>{if(!S.premium||!S.black)return;closeSheet();const a=S.black;queue({back:'kara',title:'👑 Dayının bankacısı',text:`Kasadaki ${fmt(a)} tek seferde, %5 komisyonla, risksiz aklanır.`,choices:[{t:'Hepsini akla',sub:`Temiz ${fmt(Math.round(a*.95))}`,fn:()=>{S.black=0;S.money+=Math.round(a*.95);log(`Dayının bankacısı ${fmt(a)} kara parayı akladı.`,'gold')}},{t:'Vazgeç',fn:()=>{}}]})};
function blackQuarter(){if(!S.black)return;
  const cap=bizCap();if(cap>0&&S.props.length){const a=Math.min(cap,S.black);S.black-=a;const c=Math.round(a*.9);S.money+=c;log(`🏪 İşletmelerin ${fmt(a)} kara parayı kasadan geçirip akladı (${fmt(c)} temiz).`,'good')}
  if(S.black>0&&S.heat>=55&&ch(.04+(S.heat-55)/250)){const f=Math.round(S.black*R(25,50)/100);S.black-=f;add('heat',8);log(`🚨 Polis bir depona baskın yaptı, kara kasadan ${fmt(f)} buldu ve el koydu!`,'bad');news('Bodrumda bulunan bavullar dolusu para',3)}}
EXTRA.kara=()=>{const b=S.black||0;let h=`<div class="card" style="padding:14px;margin-bottom:10px;text-align:center"><small style="color:var(--muted);letter-spacing:.12em">KARA PARA KASASI</small><div style="font-size:30px;font-weight:800;color:#d9d0c0;margin-top:4px">🖤 ${fmt(b)}</div><div class="note" style="margin:6px 0 0">Cüzdan (temiz) ${fmt(S.money)}</div></div>`;
  h+=`<p class="note">Yasa dışı yoldan kazandığın her kuruş (soygun, haraç, kaçakçılık, aile işleri, kumar) buraya düşer. Kara parayla alışveriş yapamazsın; önce aklaman gerekir. Polis dikkatin yüksekken kasa baskına uğrayabilir.</p>`;
  if(S.premium)h+=row('data-x="lpremium:"','👑','Dayının bankacısı','Hepsini %5 komisyonla, risksiz',b?fmtS(b*.95):'',!b);
  h+='<div class="sec">Hızlı aklama yolları</div>';
  LMETH.forEach(M=>{const cap=Math.round(M.cap()*Math.max(1,S.cpi));const left=Math.max(0,cap-lqUse(M.id));const ok=!M.need||M.need();h+=row(`data-x="lmeth:${M.id}"`,M.ic,M.n,ok?`Komisyon %${Math.round(M.fee*100)} · Risk %${Math.round(M.risk*100)} · Kalan limit ${fmtS(left)}`:'Önce bir ev sahibi olmalısın','',!ok||!b||!left||!!S.jail)});
  h+='<div class="sec">İşletmelerin</div>';
  h+=row('data-go="esnaf"','🏪','Otomatik aklama',S.props.length?`İşletmelerin her çeyrek ${fmtS(bizCap())} kara parayı %10 kayıpla aklar`:'İşletme alırsan her çeyrek otomatik aklar','›',false);
  h+='<div class="sec">Şirketlerin üzerinden</div><p class="note">Büyük meblağlar için şirketlerin daha ucuz ve güvenli. Para şirket kasasına girer, kâr olarak çekersin.</p>';
  [['kulup','⚽','Futbol kulübü',S.club,'Sahte sponsorluk · %10 kayıp'],['muzik','💿','Müzik şirketi',S.label,'Bot dinlenme, hayalet bilet · %10-15 kayıp'],['ogaleri','🏪','Oto galeri',S.gal,'Sahte satış faturası · %12 kayıp'],['insaat','🏗','İnşaat şirketi',S.co,'Projeye gömme · %10 kayıp']].forEach(([k,ic,n,has,d])=>h+=row(`data-go="${k}"`,ic,n,has?d:'Henüz yok · Kurmak için dokun','›',false));
  return['Kara para kasası',h]};
/* ============ Mafya savaşı haritası: tarafsız semtler ============ */
const NEUTRAL=['Beşiktaş','Fatih','Üsküdar','Ataşehir','Beykoz','Sarıyer','Şişli','Bakırköy','Zeytinburnu','Ümraniye','Maltepe','Pendik'];
function semtS(d){S.semt=S.semt||{};if(!S.semt[d]){const i=NEUTRAL.indexOf(d);S.semt[d]={pow:R(25,55)+i*2,gang:pick(['Delikanlılar','Kıvırcıklar','Topçular','Kara Murat\'ın çocukları','Sarı Kemal\'in adamları','Gece Kuşları','Tayfa','Çarşı Ağaları'])}}return S.semt[d]}
function myTurf(d){return S.org&&S.org.turf.find(v=>v.dist===d)}
ACT.semt=d=>{if(!S.org){toast('Semt ele geçirmek için önce kendi aileni kur (Hayat → Kendi ailen).');return}closeSheet();const v=myTurf(d);
  if(v){const def=v.def||0,up=Math.round(1.5e6*S.cpi*(def+1)),inv=Math.round(v.inc*1.2);
    return queue({back:'harita',title:d,text:`Senin semtin. Yıllık haraç geliri ${fmt(v.inc)}. Savunma seviyesi ${def}/3. Rakipler savunması zayıf semtlere saldırır.`,choices:[
      ...(def<3?[{t:'🛡 Savunmayı güçlendir',sub:`${fmt(up)} · Baskın riski −%25`,dis:!canPay(up),fn:()=>{pay(up);v.def=def+1;log(`${d} savunması güçlendi: ${v.def}/3.`,'good')}}]:[]),
      {t:'💼 Semte yatırım yap',sub:`${fmt(inv)} · Gelir +%25`,dis:!canPay(inv),fn:()=>{pay(inv);v.inc=Math.round(v.inc*1.25);log(`${d}'e yatırım yaptın. Yeni gelir ${fmt(v.inc)}/yıl.`,'good')}},
      {t:'Semti bırak',fn:()=>{S.org.turf=S.org.turf.filter(x=>x!==v);add('respect',-6);log(`${d}'ten çekildin.`,'bad')}},{t:'Kapat',fn:()=>{}}]})}
  const s=semtS(d);const p=battleP(s.pow);const c=Math.round(s.pow*25000*S.cpi);const inc=Math.round((300000+s.pow*9000)*S.cpi);
  queue({back:'harita',title:d,text:`Tarafsız semt. ${s.gang} tutuyor (güç ${s.pow}). Ele geçirirsen yıllık ~${fmt(inc)} haraç.${S.org.intel===QS()?'':' Keşif yaparsan şansın artar.'}`,
    prem:{t:'Dayının adamları semti teslim alsın',sub:'Kayıpsız',fn:()=>{takeSemt(d,inc)}},
    choices:[{t:'⚔️ Semte gir',sub:`${fmt(c)} · Şans %${Math.round(p*100)}`,dis:!canPay(c),fn:()=>{pay(c);if(ch(p)){takeSemt(d,inc);add('heat',8)}else{casualties(1);s.pow+=5;add('heat',10);log(`${d} baskını püskürtüldü. ${s.gang} daha da bilendi.`,'bad')}}},
      {t:'🤝 Mahalle çetesini satın al',sub:`${fmt(c*3)} · Kesin, kansız`,dis:!canPay(c*3),fn:()=>{pay(c*3);takeSemt(d,inc)}},
      {t:'Vazgeç',fn:()=>{}}]})};
function takeSemt(d,inc){S.org.turf.push({id:'semt'+R(0,99999),n:d+' haracı',dist:d,inc,def:0});S.stats.venues++;gainResp(8);delete S.semt[d];log(`${d} artık ${S.org.name}'in! Yıllık ${fmt(inc)} haraç.`,'gold');news(`${S.org.name} ${d}'te kontrolü ele geçirdi`,2)}
function semtQuarter(){if(!S.org||S.jail)return;const wars=S.rivals.filter(r=>r.war&&!r.dead);
  S.org.turf.filter(v=>v.dist&&NEUTRAL.includes(v.dist)).forEach(v=>{const p=(.035+wars.length*.025)*(1-(v.def||0)*.25);if(!ch(p))return;const r=wars.length?pick(wars):RVX();
    if(ch(battleP(r.pow*.7,(v.def||0)*.08))){gainResp(4);r.pow=Math.max(rFloor(),r.pow-4);log(`${r.n} ${v.dist}'e saldırdı, adamların püskürttü.`,'good')}
    else{S.org.turf=S.org.turf.filter(x=>x!==v);casualties(1);log(`${r.n} ${v.dist}'i elinden aldı!`,'bad');news(`${r.n} ${v.dist}'e çöktü`,2)}})}

/* ============ Kaçakçılık rotaları ============ */
const GATES=[{id:'kapikule',n:'Kapıkule',c:'Bulgaristan',ic:'🚛',risk:.15},{id:'sarp',n:'Sarp',c:'Gürcistan',ic:'🚛',risk:.11},{id:'kapikoy',n:'Kapıköy',c:'İran',ic:'🐫',risk:.16},{id:'habur',n:'Habur',c:'Irak',ic:'🚛',risk:.19},{id:'cilvegozu',n:'Cilvegözü',c:'Suriye',ic:'🚚',risk:.24},{id:'ege',n:'Ege adaları',c:'Yunanistan · sürat teknesi',ic:'🚤',risk:.2},{id:'mersin',n:'Mersin limanı',c:'Konteyner gemisi',ic:'🚢',risk:.13}];
const GOODS=[{id:'sigara',n:'Kaçak sigara',m:1,h:2},{id:'yakit',n:'Akaryakıt',m:1.3,h:3},{id:'elek',n:'Telefon ve elektronik',m:1.7,h:3},{id:'antika',n:'Tarihi eser',m:2.4,h:6},{id:'silah',n:'Silah',m:3.2,h:9},{id:'uyus',n:'Uyuşturucu',m:4.2,h:13}];
const BRIBES=[['gumruk','Gümrük memuru',.3,150000],['jandarma','Jandarma komutanı',.25,120000],['emniyet','Narkotik/kaçakçılık şubesi',.2,100000]];
const GT=id=>GATES.find(g=>g.id===id),GD=id=>GOODS.find(g=>g.id===id);
function rRisk(r){const g=GT(r.gate),d=GD(r.good);let k=1;BRIBES.forEach(([b,,red])=>{if(r.br[b])k-=red});return clamp(g.risk*(.6+d.h/12)*Math.max(.15,k)*(1+r.trucks*.04)*(S.heat>60?1.3:1),.02,.8)}
function rInc(r){return Math.round(380000*S.cpi*GD(r.good).m*r.trucks)}
function rBribe(r){return Math.round(BRIBES.reduce((t,[b,,,c])=>t+(r.br[b]?c:0),0)*S.cpi*(1+r.trucks*.1))}
ACT.ropen=()=>{if(S.age<18||S.jail)return;closeSheet();queue({back:'kacak',title:'Yeni rota: sınır kapısı',text:'Hangi kapıdan geçeceksin?',choices:[...GATES.filter(g=>!(S.routes||[]).some(r=>r.gate===g.id)).map(g=>({t:`${g.ic} ${g.n}`,sub:`${g.c} · Temel risk %${Math.round(g.risk*100)}`,fn:()=>setTimeout(()=>ropen2(g.id),40)})),{t:'Vazgeç',fn:()=>{}}]})};
function ropen2(gid){queue({back:'kacak',title:GT(gid).n+' · Ne taşınacak?',text:'Değerli mal çok kazandırır ama yakalanırsan ceza ağır ve dikkat çok artar.',choices:[...GOODS.map(d=>{const c=Math.round(1.2e6*S.cpi*(1+d.m/2));return{t:d.n,sub:`Kurulum ${fmtS(c)} · Tır başına ~${fmtS(380000*S.cpi*d.m)}/sefer · ⏱ ${fmtDur(RDUR[d.id])}`,dis:!canPay(c)||(d.id==='uyus'&&rank()<3)||(d.id==='silah'&&rank()<2),fn:()=>{pay(c);S.routes=S.routes||[];S.routes.push({id:'r'+R(0,99999),gate:gid,good:d.id,trucks:1,br:{},on:true,tot:0,trips:0,bust:0,ready:0,tEnd:Date.now()+RDUR[d.id]});log(`${GT(gid).n} hattı kuruldu: ${d.n}. İlk tır yola çıkmaya hazır.`,'gold')}}}),{t:'Vazgeç',fn:()=>{}}]})}
ACT.route=id=>{const r=(S.routes||[]).find(x=>x.id===id);if(!r)return;closeSheet();const g=GT(r.gate),d=GD(r.good),tc=Math.round(6e5*S.cpi);
  queue({back:'kacak',title:`${g.ic} ${g.n} · ${d.n}`,text:`${r.on?(r.tEnd?`🚚 Sefer yolda: <b><span data-cd="${r.tEnd}">${fmtT(r.tEnd-Date.now())}</span></b> sonra döner`:'📦 Depo dolu, teslim al'):'⏸ Seferler durdu'} · Depoda ${r.ready||0}/${RCAP} yük<br>Her sefer ${fmtDur(rDur(r))} sürer (gerçek saat, oyun kapalıyken de). Depo dolunca araçlar bekler.<br><br>${r.trucks} araç · Sefer başı ~${fmt(rInc(r))} · Yakalanma riski %${Math.round(rRisk(r)*100)} · Rüşvet ${fmt(rBribe(r))}/çeyrek<br>Toplam ${fmt(r.tot)} kazandırdı, ${r.trips} sefer, ${r.bust} baskın.`,
    prem:{t:'Dayının bakanlıktaki adamı',sub:'Bu hat bir yıl risksiz',fn:()=>{r.safe=QS()+4;log(`${g.n} hattı bir yıl boyunca dokunulmaz.`,'gold')}},
    choices:[...(r.ready?[{t:`📦 ${r.ready} yükü teslim al`,sub:'Her yükte baskın riski var',fn:()=>ACT.rget(r.id)}]:[]),
      ...(r.on&&r.tEnd?[{t:`🎟 ${tixNeed(r.tEnd-Date.now())} bilet: seferi hemen bitir`,sub:`Kalan ${fmtT(r.tEnd-Date.now())} · Elinde ${tix()} bilet`,fn:()=>ACT.rtix(r.id)}]:[]),
      ...(S.premium&&r.on&&r.tEnd?[{t:'👑 Dayı: seferi hemen bitir',sub:'Bilet harcamadan',fn:()=>{r.tEnd=Date.now();rTick(r);ACT.rget(r.id)}}]:[]),
      {t:r.on?'⏸ Seferleri durdur':'▶️ Seferleri başlat',fn:()=>{r.on=!r.on;if(r.on){r.tEnd=null;rTick(r)}}},
      ...(r.trucks<10?[{t:'➕ Araç ekle',sub:`${fmt(tc)} · Gelir ve risk artar`,dis:!canPay(tc),fn:()=>{pay(tc);r.trucks++;log(`${g.n} hattına bir araç daha eklendi (${r.trucks}).`,'good')}}]:[]),
      ...BRIBES.map(([b,n,red,c])=>({t:r.br[b]?`✓ ${n} bizden`:`💰 ${n}'nu satın al`,sub:r.br[b]?'Bırakmak için dokun':`${fmtS(c*S.cpi)}/çeyrek · Risk −%${Math.round(red*100)}`,fn:()=>{r.br[b]=!r.br[b];log(r.br[b]?`${g.n}'da ${n.toLowerCase()} artık maaşlı adamın.`:`${n} ile anlaşmayı bitirdin.`,'dim')}})),
      {t:'Hattı kapat',fn:()=>{S.routes=S.routes.filter(x=>x!==r);log(`${g.n} hattı kapandı.`,'dim')}},{t:'Kapat',fn:()=>{}}]})};
const RDUR={sigara:20*MIN,yakit:30*MIN,elek:45*MIN,antika:60*MIN,silah:90*MIN,uyus:120*MIN};const RCAP=3;
const rDur=r=>Math.round((RDUR[r.good]||HOUR)*(hasY('saat')?.85:1));
function rTick(r,now){now=now||Date.now();if(!r.on||(S.jail&&!S.org))return 0;if(r.ready===undefined)r.ready=0;let n=0;const d=rDur(r);
  if(!r.tEnd&&r.ready<RCAP)r.tEnd=now+d;
  while(r.tEnd&&now>=r.tEnd){r.ready++;n++;if(r.ready>=RCAP){r.tEnd=null;break}r.tEnd+=d}
  return n}
function routesTick(){if(!S||!S.routes)return 0;let n=0;S.routes.forEach(r=>{const k=rTick(r);if(k){n+=k;toast(`📦 ${GT(r.gate).n} hattında yük hazır`)}});return n}
function rCollect(r){const g=GT(r.gate),d=GD(r.good);let tot=0,bust=0;const safe=r.safe&&r.safe>QS();
  for(let i=0;i<r.ready;i++){if(!safe&&ch(rRisk(r))){bust++;r.bust++}else{const m=Math.round(rInc(r)*R(80,125)/100*(wk('liman')?1.5:1));tot+=m;r.tot+=m;r.trips++;S.rtTrips=(S.rtTrips||0)+1}}
  r.ready=0;rTick(r);
  if(bust){const lost=Math.min(r.trucks-1,bust);r.trucks=Math.max(1,r.trucks-lost);add('heat',d.h*2*bust);log(`🚨 ${g.n} baskını! ${bust} yüke el konuldu${lost?`, ${lost} araç gitti`:''}.`,'bad');news(`${g.n}'da dev ${d.n.toLowerCase()} operasyonu`,d.h>=9?3:2);if(!S.jail&&ch(.06+d.h/100))later('kacakarrest',0,{g:g.n,d:d.n})}
  if(tot){dirty(tot);add('heat',Math.round(d.h/3));log(`🚚 ${g.n} · ${d.n}: yük teslim alındı, ${fmt(tot)} kazandın.`,'gold')}
  return tot}
function routesQuarter(){if(!S.routes||!S.routes.length)return;
  S.routes.forEach(r=>{if(!r.on)return;const br=rBribe(r);if(br){fund(br);(fund(br),S.money=Math.max(0,S.money-br))}rTick(r)})}
ACT.rget=id=>{const r=(S.routes||[]).find(x=>x.id===id);if(!r)return;rTick(r);if(!r.ready){toast('Henüz yük gelmedi');return}rCollect(r);afterChange();closeSheet();setTimeout(()=>openSheet('kacak'),40)};
ACT.rgetall=()=>{(S.routes||[]).forEach(r=>{rTick(r);if(r.ready)rCollect(r)});afterChange();closeSheet();setTimeout(()=>openSheet('kacak'),40)};
ACT.rtix=id=>{const r=(S.routes||[]).find(x=>x.id===id);if(!r||!r.tEnd)return;const n=tixNeed(r.tEnd-Date.now());if(!tixUse(n))return;r.tEnd=Date.now();rTick(r);log(`🎟 ${n} bilet kullandın, ${GT(r.gate).n} seferi hemen döndü.`,'dim');ACT.rget(id)};
LATER.kacakarrest=d=>({title:'Şoför konuştu',text:`${d.g} baskınında yakalanan şoför ifadesinde senin adını verdi.`,prem:{t:'Dayının avukatı',sub:'İfade geri çekilir',fn:()=>{add('heat',-10);log('Şoför ifadesini geri çekti. "Baskı altında konuştum" dedi.','gold')}},choices:[
  {t:'Şoförün ailesine para gönder',sub:fmt(Math.round(5e5*S.cpi))+' · %70 ifadeyi değiştirir',dis:!canPay(Math.round(5e5*S.cpi)),fn:()=>{pay(Math.round(5e5*S.cpi));if(ch(.7))log('Şoför ifadesini değiştirdi.','good');else arrest(d.d+' kaçakçılığı',[3,8])}},
