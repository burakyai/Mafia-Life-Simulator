const LEAGUES=[
  {n:'Amatör Lig',base:42,rev:600000,prize:400000,price:2000000},
  {n:'3. Lig',base:51,rev:5000000,prize:2500000,price:15000000},
  {n:'2. Lig',base:58,rev:14000000,prize:7000000,price:60000000},
  {n:'1. Lig',base:65,rev:45000000,prize:22000000,price:220000000},
  {n:'Süper Lig',base:73,rev:280000000,prize:130000000,price:1500000000}];
const TOWNS=['Bağcılar','Ümraniye','Tuzla','Sarıyer','Pendik','Eyüp','Beykoz','Zeytinburnu','Esenler','Maltepe','Silivri','Çatalca','Sancaktepe','Gebze','Darıca','İzmit','Bursa','Eskişehir','Konya','Kayseri','Samsun','Trabzon','Rize','Erzurum','Malatya','Gaziantep','Adana','Mersin','Antalya','Denizli','Manisa','Balıkesir','Sakarya','Ankara','Sivas','Hatay'];
const SUF=['Gücü','Gençlik','İdman Yurdu','FK','Yıldızları','Kartalları','Fırtınası','Ekspres','Anadolu','Atletik'];
const FOREIGN=['Mbaye','Silva','Kovač','Hansen','Rossi','Petrov','Mendes','Diallo','Novak','Costa','Santos','Müller','Ivanov','Okafor','Lindqvist','Fernández'];
const FPOS=['KL','DF','OS','FV'];
const pVal=(r,a)=>Math.round(300000*((S&&S.cpi)||1)*Math.exp((r-50)*.13)*(a<=23?1.3:a>=31?.6:1)/1000)*1000;
function mkPlayer(base,pos){const a=R(18,33),r=clamp(base+R(-7,8),30,93);return{id:'p'+R(0,1e9),n:(ch(.35)?pick(FOREIGN)+' ':'')+pick(NAMES)+' '+pick(SURN).slice(0,ch(.5)?20:0),pos:pos||pick(FPOS),r,age:a}}
function fixName(p){p.n=p.n.trim().replace(/\s+/g,' ');return p}
function genSquad(base){const s=[];[['KL',2],['DF',6],['OS',6],['FV',4]].forEach(([p,n])=>{for(let i=0;i<n;i++)s.push(fixName(mkPlayer(base,p)))});return s}
function clubStr(c){const sq=[...c.squad].sort((a,b)=>b.r-a.r);const gk=sq.filter(p=>p.pos==='KL');const best=[gk[0],...sq.filter(p=>p!==gk[0])].filter(Boolean).slice(0,11);
  let avg=best.reduce((s,p)=>s+p.r,0)/Math.max(1,best.length);if(!gk.length)avg-=8;if(best.length<11)avg-=(11-best.length)*3;return Math.round(avg+(c.coach?c.coach.b:0)+(c.morale||0))}
function sched(n){const t=[...Array(n).keys()];const rs=[];for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];pr.push(r%2?[b,a]:[a,b])}rs.push(pr);t.splice(1,0,t.pop())}return rs.concat(rs.map(r=>r.map(([a,b])=>[b,a])))}
function newSeason(c){const L=LEAGUES[c.lv];const used=new Set();const teams=[{n:c.name,me:1}];
  while(teams.length<12){const n=`${pick(TOWNS)} ${pick(SUF)}`;if(!used.has(n)&&n!==c.name){used.add(n);teams.push({n,str:L.base+R(-6,7)})}}
  teams.forEach(t=>Object.assign(t,{P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0}));c.season={teams,sch:sched(12),round:0,y:gYear()}}
function pois(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function playRound(c){const T=c.season.teams,rd=c.season.sch[c.season.round];if(!rd)return null;let mine=null;
  rd.forEach(([a,b])=>{const A=T[a],B=T[b];const sa=A.me?clubStr(c):A.str,sb=B.me?clubStr(c):B.str;const d=(sa-sb)/10;
    const ga=pois(Math.max(.15,1.4+d*.45)),gb=pois(Math.max(.15,1.1-d*.45));
    A.P++;B.P++;A.GF+=ga;A.GA+=gb;B.GF+=gb;B.GA+=ga;if(ga>gb){A.W++;A.Pts+=3;B.L++}else if(ga<gb){B.W++;B.Pts+=3;A.L++}else{A.D++;B.D++;A.Pts++;B.Pts++}
    if(A.me||B.me)mine={opp:A.me?B.n:A.n,g:A.me?ga:gb,o:A.me?gb:ga,home:!!A.me}});
  c.season.round++;return mine}
const table=c=>[...c.season.teams].sort((a,b)=>b.Pts-a.Pts||(b.GF-b.GA)-(a.GF-a.GA)||b.GF-a.GF);
const myPos=c=>table(c).findIndex(t=>t.me)+1;
function clubQuarter(){const c=S.club;if(!c)return;const L=LEAGUES[c.lv];
  // maçlar
  const n=[6,5,6,5][S.q||0];let w=0,d=0,l=0;const res=[];
  for(let i=0;i<n;i++){const m=playRound(c);if(!m)break;if(m.g>m.o)w++;else if(m.g===m.o)d++;else l++;res.push(m)}
  if(res.length){const pos=myPos(c);c.morale=clamp((c.morale||0)+(w-l)*.5,-3,3);
    const best=res.reduce((a,b)=>(b.g-b.o)>(a.g-a.o)?b:a);
    log(`⚽ ${c.name}: ${w}G ${d}B ${l}M · ${L.n}'de ${pos}. sırada. En iyi maç: ${best.g}-${best.o} ${best.opp}.`,w>l?'good':l>w?'bad':'dim');
    if(pos>=11&&c.season.round>=8&&ch(.35))queue({title:'Taraftar tepkisi',text:`${c.name} küme düşme hattında. Tribünler "Yönetim istifa!" diye inliyor.`,prem:{t:'Dayın soyunma odasına girsin',sub:'Moral zirve',fn:()=>{c.morale=3;log('Dayın soyunma odasında konuştu. Oyuncular sahaya aslan gibi çıkacak.','gold')}},choices:[
      {t:'Prim sözü ver',sub:fmt(Math.round(L.rev*.05)),dis:!canPay(Math.round(L.rev*.05)),fn:()=>{pay(Math.round(L.rev*.05));c.morale=clamp(c.morale+2,-3,3);log('Oyunculara galibiyet primi sözü verdin.','good')}},
      {t:'Hocayı kov',sub:'Moral +1',fn:()=>{c.coach=null;c.morale=clamp(c.morale+1,-3,3);log('Teknik direktörle yollar ayrıldı.','dim')}},
      {t:'Görmezden gel',fn:()=>{add('respect',-2);log('Taraftar seni yuhaladı.','bad')}}]})}
  // finans
  const wages=Math.round(c.squad.reduce((s,p)=>s+pVal(p.r,p.age)*.12,0)*.25+(c.coach?c.coach.w*.25:0));const rev=Math.round(L.rev*.25*(1+Math.max(0,c.morale)*.05));
  c.cash+=rev-wages;
  if(c.cash<0){const need=-c.cash;fund(need);const t=Math.min(S.money,need);S.money-=t;c.cash+=t;if(c.cash<0){c.season.teams.find(x=>x.me).Pts-=3;log(`${c.name} maaşları ödeyemedi! Federasyon 3 puan sildi.`,'bad');c.cash=0}else log(`Kulübün açığını cebinden kapattın: ${fmt(t)}.`,'dim')}
  // sezon sonu
  if(c.season.round>=c.season.sch.length){const pos=myPos(c);const prize=Math.round(L.prize*(13-pos)/12);c.cash+=prize;c.hist.unshift({y:c.season.y,lv:c.lv,pos});
    let msg=`${c.name} sezonu ${L.n}'de ${pos}. tamamladı. Ödül: ${fmt(prize)}.`;
    if(pos===1){c.trophies++;S.stats.titles=(S.stats.titles||0)+1;gainResp(c.lv>=4?12:5);S.fame=clamp((S.fame||0)+(c.lv>=4?15:4));news(c.lv>=4?`ŞAMPİYON ${c.name.toLocaleUpperCase('tr-TR')}! Başkan ${S.first} ${S.last} omuzlarda`:`${c.name} ${L.n} şampiyonu`,c.lv>=4?4:2);msg+=' 🏆 Şampiyon!'}
    if(pos<=2&&c.lv<4){c.lv++;msg+=` ${LEAGUES[c.lv].n}'e yükseldi!`;news(`${c.name} ${LEAGUES[c.lv].n}'e yükseldi`,2);add('happy',10)}
    else if(pos===1&&c.lv===4){const eu=150000000;c.cash+=eu;msg+=` Avrupa kupaları geliri: ${fmt(eu)}.`}
    else if(pos>=11&&c.lv>0){c.lv--;msg+=` ${LEAGUES[c.lv].n}'e düştü.`;add('happy',-10);news(`${c.name} küme düştü`,1)}
    log(msg,'gold');newSeason(c)}
  // yaşlanma
  if(S.q===0){c.squad.forEach(p=>{p.age++;p.r=clamp(p.r+(p.age<=22?R(1,4):p.age<=27?R(0,2):p.age<=30?R(-1,1):R(-4,-1)),30,95)});
    const ret=c.squad.filter(p=>p.age>=36);ret.forEach(p=>log(`${p.n} futbolu bıraktı.`,'dim'));c.squad=c.squad.filter(p=>p.age<36);
    const yn=Math.max(2,18-c.squad.length);for(let i=0;i<yn&&c.squad.length<26;i++){const y=fixName(mkPlayer(LEAGUES[c.lv].base-6));y.age=R(17,19);c.squad.push(y)}log(`Altyapıdan ${yn} genç oyuncu A takıma çıktı.`,'dim')}
}
function tMarket(){const c=S.club;if(!c.market||c.market.q!==QS()){const base=LEAGUES[c.lv].base;c.market={q:QS(),items:Array.from({length:9},()=>{const p=fixName(mkPlayer(base+R(-3,14)));p.price=Math.round(pVal(p.r,p.age)*R(95,130)/100/1000)*1000;return p})}}return c.market.items}
ACT.buyclub=lv=>{const L=LEAGUES[+lv];closeSheet();const names=[`${pick(TOWNS)} ${pick(SUF)}`,`${S.last} ${pick(['Gücü','FK','Atletik'])}`,`${pick(['Haliç','Boğaziçi','Galata','Moda','Kartal','Fener Koyu'])} ${pick(SUF)}`];
  queue({back:'kulup',title:`${L.n} kulübü satın al`,text:`Kulüp ${fmt(L.price)}. Kadro ve borçsuz kasa dahil. Kulübün adı ne olsun?`,choices:[...names.map(n=>({t:n,sub:fmt(L.price),dis:!canPay(L.price),fn:()=>{pay(L.price);S.club={name:n,lv:+lv,cash:Math.round(L.rev*.3),squad:genSquad(L.base),coach:null,morale:0,hist:[],trophies:0};newSeason(S.club);gainResp(4);log(`${n} artık senin. Başkan ${S.first} ${S.last}!`,'gold');news(`${S.first} ${S.last} ${n}'i satın aldı`,2)}})),{t:'Vazgeç',fn:()=>{}}]})};
ACT.tbuy=id=>{const c=S.club,p=tMarket().find(x=>x.id===id);if(!p)return;closeSheet();
  queue({back:'transfer',title:p.n,text:`${p.pos} · ${p.age} yaş · Güç ${p.r}. Bonservis ${fmt(p.price)}, yıllık maaş ${fmt(Math.round(pVal(p.r,p.age)*.12))}. Kulüp kasası: ${fmt(c.cash)}.`,
    prem:{t:'Dayının menajeri',sub:`%30 indirim · ${fmt(Math.round(p.price*.7))}`,fn:()=>tSign(p,Math.round(p.price*.7))},
    choices:[{t:'Transfer et',sub:fmt(p.price),dis:c.cash<p.price||c.squad.length>=26,fn:()=>tSign(p,p.price)},
      {t:'Pazarlık yap',fn:()=>{if(ch(.5)){p.price=Math.round(p.price*.85/1000)*1000;log(`${p.n}'in kulübü %15 indirime razı oldu.`,'good')}else if(ch(.4)){c.market.items=c.market.items.filter(x=>x!==p);log(`${p.n} başka kulübe imza attı.`,'bad')}else log('Karşı taraf fiyattan inmedi.','dim')}},{t:'Vazgeç',fn:()=>{}}]})};
function tSign(p,price){const c=S.club;if(c.cash<price){toast('Kulüp kasası yetmiyor.');return}c.cash-=price;c.squad.push({id:p.id,n:p.n,pos:p.pos,r:p.r,age:p.age});c.market.items=c.market.items.filter(x=>x!==p);log(`${c.name}, ${p.n}'i ${fmt(price)} bonservisle kadrosuna kattı.`,'good');if(price>=5e7)news(`Dev transfer: ${p.n} ${c.name}'de!`,2)}
ACT.pl=id=>{const c=S.club,p=c.squad.find(x=>x.id===id);if(!p)return;const v=Math.round(pVal(p.r,p.age)*R(85,115)/100/1000)*1000;closeSheet();
  queue({back:'kulup',title:p.n,text:`${p.pos} · ${p.age} yaş · Güç ${p.r} · Piyasa değeri ~${fmt(pVal(p.r,p.age))}.`,choices:[
    {t:'Sat',sub:fmt(v),dis:c.squad.length<=14,fn:()=>{c.squad=c.squad.filter(x=>x!==p);c.cash+=v;log(`${p.n} ${fmt(v)} bonservisle satıldı.`,'dim')}},
    {t:'Sözleşmesini fesh et',dis:c.squad.length<=14,fn:()=>{c.squad=c.squad.filter(x=>x!==p);log(`${p.n} ile yollar ayrıldı.`,'dim')}},{t:'Vazgeç',fn:()=>{}}]})};
ACT.cmoney=k=>{const c=S.club,L=LEAGUES[c.lv];closeSheet();
  if(k==='in')return amountModal('Kulübe sermaye koy','Temiz para. Kulüp kasasına geçer.',S.money,a=>{S.money-=a;c.cash+=a;log(`Kulübe ${fmt(a)} sermaye koydun.`,'dim')},'kulup');
  if(k==='out')return amountModal('Kulüpten para çek','Kâr payı olarak sana geçer ve vergilendirilir.',Math.max(0,c.cash),a=>{c.cash-=a;S.money+=a;S.taxInc=(S.taxInc||0)+a;log(`Kulüpten ${fmt(a)} çektin.`,'dim')},'kulup');
  const opts=[1e6,1e7,1e8,1e9].filter(a=>a<=S.money);
  queue({back:'kulup',title:'Kulüp üzerinden para akla',text:`Kayıt dışı parayı sahte sponsorluk ve bilet geliri gibi kulübe sokarsın. %10'u masrafa gider, kalanı kulüp kasasına temiz para olarak girer ve polis dikkatin düşer. Kulübün yıllık geliri (${fmtS(L.rev)}) küçükken büyük meblağ sokmak MASAK'ın dikkatini çeker.`,choices:[
    ...opts.map(a=>{const risk=clamp(a/(L.rev*3),.03,.75);return{t:fmt(a),sub:`Dikkat −${Math.min(30,Math.round(a/2e6)+4)} · Yakalanma riski %${Math.round(risk*100)}`,fn:()=>{S.money-=a;
      if(ch(risk)){const fine=Math.round(a*.5);c.cash+=Math.round(a*.4);add('heat',20);c.season.teams.find(x=>x.me).Pts-=6;log(`MASAK ve federasyon soruşturması! ${fmt(fine)} ceza, 6 puan silme.`,'bad');news(`${c.name}'e kara para soruşturması`,3)}
      else{c.cash+=Math.round(a*.9);add('heat',-Math.min(30,Math.round(a/2e6)+4));log(`${fmt(a)} sponsorluk geliri olarak kulübe girdi. Para artık temiz.`,'good')}}}}),{t:'Vazgeç',fn:()=>{}}]})};
ACT.coach=()=>{const c=S.club,L=LEAGUES[c.lv];closeSheet();const k=L.rev/1e6;
  const C=[{n:`${pick(NAMES)} ${pick(SURN)}`,t:'Genç yerli hoca',b:1,w:Math.round(k*30000)},{n:`${pick(NAMES)} ${pick(SURN)}`,t:'Tecrübeli hoca',b:3,w:Math.round(k*70000)},{n:`${pick(FOREIGN)} ${pick(['Marco','Jürgen','Carlos','Luis','Pep','Fabio'])}`,t:'Yabancı yıldız hoca',b:6,w:Math.round(k*160000)}];
  queue({back:'kulup',title:'Teknik direktör',text:'Yıllık maaşı kulüp kasasından ödenir.',choices:[...C.map(x=>({t:`${x.n} · ${x.t}`,sub:`Takım gücü +${x.b} · Yıllık ${fmt(x.w)}`,fn:()=>{c.coach=x;log(`${x.n} ${c.name}'in yeni hocası.`,'good')}})),{t:'Vazgeç',fn:()=>{}}]})};
ACT.sellclub=()=>{const c=S.club,v=Math.round(LEAGUES[c.lv].price*.8+c.cash);closeSheet();queue({back:'kulup',title:'Kulübü sat',text:`${c.name} için ${fmt(v)} teklif var (kasa dahil).`,choices:[{t:'Sat',fn:()=>{S.money+=v;log(`${c.name}'i ${fmt(v)}'ye sattın.`,'gold');S.club=null}},{t:'Vazgeç',fn:()=>{}}]})};
EXTRA.kulup=()=>{const c=S.club;let h='';
  if(!c){h+='<p class="note">Bir kulüp satın al, kadro kur, transfer yap, ligleri tırman. Kulüp aynı zamanda kayıt dışı paranı aklamak için bir araç.</p>';
    LEAGUES.forEach((L,i)=>h+=row(`data-x="buyclub:${i}"`,'⚽',`${L.n} kulübü`,`Yıllık gelir ~${fmtS(L.rev)}`,fmtS(L.price),!canPay(L.price)||!!S.jail));return['Futbol kulübü',h]}
  const L=LEAGUES[c.lv],pos=myPos(c);
  h+=`<div class="sum"><div><span>Kulüp</span><b>${c.name}</b></div><div><span>Lig</span><b>${L.n} · ${pos}. sıra</b></div><div><span>Hafta</span><b>${c.season.round}/22</b></div><div><span>Takım gücü</span><b style="color:var(--gold)">${clubStr(c)}</b> <small style="color:var(--muted)">(lig ort. ${L.base})</small></div><div><span>Kulüp kasası</span><b style="color:${c.cash>=0?'var(--good)':'var(--blood)'}">${fmt(c.cash)}</b></div><div><span>Teknik direktör</span><b>${c.coach?c.coach.n:'Yok'}</b></div><div><span>Kupalar</span><b>${c.trophies} 🏆</b></div></div>`;
  h+=row('data-go="lig"','📊','Lig tablosu','Puan durumu ve geçmiş sezonlar','›',false)+row('data-go="transfer"','🔁','Transfer piyasası','Bu çeyreğin oyuncuları','›',false)+row('data-x="coach:"','📋','Teknik direktör tut','Takım gücünü artırır','',false);
  h+='<div class="sec">Para</div>'+row('data-x="cmoney:in"','💰','Sermaye koy','Temiz para','',S.money<1000)+row('data-x="cmoney:akla"','🧺','Kara para akla','Dikkat −, MASAK riski','',S.money<1e6)+row('data-x="cmoney:out"','🏦','Kulüpten para çek','Vergilendirilir','',c.cash<=0);
  const sq=[...c.squad].sort((a,b)=>FPOS.indexOf(a.pos)-FPOS.indexOf(b.pos)||b.r-a.r);
  h+=`<div class="sec">Kadro (${c.squad.length}/26)</div>`;sq.forEach(p=>h+=`<button class="row" data-x="pl:${p.id}" style="padding:8px 12px"><span class="ic" style="font-family:var(--cond);font-size:13px;font-weight:700;color:var(--gold)">${p.pos}</span><span class="tx"><b style="font-size:15px">${p.n}</b><span>${p.age} yaş · ~${fmtS(pVal(p.r,p.age))}</span></span><span class="rt" style="font-size:18px">${p.r}</span></button>`);
  h+=row('data-x="sellclub:"','🤝','Kulübü sat','','',false);
  return['Futbol kulübü',h]};
EXTRA.lig=()=>{const c=S.club;if(!c)return['Lig',''];const t=table(c);
  let h=`<p class="note">${LEAGUES[c.lv].n} · ${c.season.round}/22. hafta. İlk 2 üst lige çıkar, son 2 düşer.</p><div class="sum" style="padding:4px 10px">`;
  t.forEach((x,i)=>h+=`<div style="padding:6px 0;${x.me?'color:var(--gold);font-weight:700':''}"><span style="color:inherit;flex:1">${i+1}. ${x.n}</span><b style="font-variant-numeric:tabular-nums;white-space:nowrap">${x.P} · ${x.W}-${x.D}-${x.L} · ${x.GF-x.GA>=0?'+':''}${x.GF-x.GA} · <span style="color:var(--gold)">${x.Pts}</span></b></div>`);
  h+='</div>';if(c.hist.length)h+='<div class="sec">Geçmiş sezonlar</div><div class="sum">'+c.hist.slice(0,10).map(x=>`<div><span>${x.y} · ${LEAGUES[x.lv].n}</span><b>${x.pos}.${x.pos===1?' 🏆':''}</b></div>`).join('')+'</div>';
  return['Lig tablosu',h]};
EXTRA.transfer=()=>{const c=S.club;if(!c)return['Transfer',''];let h=`<p class="note">Kulüp kasası: <b style="color:var(--good)">${fmt(c.cash)}</b>. Piyasa her çeyrek yenilenir.</p>`;
  tMarket().forEach(p=>h+=`<button class="row" data-x="tbuy:${p.id}" ${c.cash<p.price*.7?'':''}><span class="ic" style="font-family:var(--cond);font-size:13px;font-weight:700;color:var(--gold)">${p.pos}</span><span class="tx"><b>${p.n}</b><span>${p.age} yaş · Güç <b style="display:inline;color:var(--ink)">${p.r}</b></span></span><span class="rt">${fmtS(p.price)}</span></button>`);
  return['Transfer piyasası',h]};

/* ============ Mafya konseyi ============ */
const councilOK=()=>!!(S.org||S.boss||rank()>=4);
function cMembers(){const out=[];
  FAMILIES.forEach((f,i)=>{if(S.family===f.n&&!S.boss)return;out.push({id:'f'+i,n:f.n,boss:'Baba '+f.b,pow:[95,88,80][i],ally:S.family===f.n,war:false})});
  S.rivals.filter(r=>!r.dead).forEach(r=>out.push({id:'r'+r.id,n:r.n,boss:r.boss.name,pow:r.pow,ally:!!r.ally,war:!!r.war}));
  return out}
const crel=id=>{S.council.rel[id]=S.council.rel[id]??R(-10,20);return S.council.rel[id]};
function myVote(){return S.org?orgPow():S.boss?90:60}
function vote(bonus=0){let yes=myVote(),no=0;const det=[];cMembers().forEach(m=>{const p=clamp(.45+crel(m.id)/200+(m.ally?.25:0)-(m.war?.35:0)+bonus,.05,.95);const y=ch(p);if(y)yes+=m.pow;else no+=m.pow;det.push(`${m.n}: ${y?'Evet':'Hayır'}`)});return{ok:yes>no,yes,no,det}}
function councilYear(){const C=S.council;if(!councilOK()||S.jail)return;
  if(C.chair){const t=Math.round(cMembers().reduce((s,m)=>s+m.pow,0)*20000*S.cpi);S.money+=t;gainResp(3);log(`Konsey başkanı olarak ailelerden yıllık pay: ${fmt(t)}.`,'gold')}
  if(C.rules.includes('pay')&&!C.chair&&S.org){const p=Math.round(S.org.turf.reduce((s,v)=>s+v.inc,0)*.05);if(p){S.money=Math.max(0,S.money-p);log(`Konsey payı olarak ${fmt(p)} ödedin.`,'dim')}}
  const elect=!C.chairEnd||S.age>=C.chairEnd;
  const neutral=['Beşiktaş','Fatih','Üsküdar','Ataşehir','Beykoz'].filter(d=>!(S.org&&S.org.turf.some(v=>v.dist===d)));
  const items=[];if(elect)items.push('baskan');if(neutral.length&&S.org)items.push('bolge');if(!C.rules.includes('ateskes'))items.push('ateskes');if(!C.rules.includes('pay'))items.push('pay');if(!C.rules.includes('sessizlik'))items.push('sessizlik');
  const a=pick(items.length?items:['bolge']);if(!a)return;
  const lob=Math.round(2e6*S.cpi);
  const ask=(title,text,onYes,onNo)=>queue({back:null,title:`🏛 Mafya konseyi: ${title}`,text,prem:{t:'Dayının sözü geçer',sub:'Oylama senin lehine',fn:()=>{onYes();log('Dayın masaya bir baktı, eller kalktı.','gold')}},choices:[
    {t:'Oyla',sub:'Konsey üyelerinin tutumuna göre',fn:()=>{const v=vote();log(`Oylama: ${v.ok?'KABUL':'RED'} (güç ${v.yes} – ${v.no}).`,v.ok?'good':'bad');v.ok?onYes():onNo&&onNo()}},
    {t:'Önce lobi yap, sonra oyla',sub:`${fmt(lob)} · Şans +%20`,dis:!canPay(lob),fn:()=>{pay(lob);const v=vote(.2);log(`Lobi sonrası oylama: ${v.ok?'KABUL':'RED'} (güç ${v.yes} – ${v.no}).`,v.ok?'good':'bad');v.ok?onYes():onNo&&onNo()}},
    {t:'Masadan kalk',sub:'Saygı −',fn:()=>{add('respect',-4);cMembers().forEach(m=>S.council.rel[m.id]=crel(m.id)-5);log('Konseyi terk ettin. Babalar bunu unutmayacak.','bad')}}]});
  if(a==='baskan')ask('Başkanlık seçimi','Konsey 4 yıllığına yeni başkanını seçiyor. Adaylardan biri sensin. Başkan, ailelerden yıllık pay alır ve konseyi yönetir.',()=>{C.chair=true;C.chairEnd=S.age+4;gainResp(10);S.fame=clamp((S.fame||0)+8);log('Mafya konseyinin yeni başkanı sensin!','gold');news('Yeraltında yeni dönem: konsey başkanı belli oldu',3)},()=>{C.chair=false;C.chairEnd=S.age+4;log('Başkanlığı rakip babalardan biri kazandı.','dim')});
  else if(a==='bolge'){const d=pick(neutral);ask('Bölge paylaşımı',`Tarafsız ${d} bölgesi masada. Kabul edilirse ${S.org.name}'e geçecek.`,()=>{const inc=Math.round((150000+R(0,250000))*S.cpi);S.org.turf.push({id:'n'+d,n:`${d} bölgesi`,inc,dist:d});S.stats.venues++;gainResp(6);log(`${d} artık ${S.org.name}'in bölgesi. Yıllık ${fmt(inc)}.`,'gold')})}
  else if(a==='ateskes')ask('Genel ateşkes','Bütün aileler arasında ateşkes önerisi. Kabul edilirse tüm savaşlar biter; ateşkesi bozan konseyi karşısına alır.',()=>{C.rules.push('ateskes');S.rivals.forEach(r=>r.war=false);log('Genel ateşkes ilan edildi. Sokaklar sustu.','good')});
  else if(a==='pay')ask('Konsey payı','Her aile mekân gelirinin %5\'ini konsey başkanına ödesin önerisi.',()=>{C.rules.push('pay');log('Konsey payı kuralı kabul edildi.','dim')});
  else if(a==='sessizlik')ask('Sessizlik yemini','"Kimse polisle konuşmaz" yemini. Kabul edilirse polis dikkati her çeyrek biraz daha hızlı düşer.',()=>{C.rules.push('sessizlik');log('Sessizlik yemini kabul edildi.','good')});
}
ACT.clob=id=>{const c=Math.round(1e6*S.cpi);if(!pay(c))return;S.council.rel[id]=clamp(crel(id)+R(12,22),-100,100);log('Bir babaya hediye gönderdin; masadaki sözün güçlendi.','dim');done()};
ACT.cmeet=()=>{if(!S.council.chair){const c=Math.round(5e6*S.cpi);if(!pay(c))return}closeSheet();councilYear()};
ACT.csanc=id=>{const r=RV(id.slice(1));closeSheet();if(!r)return;queue({back:'konsey',title:`${r.n} için yaptırım`,text:'Başkan olarak bir aileyi konseyin karşısına çıkarabilirsin. Kabul edilirse bütün aileler ona sırt çevirir.',choices:[{t:'Oylamaya sun',fn:()=>{const v=vote(.1);if(v.ok){r.pow=Math.max(10,Math.round(r.pow*.6));r.war=false;gainResp(6);log(`Konsey ${r.n}'e yaptırım uyguladı. Güçleri yarı yarıya eridi.`,'gold');news(`${r.n} yeraltında yalnız kaldı`,2)}else log('Yaptırım önerisi reddedildi.','bad')}},{t:'Vazgeç',fn:()=>{}}]})};
EXTRA.konsey=()=>{const C=S.council;let h='';
  if(!councilOK())return['Mafya konseyi','<p class="note">Konsey masasına sadece babalar oturur. Kendi aileni kur, bir ailenin Babası ol ya da en az Sağ Kol rütbesine yüksel.</p>'];
  h+=`<div class="sum"><div><span>Başkan</span><b style="color:${C.chair?'var(--gold)':'var(--ink)'}">${C.chair?'Sen 👑':'Başka bir baba'}</b></div>${C.chairEnd?`<div><span>Sonraki seçim</span><b>${C.chairEnd<=S.age?'Bu yıl':C.chairEnd+' yaşında'}</b></div>`:''}<div><span>Senin oy gücün</span><b>${myVote()}</b></div><div><span>Kurallar</span><b>${C.rules.length?C.rules.map(r=>({ateskes:'Ateşkes',pay:'Konsey payı',sessizlik:'Sessizlik yemini'}[r])).join(', '):'Yok'}</b></div></div>`;
  h+='<p class="note">Konsey her yıl yaş gününde toplanır. Babaların sana bakışı oylamaları belirler; hediyeyle yumuşatabilirsin.</p>';
  h+=row('data-x="cmeet:"','🔔','Olağanüstü toplantı çağır',C.chair?'Başkan olarak bedava':'Masraf ve hatır',C.chair?'':fmtS(5e6*S.cpi),!C.chair&&!canPay(5e6*S.cpi));
  h+='<div class="sec">Masadaki babalar</div>';
  cMembers().forEach(m=>{const r=crel(m.id);h+=`<button class="row" data-x="clob:${m.id}"><span class="ic">${m.ally?'🤝':m.war?'⚔️':'🎩'}</span><span class="tx"><b>${m.boss}</b><span>${m.n} · Güç ${m.pow} · Tutum ${r>0?'+':''}${r}</span><div class="bar" style="margin-top:5px"><i style="width:${(r+100)/2}%;background:${r>=30?'var(--good)':r>=-10?'var(--warn)':'var(--blood)'}"></i></div></span><span class="rt">Hediye<br><small>${fmtS(1e6*S.cpi)}</small></span></button>`});
  if(C.chair){h+='<div class="sec">Başkan yetkisi</div>';S.rivals.filter(r=>!r.dead).forEach(r=>h+=row(`data-x="csanc:r${r.id}"`,'⚖️',`${r.n}'e yaptırım`,'Konseyin oyuna sun','',false))}
  return['Mafya konseyi',h]};

  {id:'galata',n:'Galata Yatırım',c:'#8a2f2f',l:'G',d:'Büyük paraya özel: ₺10 milyon üstü hesaplara +%3.',adj:.005,big:.03},

function bRate(bk,t,amt){return clamp((S.infl||.3)+bk.adj+t.b+(bk.big&&amt>=1e7*S.cpi?bk.big:0),.02,1.2)}
const bLogo=(bk,sz=38)=>`<span style="width:${sz}px;height:${sz}px;border-radius:10px;background:${bk.c};display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:${sz*.5}px;color:#fff;flex:none">${bk.l}</span>`;

function acctQuarter(){const now=QS();const keep=[];
  (S.accts||[]).forEach(a=>{if(now>=a.mat){const bk=BK(a.bank);let r=a.rate;if(bk.vary)r=clamp(r+R(-100,100)/100*bk.vary,.01,1.2);const int=Math.round(a.amt*r*a.q/4);
      if(!bk.secret)S.taxInc=(S.taxInc||0)+int;
      if(a.auto){const t=TERMS.find(x=>x.q===a.q);a.amt+=int;a.rate=bRate(bk,t,a.amt);a.mat=now+a.q;keep.push(a);log(`${bk.n}: vadeli hesabın ${fmt(int)} ${bk.vary?'kâr payı':'faiz'} getirdi ve yenilendi (yeni oran %${Math.round(a.rate*100)}).`,'good')}
      else{S.bank.dep+=a.amt+int;log(`${bk.n}: vadeli hesabın doldu. ${fmt(a.amt+int)} vadesiz hesabına geçti (getiri ${fmt(int)}).`,'good')}}
    else keep.push(a)});S.accts=keep}
ACT.bopen=k=>{const [bid,q]=k.split(':');const bk=BK(bid),t=TERMS.find(x=>x.q===+q);closeSheet();
  const minA=bk.min?Math.ceil(bk.min*S.cpi/1000)*1000:10000,maxA=bk.max?bk.max*S.cpi:Infinity;const pool=S.money+S.bank.dep;
  const opts=[1e5,1e6,1e7,1e8,1e9].map(a=>Math.ceil(a*S.cpi/1000)*1000).filter(a=>a>=minA&&a<Math.min(pool,maxA));
  const all=Math.min(pool,maxA);
  queue({back:'banka',title:`${bk.n} · ${t.n} vadeli`,text:`Yıllık %${Math.round(bRate(bk,t,all)*100)} ${bk.vary?'tahmini kâr payı':'faiz'}. Para ${t.n} boyunca kilitlenir, vadeden önce bozarsan getiri alamazsın. Önce kasadan, yetmezse vadesiz hesabından çekilir.${bk.min?` En az ${fmt(minA)}.`:''}${bk.max?` En fazla ${fmt(maxA)}.`:''}`,
    choices:[...opts.map(a=>({t:fmt(a),sub:`Vade sonunda ~${fmt(Math.round(a*(1+bRate(bk,t,a)*t.q/4)))}`,fn:()=>openAcct(bk,t,a)})),...(all>=minA?[{t:`Tamamı (${fmt(all)})`,sub:'Kasa + vadesiz',fn:()=>openAcct(bk,t,all)}]:[]),{t:'Vazgeç',fn:()=>{}}]})};
function openAcct(bk,t,a){let need=a;const m=Math.min(S.money,need);S.money-=m;need-=m;if(need>0){S.bank.dep-=Math.min(S.bank.dep,need)}
  S.accts.push({id:'ac'+Date.now()+R(0,999),bank:bk.id,amt:Math.round(a),q:t.q,rate:bRate(bk,t,a),mat:QS()+t.q,auto:true});
  if(!bk.secret&&S.heat>=50&&a>=3e5*S.cpi&&ch(.4)){add('heat',10);log(`${bk.n} büyük yatırımını MASAK'a bildirdi.`,'bad')}
  log(`${bk.n}'de ${t.n} vadeli hesap açtın: ${fmt(a)}, yıllık %${Math.round(bRate(bk,t,a)*100)}.`,'good')}

    {t:'Kapat',fn:()=>{}}]})};

/* ============ Mafya savaşı haritası: tarafsız semtler ============ */
const NEUTRAL=['Beşiktaş','Fatih','Üsküdar','Ataşehir','Beykoz','Sarıyer','Şişli','Bakırköy','Zeytinburnu','Ümraniye','Maltepe','Pendik'];
function semtS(d){S.semt=S.semt||{};if(!S.semt[d]){const i=NEUTRAL.indexOf(d);S.semt[d]={pow:R(25,55)+i*2,gang:pick(['Delikanlılar','Kıvırcıklar','Topçular','Kara Murat\'ın çocukları','Sarı Kemal\'in adamları','Gece Kuşları','Tayfa','Çarşı Ağaları'])}}return S.semt[d]}
function myTurf(d){return S.org&&S.org.turf.find(v=>v.dist===d)}
ACT.semt=d=>{if(!S.org){toast('Semt ele geçirmek için önce kendi aileni kur (Hayat → Kendi ailen).');return}closeSheet();const v=myTurf(d);
  if(v){const def=v.def||0,up=Math.round(1.5e6*S.cpi*(def+1)),inv=Math.round(v.inc*1.2);
    return queue({back:'harita',title:d,text:`Senin semtin. Yıllık haraç geliri ${fmt(v.inc)}. Savunma seviyesi ${def}/3. Rakipler savunması zayıf semtlere saldırır.`,choices:[
      ...(def<3?[{t:'🛡 Savunmayı güçlendir',sub:`${fmt(up)} · Baskın riski −%25`,dis:!canPay(up),fn:()=>{pay(up);v.def=def+1;log(`${d} savunması güçlendi: ${v.def}/3.`,'good')}}]:[]),
      {t:'💼 Semte yatırım yap',sub:`${fmt(inv)} · Gelir +%25`,dis:!canPay(inv),fn:()=>{pay(inv);v.inc=Math.round(v.inc*1.25);log(`${d}'e yatırım yaptın. Yeni gelir ${fmt(v.inc)}/yıl.`,'good')}},
      {t:'Semti bırak',fn:()=>{S.org.turf=S.org.turf.filter(x=>x!==v);add('respect',-6);log(`${d}'ten çekildin.`,'bad')}},{t:'Kapat',fn:()=>{}}]})}
  const s=semtS(d);const p=battleP(s.pow);const c=Math.round(s.pow*25000*S.cpi);const inc=Math.round((300000+s.pow*9000)*S.cpi);
  queue({back:'harita',title:d,text:`Tarafsız semt. ${s.gang} tutuyor (güç ${s.pow}). Ele geçirirsen yıllık ~${fmt(inc)} haraç.${S.org.intel===QS()?'':' Keşif yaparsan şansın artar.'}`,
    prem:{t:'Dayının adamları semti teslim alsın',sub:'Kayıpsız',fn:()=>{takeSemt(d,inc)}},
    choices:[{t:'⚔️ Semte gir',sub:`${fmt(c)} · Şans %${Math.round(p*100)}`,dis:!canPay(c),fn:()=>{pay(c);if(ch(p)){takeSemt(d,inc);add('heat',8)}else{casualties(1);s.pow+=5;add('heat',10);log(`${d} baskını püskürtüldü. ${s.gang} daha da bilendi.`,'bad')}}},
      {t:'🤝 Mahalle çetesini satın al',sub:`${fmt(c*3)} · Kesin, kansız`,dis:!canPay(c*3),fn:()=>{pay(c*3);takeSemt(d,inc)}},
      {t:'Vazgeç',fn:()=>{}}]})};
function takeSemt(d,inc){S.org.turf.push({id:'semt'+R(0,99999),n:d+' haracı',dist:d,inc,def:0});S.stats.venues++;gainResp(8);delete S.semt[d];log(`${d} artık ${S.org.name}'in! Yıllık ${fmt(inc)} haraç.`,'gold');news(`${S.org.name} ${d}'te kontrolü ele geçirdi`,2)}
function semtQuarter(){if(!S.org||S.jail)return;const wars=S.rivals.filter(r=>r.war&&!r.dead);
  S.org.turf.filter(v=>v.dist&&NEUTRAL.includes(v.dist)).forEach(v=>{const p=(.035+wars.length*.025)*(1-(v.def||0)*.25);if(!ch(p))return;const r=wars.length?pick(wars):RVX();
    if(ch(battleP(r.pow*.7,(v.def||0)*.08))){gainResp(4);r.pow=Math.max(10,r.pow-4);log(`${r.n} ${v.dist}'e saldırdı, adamların püskürttü.`,'good')}
    else{S.org.turf=S.org.turf.filter(x=>x!==v);casualties(1);log(`${r.n} ${v.dist}'i elinden aldı!`,'bad');news(`${r.n} ${v.dist}'e çöktü`,2)}})}

/* ============ Kaçakçılık rotaları ============ */
const GATES=[{id:'kapikule',n:'Kapıkule',c:'Bulgaristan',ic:'🚛',risk:.15},{id:'sarp',n:'Sarp',c:'Gürcistan',ic:'🚛',risk:.11},{id:'kapikoy',n:'Kapıköy',c:'İran',ic:'🐫',risk:.16},{id:'habur',n:'Habur',c:'Irak',ic:'🚛',risk:.19},{id:'cilvegozu',n:'Cilvegözü',c:'Suriye',ic:'🚚',risk:.24},{id:'ege',n:'Ege adaları',c:'Yunanistan · sürat teknesi',ic:'🚤',risk:.2},{id:'mersin',n:'Mersin limanı',c:'Konteyner gemisi',ic:'🚢',risk:.13}];
const GOODS=[{id:'sigara',n:'Kaçak sigara',m:1,h:2},{id:'yakit',n:'Akaryakıt',m:1.3,h:3},{id:'elek',n:'Telefon ve elektronik',m:1.7,h:3},{id:'antika',n:'Tarihi eser',m:2.4,h:6},{id:'silah',n:'Silah',m:3.2,h:9},{id:'uyus',n:'Uyuşturucu',m:4.2,h:13}];
const BRIBES=[['gumruk','Gümrük memuru',.3,150000],['jandarma','Jandarma komutanı',.25,120000],['emniyet','Narkotik/kaçakçılık şubesi',.2,100000]];
const GT=id=>GATES.find(g=>g.id===id),GD=id=>GOODS.find(g=>g.id===id);
function rRisk(r){const g=GT(r.gate),d=GD(r.good);let k=1;BRIBES.forEach(([b,,red])=>{if(r.br[b])k-=red});return clamp(g.risk*(.6+d.h/12)*Math.max(.15,k)*(1+r.trucks*.04)*(S.heat>60?1.3:1),.02,.8)}
function rInc(r){return Math.round(380000*S.cpi*GD(r.good).m*r.trucks)}
function rBribe(r){return Math.round(BRIBES.reduce((t,[b,,,c])=>t+(r.br[b]?c:0),0)*S.cpi*(1+r.trucks*.1))}
ACT.ropen=()=>{if(S.age<18||S.jail)return;closeSheet();queue({back:'kacak',title:'Yeni rota: sınır kapısı',text:'Hangi kapıdan geçeceksin?',choices:[...GATES.filter(g=>!(S.routes||[]).some(r=>r.gate===g.id)).map(g=>({t:`${g.ic} ${g.n}`,sub:`${g.c} · Temel risk %${Math.round(g.risk*100)}`,fn:()=>setTimeout(()=>ropen2(g.id),40)})),{t:'Vazgeç',fn:()=>{}}]})};
function ropen2(gid){queue({back:'kacak',title:GT(gid).n+' · Ne taşınacak?',text:'Değerli mal çok kazandırır ama yakalanırsan ceza ağır ve dikkat çok artar.',choices:[...GOODS.map(d=>{const c=Math.round(1.2e6*S.cpi*(1+d.m/2));return{t:d.n,sub:`Kurulum ${fmtS(c)} · Tır başına ~${fmtS(380000*S.cpi*d.m)}/çeyrek`,dis:!canPay(c)||(d.id==='uyus'&&rank()<3)||(d.id==='silah'&&rank()<2),fn:()=>{pay(c);S.routes=S.routes||[];S.routes.push({id:'r'+R(0,99999),gate:gid,good:d.id,trucks:1,br:{},on:true,tot:0,trips:0,bust:0});log(`${GT(gid).n} hattı kuruldu: ${d.n}. İlk tır yola çıkmaya hazır.`,'gold')}}}),{t:'Vazgeç',fn:()=>{}}]})}
ACT.route=id=>{const r=(S.routes||[]).find(x=>x.id===id);if(!r)return;closeSheet();const g=GT(r.gate),d=GD(r.good),tc=Math.round(6e5*S.cpi);
  queue({back:'kacak',title:`${g.ic} ${g.n} · ${d.n}`,text:`${r.trucks} araç · Çeyreklik tahmini ${fmt(rInc(r))} · Yakalanma riski %${Math.round(rRisk(r)*100)} · Rüşvet ${fmt(rBribe(r))}/çeyrek<br>Toplam ${fmt(r.tot)} kazandırdı, ${r.trips} sefer, ${r.bust} baskın.`,
    prem:{t:'Dayının bakanlıktaki adamı',sub:'Bu hat bir yıl risksiz',fn:()=>{r.safe=QS()+4;log(`${g.n} hattı bir yıl boyunca dokunulmaz.`,'gold')}},
    choices:[{t:r.on?'⏸ Seferleri durdur':'▶️ Seferleri başlat',fn:()=>{r.on=!r.on}},
      ...(r.trucks<10?[{t:'➕ Araç ekle',sub:`${fmt(tc)} · Gelir ve risk artar`,dis:!canPay(tc),fn:()=>{pay(tc);r.trucks++;log(`${g.n} hattına bir araç daha eklendi (${r.trucks}).`,'good')}}]:[]),
      ...BRIBES.map(([b,n,red,c])=>({t:r.br[b]?`✓ ${n} bizden`:`💰 ${n}'nu satın al`,sub:r.br[b]?'Bırakmak için dokun':`${fmtS(c*S.cpi)}/çeyrek · Risk −%${Math.round(red*100)}`,fn:()=>{r.br[b]=!r.br[b];log(r.br[b]?`${g.n}'da ${n.toLowerCase()} artık maaşlı adamın.`:`${n} ile anlaşmayı bitirdin.`,'dim')}})),
      {t:'Hattı kapat',fn:()=>{S.routes=S.routes.filter(x=>x!==r);log(`${g.n} hattı kapandı.`,'dim')}},{t:'Kapat',fn:()=>{}}]})};
function routesQuarter(){if(!S.routes||!S.routes.length)return;let tot=0;
  S.routes.forEach(r=>{if(!r.on)return;const g=GT(r.gate),d=GD(r.good);const br=rBribe(r);if(br){fund(br);S.money=Math.max(0,S.money-br)}
    if(S.jail&&!S.org){return}
    const safe=r.safe&&r.safe>QS();
    if(!safe&&ch(rRisk(r))){r.bust++;const lost=Math.min(r.trucks,R(1,2));r.trucks=Math.max(1,r.trucks-lost);add('heat',d.h*2);log(`🚨 ${g.n} baskını! ${d.n} yüküne el konuldu, ${lost} araç gitti.`,'bad');news(`${g.n}'da dev ${d.n.toLowerCase()} operasyonu`,d.h>=9?3:2);
      if(!S.jail&&ch(.06+d.h/100)){later('kacakarrest',0,{g:g.n,d:d.n})}}
    else{const m=Math.round(rInc(r)*R(80,125)/100);r.tot+=m;r.trips++;S.rtTrips=(S.rtTrips||0)+1;tot+=m;add('heat',Math.round(d.h/3))}});
  if(tot)log(`🚚 Kaçakçılık seferleri bu çeyrek ${fmt(tot)} getirdi.`,'gold');S.money+=tot}
LATER.kacakarrest=d=>({title:'Şoför konuştu',text:`${d.g} baskınında yakalanan şoför ifadesinde senin adını verdi.`,prem:{t:'Dayının avukatı',sub:'İfade geri çekilir',fn:()=>{add('heat',-10);log('Şoför ifadesini geri çekti. "Baskı altında konuştum" dedi.','gold')}},choices:[
  {t:'Şoförün ailesine para gönder',sub:fmt(Math.round(5e5*S.cpi))+' · %70 ifadeyi değiştirir',dis:!canPay(Math.round(5e5*S.cpi)),fn:()=>{pay(Math.round(5e5*S.cpi));if(ch(.7))log('Şoför ifadesini değiştirdi.','good');else arrest(d.d+' kaçakçılığı',[3,8])}},
  {t:'Ortadan kaybol',sub:'Saygı −',fn:()=>{add('respect',-5);add('heat',10);log('Bir süre yurt dışında kaldın.','dim')}},
  {t:'Teslim ol',fn:()=>arrest(d.d+' kaçakçılığı',[3,8])}]});
EXTRA.kacak=()=>{let h='<p class="note">Sınır kapılarından kendi kaçakçılık hattını kur. Her çeyrek araçların sefere çıkar. Gümrükçü, jandarma ve şube rüşvet ağı riski düşürür. Değerli mal çok kazandırır ama yakalanırsan dikkat ve ceza ağır.</p>';
  const rs=S.routes||[];
  if(rs.length){const t=rs.filter(r=>r.on).reduce((s,r)=>s+rInc(r),0);h+=`<div class="card" style="padding:12px;margin-bottom:10px"><b>🚚 ${rs.length} hat · ${rs.reduce((s,r)=>s+r.trucks,0)} araç</b><div class="note" style="margin:4px 0 0">Çeyreklik tahmini gelir ${fmtS(t)} · Rüşvet ${fmtS(rs.reduce((s,r)=>s+rBribe(r),0))}</div></div>`}
  rs.forEach(r=>{const g=GT(r.gate),d=GD(r.good),rk=rRisk(r);h+=`<button class="row" data-x="route:${r.id}"><span class="ic">${g.ic}</span><span class="tx"><b>${g.n} · ${d.n}</b><span>${r.on?'Aktif':'Durdu'} · ${r.trucks} araç · ${fmtS(rInc(r))}/çeyrek</span><span class="risk ${rk<.1?'r1':rk<.2?'r2':'r3'}">Risk %${Math.round(rk*100)}${r.safe&&r.safe>QS()?' · Dokunulmaz':''}</span></span><span class="rt">›</span></button>`});
  if(rs.length<GATES.length)h+=row('data-x="ropen:"','➕','Yeni hat kur',`${GATES.length-rs.length} kapı boşta`,'',S.age<18||!!S.jail);
  return['Kaçakçılık rotaları',h]};

/* ============ Haftalık görevler ve başarım ödülleri ============ */
const wkKey=()=>Math.floor((Date.now()/864e5+3)/7);
function wkM(){return{q:S.age*4+(S.q||0),nw:netWorth(),resp:S.respect,fr:S.friends.length,turf:S.org?S.org.turf.length:0,cr:S.stats.crimes||0,gal:S.gal?S.gal.sold:0,rt:S.rtTrips||0}}
const WKT=[
  ['q',n=>`${n} çeyrek ilerle`,()=>pick([8,12,16]),()=>true],
  ['nw',n=>`Servetine ${fmtS(n)} ekle`,b=>Math.round(Math.max(1e6*S.cpi,b.nw*.15)/1e5)*1e5,()=>true],
  ['fr',n=>`${n} yeni dost edin`,()=>pick([2,3]),()=>S.friends.length<MAXF-3],
  ['cr',n=>`${n} iş çevir (İşler)`,()=>pick([5,8,12]),()=>S.age>=14],
  ['turf',n=>`${n} semt ya da mekân ele geçir`,()=>1,()=>!!S.org],
  ['gal',n=>`Galeride ${n} araç sat`,()=>pick([2,3]),()=>!!S.gal],
  ['rt',n=>`${n} başarılı kaçakçılık seferi`,()=>pick([3,5]),()=>(S.routes||[]).length>0],
  ['resp',n=>`${n} saygı kazan`,()=>pick([8,12]),()=>S.respect<85]];
function wkEnsure(){if(!S)return;if(S.wk&&S.wk.key===wkKey())return;const b=wkM();const pool=WKT.filter(t=>t[3]());const pickd=[];while(pickd.length<3&&pool.length){pickd.push(pool.splice(R(0,pool.length-1),1)[0])}
  S.wk={key:wkKey(),base:b,chest:false,goals:pickd.map(([k,,tg])=>{const n=tg(b);return{k,n,done:false,got:false}})}}
function wkProg(g){const now=wkM();return Math.max(0,now[g.k]-S.wk.base[g.k])}
function wkRew(){return Math.round(Math.max(3e5*S.cpi,Math.min(netWorth()*.06,2e8))/1e4)*1e4}
function wkCheck(){if(!S||!S.wk)return;S.wk.goals.forEach(g=>{if(!g.done&&wkProg(g)>=g.n){g.done=true;log(`🎯 Haftalık görev tamamlandı: ${WKT.find(t=>t[0]===g.k)[1](g.k==='nw'?g.n:g.n)}. Ödülünü al!`,'gold');toast('🎯 Görev tamamlandı')}})}
ACT.wkclaim=i=>{const g=S.wk.goals[+i];if(!g||!g.done||g.got)return;g.got=true;const m=wkRew();S.money+=m;gainResp(3);log(`🎁 Görev ödülü: ${fmt(m)} ve saygı.`,'gold');done()};
ACT.wkchest=()=>{if(S.wk.chest||!S.wk.goals.every(g=>g.got))return;S.wk.chest=true;const m=wkRew()*3;S.money+=m;S.kb=(S.kb||0)+2;add('happy',10);log(`💎 Haftalık sandık açıldı: ${fmt(m)} ve kalıcı +2 karizma!`,'gold');done()};
EXTRA.gorev=()=>{wkEnsure();const w=S.wk;const left=7-Math.floor((Date.now()/864e5+3)%7);let h=`<p class="note">Her pazartesi 3 yeni görev gelir. Hepsini bitirirsen haftalık sandık açılır. Yenilenmeye ${left} gün.</p>`;
  w.goals.forEach((g,i)=>{const t=WKT.find(x=>x[0]===g.k);const p=Math.min(g.n,wkProg(g));const pct=Math.round(p/g.n*100);

const PTRAITS=[['mut','😊','Mutluluk'],['guz','✨','Güzellik'],['zek','🧠','Zeka'],['kar','😎','Karizma'],['sad','🤝','Sadakat'],['say','🎩','Saygınlık'],['cur','🔥','Cesaret']];

function trOf(o){if(!o.tr){o.tr={};PTRAITS.forEach(([k])=>o.tr[k]=R(25,85));if(o.loy!==undefined)o.tr.sad=clamp(o.loy);if(o.fame!==undefined)o.tr.say=clamp(o.fame);if(o.str!==undefined)o.tr.cur=clamp(o.str*10);o.huy=pick(HUYS)}return o}
function trBars(o){trOf(o);return `<span style="display:block;margin:8px 0 2px">Huyu: <b style="color:var(--gold)">${o.huy}</b></span>`+PTRAITS.map(([k,ic,n])=>`<span style="display:flex;align-items:center;gap:8px;font-size:13px;margin-top:6px"><span style="width:96px;flex:none">${ic} ${n}</span><span style="flex:1;height:6px;border-radius:3px;background:#ffffff1a;overflow:hidden;display:block"><span style="display:block;height:100%;width:${o.tr[k]}%;background:var(--gold)"></span></span><b style="width:28px;text-align:right">${o.tr[k]}</b></span>`).join('')}
function pFind(t,id){if(t==='f')return S.friends.find(x=>x.id===id);if(t==='k')return S.kids.find(x=>x.id===id);
  if(t==='a')return S.artists.find(x=>x.id===id)||(S.label&&S.label.roster.find(x=>x.id===id));if(t==='m')return S.org&&S.org.members.find(x=>x.id===id);
  if(t==='p'){if(!S.partner)return null;if(!S.ptr||S.ptr.name!==S.partner)S.ptr={id:'p',name:S.partner};return S.ptr}}
function trSync(t,o){if(t==='m'){o.loy=o.tr.sad;o.str=Math.max(1,Math.round(o.tr.cur/10))}if(t==='a'){o.fame=Math.max(o.fame,Math.round(o.fame*.7+o.tr.say*.3))}if(t==='p'&&S.prel!==undefined&&S.prel!==null)S.prel=clamp(Math.round((S.prel+o.tr.sad)/2))}
function pCard(t,id,back){const o=pFind(t,id);if(!o)return;trOf(o);
  const isFr=t==='a'&&S.friends.some(f=>f.art===o.id);
  queue({back,title:o.name,text:(o.fame!==undefined?`Ün %${o.fame}${o.pot?' · Potansiyel %'+o.pot:''}<br>`:'')+'Özellikleri'+trBars(o),choices:[
    {t:'👑 Dayı modu: düzenle',sub:S.premium?'Özellikleri ve huyu dilediğin gibi ayarla':'Dayı Paketi açıkken kullanılır',dis:!S.premium,pr:true,fn:()=>setTimeout(()=>pEdit(t,id,back),40)},
    ...(t==='a'?[{t:isFr?'Zaten dostun':'Dost ol',sub:isFr?'':`Dostların ${S.friends.length}/${MAXF}`,dis:isFr||S.friends.length>=MAXF,fn:()=>{S.friends.push({id:'fa'+R(0,99999),name:o.name,job:'sanatci',rel:R(55,75),art:o.id,tr:o.tr,huy:o.huy});log(`${o.name} ile dost oldunuz.`,'good')}}]:[]),
    {t:'Kapat',fn:()=>{}}]})}
function pEdit(t,id,back){const o=pFind(t,id);if(!o)return;
  queue({back,title:'👑 '+o.name,text:'Hangi özelliği ayarlıyorsun?'+trBars(o),choices:[...PTRAITS.map(([k,ic,n])=>({t:`${ic} ${n}`,sub:`Şu an ${o.tr[k]}`,fn:()=>setTimeout(()=>pSet(t,id,back,k),40)})),
    {t:'🎭 Huyunu değiştir',sub:o.huy,fn:()=>setTimeout(()=>queue({back,title:'Huy seç',text:o.name,choices:HUYS.map(h=>({t:h,fn:()=>{o.huy=h;setTimeout(()=>pEdit(t,id,back),40)}}))}),40)},
    {t:'⭐ Hepsini 100 yap',sub:t==='a'?'Ün de %100 olur':'',fn:()=>{PTRAITS.forEach(([k])=>o.tr[k]=100);if(t==='a'){o.fame=100;o.pot=100}trSync(t,o);setTimeout(()=>pEdit(t,id,back),40)}},
    ...(t==='a'?[{t:'🌟 Ün',sub:`Şu an %${o.fame}`,fn:()=>setTimeout(()=>queue({back,title:'Ün',text:o.name,choices:[10,30,50,70,85,100].map(v=>({t:'%'+v,fn:()=>{o.fame=v;setTimeout(()=>pEdit(t,id,back),40)}}))}),40)},{t:'💿 Potansiyel',sub:`Şu an %${o.pot||o.fame}`,fn:()=>setTimeout(()=>queue({back,title:'Potansiyel',text:o.name,choices:[50,70,85,100].map(v=>({t:'%'+v,fn:()=>{o.pot=v;setTimeout(()=>pEdit(t,id,back),40)}}))}),40)}]:[]),
    ...(t==='m'?[{t:'💛 Sadakat ve güç tam',fn:()=>{o.tr.sad=100;o.tr.cur=100;trSync(t,o);setTimeout(()=>pEdit(t,id,back),40)}}]:[]),
    ...(t==='f'||t==='k'?[{t:'💛 Yakınlığı %100 yap',fn:()=>{o.rel=100;setTimeout(()=>pEdit(t,id,back),40)}}]:[]),
    {t:'Bitti',fn:()=>{}}]})}
function pSet(t,id,back,k){const o=pFind(t,id);const n=PTRAITS.find(x=>x[0]===k)[2];
  queue({back,title:n,text:`${o.name} · şu an ${o.tr[k]}. Yeni değer:`,choices:[0,20,40,60,80,100].map(v=>({t:String(v),fn:()=>{o.tr[k]=v;trSync(t,o);setTimeout(()=>pEdit(t,id,back),40)}}))})}
const SELF=[['health','❤️','Sağlık'],['happy','😊','Mutluluk'],['respect','🎩','Saygı'],['heat','🚨','Polis dikkati'],['fame','🌟','Ün'],['kb','😎','Karizma bonusu'],['guz','✨','Güzellik'],['zek','🧠','Zeka']];

          h+=row(`data-c="${c.id}"`,c.ic,c.n,d+(lockA||lockR?'':'<br>'+riskTag(failP(c))),lockA||lockR?'🔒':fmtS(c.m[1]),lockA||lockR)});
      }else h+='<p class="note">Suç dünyası 14 yaşında açılır. Şimdilik çocukluğunu yaşa.</p>';

      if(S.age>=14)h+='<div class="sec">Sokak</div>'+row('data-x="dovus:"','👊','Sokak dövüşü',S.mgOff?'Saygı + · Risk':'Mini oyun · Saygı +','',false);

    }
  }
  if(k==='varlik'){

    const jv=S.jewels.reduce((s,j)=>s+j.val,0);
    h+=`<p class="note">Net servet: <b style="color:var(--gold)">${fmt(netWorth())}</b></p><p class="note">Mülk geliri: <b style="color:var(--good)">${fmtS(propIncome())}/yıl</b> · Araba: <b>${S.cars.length}</b> · Mücevher değeri: <b style="color:var(--gold)">${fmtS(jv)}</b></p>`;
    h+='<div class="tabs">'+[['mulk','İşletmeler'],['ev','Evler'],['araba','Arabalar'],['mucevher','Mücevherler']].map(([id,n])=>`<button class="tab ${vTab===id?'on':''}" data-vt="${id}">${n}</button>`).join('')+'</div>';
    if(S.jail)h+='<p class="note">Cezaevindeyken alışveriş yapamazsın. Mülklerin adamların tarafından işletiliyor.</p>';
    if(vTab==='mulk'){
      h+='<p class="note">Her işletme kara paranı aklar ve polis dikkatini her yıl azaltır.</p>';
      if(S.age<18)h+='<p class="note">Mülk almak için 18 yaşını beklemelisin.</p>';
      PROPS.forEach(p=>{const own=S.props.includes(p.id);const lock=p.rank&&rank()<p.rank;
        const d=own?`Sende · Yıllık ${fmtS(p.inc)}`:lock?`${RANKS[p.rank].n} rütbesi gerekir`:(p.inc?`Yıllık ${fmtS(p.inc)} gelir`:'Mutluluk her yıl artar');
        h+=row(own?`data-pm="${p.id}"`:`data-pb="${p.id}"`,p.ic,p.n,d,own?'Sende ›':(lock?'🔒':fmtS(p.p)),!own&&(lock||S.age<18||!canPay(p.p)||S.jail))});

function checkDeath(ny){
  if(!S.alive)return;
  if(S.health<=0){const cause=S.cause||S.hurtCause||'Sağlık sorunları';
    if(S.premium&&!S.dying){S.dying=true;S.health=1;S.cause=null;queue({title:'Ölümün eşiğindesin',text:`${cause}. Gözlerin kararıyor...`,prem:{t:'Dayının özel hastanesi',sub:'Hayata dön · Sağlık %80',fn:()=>{S.dying=false;S.health=80;log('Dayının özel hastanesinde gözlerini açtın. Ölümden döndün.','gold')}},choices:[{t:'Gözlerini kapat',fn:()=>{S.dying='accept';S.health=0;S.cause=cause}}]});return}
    die(cause);return}
  if(ny&&S.age>=70&&S.age>=(S.extend||0)&&ch((S.age-68)*.035)){
    if(S.premium&&!S.dying){S.dying=true;queue({title:'Son nefes',text:'Yaşlı bedenin artık yorgun. Doktorlar ailene hazırlıklı olmasını söylüyor.',prem:{t:'Dayının İsviçre kliniği',sub:'10 yıl daha · Sağlık %90',fn:()=>{S.dying=false;S.extend=S.age+10;S.health=90;log('İsviçre\'deki klinikten on yaş gençleşmiş döndün.','gold')}},choices:[{t:'Huzurla veda et',fn:()=>{S.dying='accept';S.health=0;S.cause='Yaşlılık. Yatağında, huzur içinde.'}}]});return}
    die('Yaşlılık. Yatağında, huzur içinde.')}
}

let BOT=0,BOTIO=0,BOTMAN=null;
try{const v=localStorage.getItem('mafya-bot');if(v!==null)BOTMAN=+v}catch(e){}
function botAuto(){let h=BOTIO;try{const inFrame=window.self!==window.top;const sh=Math.max(screen.height,screen.width)===screen.height?screen.height:screen.width;
  if(inFrame&&innerHeight<innerWidth*3&&innerHeight>=sh-40&&innerHeight>innerWidth)h=Math.max(h,Math.round(innerHeight-(sh-92)))}catch(e){}return Math.max(0,h)}
function layout(){BOT=BOTMAN!==null?BOTMAN:botAuto();const r=document.documentElement.style;r.setProperty('--th',$('hdr').offsetHeight+'px');r.setProperty('--bot',BOT+'px');r.setProperty('--bh',($('ftr').offsetHeight+BOT)+'px')}

(function(){try{const sen=document.createElement('div');sen.style.cssText='position:fixed;left:0;top:0;width:1px;height:100%;pointer-events:none;opacity:0';document.body.appendChild(sen);
  const th=[];for(let i=0;i<=100;i++)th.push(i/100);
  new IntersectionObserver(es=>{const e=es[es.length-1];const full=e.boundingClientRect.height;if(!full)return;
    const visBottom=e.intersectionRect.height>0?e.intersectionRect.bottom:full;const hidden=Math.max(0,Math.round(full-visBottom));
    const nb=hidden>4&&hidden<full*.5?hidden:0;if(nb!==BOTIO){BOTIO=nb;layout()}},{threshold:th}).observe(sen)}catch(e){}})();
try{new ResizeObserver(layout).observe($('hdr'));new ResizeObserver(layout).observe($('ftr'))}catch(e){}

let draft,cTab='hair';
function showCreate(slot){
  draft={slot:slot||null,origin:'istanbul',fam:'orta',first:pick(NAMES),last:pick(SURN),look:{skin:R(0,3),hair:pick(['kisa','geriye','yan','kivircik']),hairColor:pick(['siyah','kahve','kumral']),beard:pick(['yok','kirli','biyik']),outfit:'tisort',acc:[]}};
  drawCreate();$('create').classList.add('on');
}
function drawCreate(){
  const L=draft.look;
  const tabs=[['memleket','Memleket'],['aile','Aile'],['skin','Ten'],['hair','Saç'],['hairColor','Saç rengi'],['beard','Sakal']];
  let opts='';
  if(cTab==='memleket')opts=Object.entries(ORIGINS).map(([k,o])=>`<button class="row" data-og="${k}" style="${draft.origin===k?'border-color:var(--gold)':''}"><span class="tx"><b>${o.n}${draft.origin===k?' ✓':''}</b><span>${o.m} · ${o.b}</span></span></button>`).join('');
  else if(cTab==='aile')opts=Object.entries(FAMBG).map(([k,o])=>`<button class="row" data-fb="${k}" style="${draft.fam===k?'border-color:var(--gold)':''}"><span class="tx"><b>${o.n}${draft.fam===k?' ✓':''}</b><span>${o.b}</span></span></button>`).join('');
  else if(cTab==='skin')opts='<div class="sw">'+SKINS.map((c,i)=>`<button data-s="${i}" class="${L.skin===i?'on':''}" style="background:${c}" aria-label="Ten ${i+1}"></button>`).join('')+'</div>';
  else if(cTab==='hairColor')opts='<div class="sw">'+Object.keys(HCOL).map(c=>`<button data-hc="${c}" class="${L.hairColor===c?'on':''}" style="background:${HCOL[c]}" aria-label="${HCOL_N[c]}"></button>`).join('')+'</div>';
  else opts='<div class="grid">'+WARD[cTab].map(it=>{const l={...L,[cTab]:it.id};return `<button class="it ${L[cTab]===it.id?'on':''}" data-o="${cTab}:${it.id}"><div class="av">${avatarSVG(l,30)}</div><b>${it.n}</b></button>`}).join('')+'</div>';
  $('createIn').innerHTML=`<div class="logo">Mafia <span>Life</span></div><p class="tag">Sokaktan tahta bir ömür</p>
    <div class="av bigav">${avatarSVG(L,30)}</div>
    <div class="names"><input id="fn" value="${draft.first}" maxlength="14" aria-label="Ad"><input id="ln" value="${draft.last}" maxlength="14" aria-label="Soyad"><button class="dice" id="rnd" aria-label="Rastgele">🎲</button></div>
    <div class="tabs">${tabs.map(([id,n])=>`<button class="tab ${cTab===id?'on':''}" data-ct="${id}">${n}</button>`).join('')}</div>
    ${opts}
    <p class="note" style="margin-top:12px">Önizleme yetişkin halini gösterir. Sakal ve aksesuarlar 16 yaşından sonra görünür; kıyafetleri oyunda para kazandıkça alırsın.</p>
    <button class="btn" id="start">Hayata başla</button>`;
}
$('createIn').addEventListener('input',e=>{if(e.target.id==='fn')draft.first=e.target.value;if(e.target.id==='ln')draft.last=e.target.value});
$('createIn').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.ct)cTab=d.ct;
  else if(d.s!==undefined)draft.look.skin=+d.s;
  else if(d.hc)draft.look.hairColor=d.hc;
  else if(d.o){const[c,id]=d.o.split(':');draft.look[c]=id}
  else if(d.og)draft.origin=d.og;
  else if(d.fb)draft.fam=d.fb;
  else if(b.id==='rnd'){const l=draft.look;draft.first=pick(NAMES);draft.last=pick(SURN);l.skin=R(0,4);l.hair=pick(WARD.hair).id;l.hairColor=pick(Object.keys(HCOL).slice(0,5));l.beard=pick(WARD.beard).id}
  else if(b.id==='start'){
    const f=(draft.first||'').trim()||pick(NAMES),l=(draft.last||'').trim()||pick(SURN);
    UNDO.length=0;newLife(f,l,draft.look,draft.origin,draft.fam);S.slot=draft.slot;cloudSave(true);$('create').classList.remove('on');render();scrollLog();return;
  }else return;
  drawCreate();
});

(function(){
  const SCROLLERS='#log,.sh-b,.full,.card,.tabs';
  function scroller(el){while(el&&el!==document.body){if(el.matches&&el.matches(SCROLLERS))return el;el=el.parentElement}return null}
  document.addEventListener('touchstart',e=>{const sc=scroller(e.target);if(!sc)return;
    if(sc.classList.contains('tabs'))return;
    const max=sc.scrollHeight-sc.clientHeight;if(max<=0)return;
    if(sc.scrollTop<=0)sc.scrollTop=1;else if(sc.scrollTop>=max)sc.scrollTop=max-1},{passive:true});
  document.addEventListener('touchmove',e=>{const sc=scroller(e.target);
    if(!sc){e.preventDefault();return}
    if(sc.classList.contains('tabs'))return;
    if(sc.scrollHeight<=sc.clientHeight+1)e.preventDefault()},{passive:false});
  // ekran yüksekliğini gerçek görünür alana kilitle
  function vh(){const h=(window.visualViewport?window.visualViewport.height:window.innerHeight);document.documentElement.style.setProperty('--vh',h+'px');if(typeof layout==='function')layout()}
  vh();window.addEventListener('resize',vh);if(window.visualViewport)window.visualViewport.addEventListener('resize',vh);
  window.addEventListener('scroll',()=>{if(window.scrollY)window.scrollTo(0,0)});
})();

<path d="M20 220 L27 142 Q33 113 63 105 L87 98 L100 138 L113 98 L137 105 Q167 113 173 142 L180 220Z" fill="#0b0908"/>
<path d="M63 105 L87 98 L95 124 L80 150 L72 120Z M137 105 L113 98 L105 124 L120 150 L128 120Z" fill="#17120f"/>
<path d="M88 97 L100 136 L112 97 L106 95 L100 108 L94 95Z" fill="#c9bea8"/><path d="M97.4 103 L102.6 103 L103.8 132 L100 138 L96.2 132Z" fill="#0b0908"/>
<path d="M87 88 L87 101 L100 106 L113 101 L113 88Z" fill="#100c0a"/>
<path d="M74 55 Q73 86 100 94 Q127 86 126 55Z" fill="#130f0c"/><path d="M76 60 Q77 82 90 90" stroke="#6b5a45" stroke-width="1.6" fill="none" opacity=".55"/>
<path d="M68 57 Q63 40 84 34 Q104 29 124 33 Q141 37 139 52 Q146 55 142 60 Q100 52 60 62 Q57 58 68 57Z" fill="#1c1814"/><path d="M60 62 Q100 52 142 60 Q136 67 100 64 Q64 69 60 62Z" fill="#0d0b09"/><circle cx="104" cy="32.6" r="2.2" fill="#2a241e"/><path d="M72 46 Q100 36 132 42 M78 40 Q100 33 126 36" stroke="#3a3128" stroke-width="1" fill="none"/>
<path d="M68 57 Q63 40 84 34 M27 142 Q33 113 63 105" stroke="#a08866" stroke-width="1.2" fill="none" opacity=".45"/>
<g filter="url(#slb)" opacity=".55"><ellipse cx="50" cy="205" rx="60" ry="16" fill="#cfc6b6"/><ellipse cx="150" cy="200" rx="55" ry="14" fill="#cfc6b6"/><ellipse cx="100" cy="214" rx="80" ry="12" fill="#e2dccf"/></g><rect y="170" width="200" height="50" fill="url(#slf)" opacity=".5"/>
${txt?`<text x="100" y="236" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="700" font-size="25" letter-spacing="3" fill="#efe6d4">MAFIA LIFE</text><text x="100" y="249" text-anchor="middle" font-family="Georgia,serif" font-size="10.5" letter-spacing="7.5" fill="#c9a24a">SIMULATOR</text>`:''}</svg>`;
function showTitle(){$('title').classList.add('on');drawTitle()}
function hideTitle(){$('title').classList.remove('on')}
function drawTitle(){const P=PENDING;const cont=P&&(P.alive||(P.kids&&P.kids.length));
  let h=`<img src="${LOGO}" alt="Mafia Life Simulator" style="display:block;width:min(240px,64vw);aspect-ratio:1;margin:4px auto 0;filter:drop-shadow(0 8px 24px #000c)"><p class="tag" style="margin-top:12px">Sokaktan tahta bir ömür</p>`;
  if(cont)h+=`<button class="btn" id="tCont">Devam et · ${P.first} ${P.last}, ${P.age} yaş</button>`;
  h+='<div class="sec" style="margin-top:22px">Kayıt yuvaları</div><p class="note">Her yuvada ayrı bir oyun. Oynadığın yuva otomatik kaydedilir.</p>';
  ['slot1','slot2','slot3'].forEach((k,i)=>{const sl=SLOTS[k];h+=`<div class="slot"><button class="row" data-ts="${k}"><span class="ic">${sl?'💾':'➕'}</span><span class="tx"><b>${sl?sl.name:'Boş yuva '+(i+1)}</b><span>${sl?`${sl.age} yaş · ${sl.rank} · ${ago(sl.at)}${sl.alive?'':' · vefat etti'}`:'Yeni oyun başlat'}</span></span><span class="rt">${sl?'Yükle':'Yeni oyun'}</span></button>${sl?`<button class="tab" data-td="${k}">Sil</button>`:''}</div>`});
  h+=`<div class="sec">Tema</div><div class="themes">${Object.entries(THEMES).map(([k,t])=>`<button class="th ${curTheme===k?'on':''}" data-tt="${k}" style="background:${t.panel};border-color:${t.gold};color:${t.ink}"><i style="background:${t.gold}"></i>${t.n}</button>`).join('')}</div>`;
  $('titleIn').innerHTML=h}
$('titleIn').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(b.id==='tCont'){UNDO.length=0;S=PENDING;ensure();hideTitle();render();scrollLog();if(!S.alive)showDead();return}
  if(d.tt){setTheme(d.tt);drawTitle();if(S)render();return}
  if(d.td){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Emin misin?';return}await delSlot(d.td);drawTitle();return}
  if(d.ts){if(SLOTS[d.ts]){await loadSlot(d.ts);hideTitle()}else{hideTitle();showCreate(d.ts)}}});
async function delSlot(k){try{if(DB){const ref=DB.collection('data/users/'+UID).doc(k);if(ref.delete)await ref.delete();else await ref.set({deleted:1})}else localStorage.removeItem('mafya-'+k)}catch(e){}SLOTS[k]=null;if(S&&S.slot===k)S.slot=null;if(PENDING&&PENDING.slot===k)PENDING.slot=null;toast('Kayıt silindi')}
ACT.menu=()=>{closeSheet();save();cloudSave(true);PENDING=JSON.parse(JSON.stringify(S));refreshSlots().then(()=>{if($('title').classList.contains('on'))drawTitle()});showTitle()};


function undo(){if(!UNDO.length){toast('Geri alınacak bir şey yok');return}
  S=JSON.parse(UNDO.pop());Q.length=0;$('modal').classList.remove('on');$('dead').classList.remove('on');try{mgClose()}catch(e){}closeSheet();
  save();cloudSave();render();scrollLog();toast('3 ay geri alındı')}
$('nUndo').onclick=undo;
/* ============ Başlat ============ */
(function(){PENDING=load();showTitle();initCloud().then(()=>{if($('title').classList.contains('on'))drawTitle()})})();
</script>
</body>
