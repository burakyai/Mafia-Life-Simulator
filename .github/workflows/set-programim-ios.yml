name: Set Programım iPhone uygulaması

# Burak'ın diğer uygulaması Set Programım'ı (github.com/burakyai/set-programim) derleyip TestFlight'a yükler.
# Bu repodaki App Store Connect anahtarlarını (Secrets) kullanır; böylece anahtarları ikinci bir repoya girmek gerekmez.
# Sadece "Run workflow" ile elle başlatılır; oyunun kendi derlemesini etkilemez.
on:
  workflow_dispatch:
    inputs:
      yukle:
        description: "TestFlight'a yükle"
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Set Programım kodunu al
        uses: actions/checkout@v4
        with:
          repository: burakyai/set-programim
          path: sp

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Xcode sürümü
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Uygulamayı hazırla
        working-directory: sp/app
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync ios
          python3 ios-customize.py

      - name: Derleme kontrolü (simülatör, imzasız)
        if: ${{ !inputs.yukle }}
        working-directory: sp/app/ios/App
        run: |
          set -eo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 30

      - name: Arşivle, imzala, TestFlight'a yükle
        if: ${{ inputs.yukle }}
        working-directory: sp/app/ios/App
        env:
          API_KEY: ${{ secrets.APPSTORE_API_KEY }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          printf '%s' "$API_KEY" > "$KEY_PATH"
          BUILD_NO=$(( ${{ github.run_number }} + 100 ))
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION=$BUILD_NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive | tail -n 40
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ../ExportOptions.plist
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ../ExportOptions.plist -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" | tail -n 40
          echo "Set Programım yapı $BUILD_NO TestFlight'a gönderildi." >> $GITHUB_STEP_SUMMARY
